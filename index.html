        const best = Save.get('stageBest') || [];
        const grid = document.getElementById('mapGrid');
        grid.innerHTML = '';

        STAGE_CONFIGS.forEach((st, i) => {
          const isOpen = i < unlocked;
          const b = best[i] || 0;
          const cleared = b >= st.requiredScore;

          const card = document.createElement('button');
          card.className = 'map-card' + (isOpen ? '' : ' locked') + (cleared ? ' cleared' : '');
          card.disabled = !isOpen;

          const meta = isOpen
            ? `Best ${b.toLocaleString()} &middot; Par ${st.requiredScore.toLocaleString()}`
            : `Needs ${STAGE_CONFIGS[i - 1].requiredScore.toLocaleString()} on map ${mapNo(i - 1)}`;

          card.innerHTML =
            (cleared ? '<span class="map-card-seal">&#10022;</span>' : '') +
            `<span class="map-card-kanji">${isOpen ? st.kanji : '錠'}</span>` +
            `<span class="map-card-no">Map ${mapNo(i)}</span>` +
            `<span class="map-card-name">${isOpen ? st.name : 'SEALED'}</span>` +
            `<span class="map-card-meta">${meta}</span>`;

          if (isOpen) {
            card.addEventListener('click', () => { audio.init(); this.startStage(i); });
            // iOS only paints :active on some elements, so mirror it explicitly
            card.addEventListener('touchstart', () => card.classList.add('pressed'), { passive: true });
            ['touchend', 'touchcancel', 'touchmove'].forEach((ev) => {
              card.addEventListener(ev, () => card.classList.remove('pressed'), { passive: true });
            });
          }
          grid.appendChild(card);
        });

        // The two ways back in that are not a numbered map: the endless road,
        // and the board it feeds. Endless opens once map 01 has been walked.
        const extra = document.getElementById('mapExtra');
        extra.innerHTML = '';
        const endlessOpen = unlocked > 1 || (best[0] || 0) > 0;
        const bestKen = Math.floor((Save.get('endlessBest') || 0) / 10);

        const mkCard = (kanji, no, name, meta, locked, onPick) => {
          const card = document.createElement('button');
          card.className = 'map-card wide' + (locked ? ' locked' : '');
          card.disabled = locked;
          card.innerHTML =
            `<span class="map-card-kanji">${locked ? '錠' : kanji}</span>` +
            `<span class="map-card-no">${no}</span>` +
            `<span class="map-card-name">${name}</span>` +
            `<span class="map-card-meta">${meta}</span>`;
          if (!locked) {
            card.addEventListener('click', () => { audio.init(); onPick(); });
            card.addEventListener('touchstart', () => card.classList.add('pressed'), { passive: true });
            ['touchend', 'touchcancel', 'touchmove'].forEach((ev) => {
              card.addEventListener(ev, () => card.classList.remove('pressed'), { passive: true });
            });
          }
          extra.appendChild(card);
        };

        mkCard('無', 'No End', 'THE ENDLESS ROAD',
          endlessOpen
            ? (bestKen ? `Furthest ${bestKen.toLocaleString()} ken` : 'One life, no gate')
            : 'Walk map 01 first',
          !endlessOpen, () => this.startEndless());

        const rows = RunBoard.all();
        mkCard('番', 'Ranking', 'RUN BOARD',
          rows.length ? `${rows.length} run${rows.length === 1 ? '' : 's'} posted` : 'Nothing posted yet',
          false, () => this.showRunBoard(null, 0));

        const nextLocked = STAGE_CONFIGS[unlocked];
        document.getElementById('mapFoot').textContent = nextLocked
          ? `Score ${STAGE_CONFIGS[unlocked - 1].requiredScore.toLocaleString()} on map ${mapNo(unlocked - 1)} to unseal ${nextLocked.name}`
          : 'Every path lies open';
      }

      showMapSelect() {
        this.isRunning = false;
        this.isPaused = false;
        // Pausing ducks the mix; leaving a paused run this way must undo that
        audio.setMuted(false);
        Bark.clear();
        window.GameEvents.gameplayStop();
        this.renderMapSelect();
        this.setOverlayMode('maps', {
          kanji: '選',
          title: 'FREE PLAY',
          subtitle: 'Every map on its own, no story · par seals the next'
        });
        this.setOverlayButtons({ story: true });
      }

      // Fresh attempt at a map: score restarts, so par is always per-map.
      // `mode` is 'stage' for free play and 'story' for a chapter — the map
      // geometry is identical either way, only what clearing it means differs.
      startStage(idx, mode = 'stage') {
        this.mode = mode;
        this.stageIdx = idx;
        this.score = 0;
        this.combo = 1.0;
        this.comboTimer = 0;
        this.activeCheckpoint = null;
        this.runCoins = 0;
        if (mode !== 'story') this.runtimeBeats = [];
        this.loadStage(idx);
        this.player.health = CONFIG.MAX_HEALTH;
        this.updateHUD();

        document.getElementById('overlay').classList.add('hidden');
        Bark.clear();
        input.clearPresses();
        this.isRunning = true;
        this.isPaused = false;
        audio.setMuted(false);
        window.GameEvents.gameplayStart();
        this.lastTime = performance.now();
        if (!Save.get('seenControlHint')) {
          Save.write({ seenControlHint: true });
        }
      }

      // A midgame break, but only between maps and never twice inside a few
      // minutes. GameEvents.requestAd already pauses the run and always calls
      // back, ad or no ad, so the game cannot stall behind it.
      withAdBreak(next) {
        const now = Date.now();
        if (this.lastAdAt && now - this.lastAdAt < 180000) { next(); return; }
        this.lastAdAt = now;
        let done = false;
        const go = () => { if (!done) { done = true; next(); } };
        // Belt and braces: if the portal never calls back, start anyway
        setTimeout(go, 8000);
        window.GameEvents.requestAd(go, 'midgame');
      }

      // Endless: no torii, no checkpoints, no par. The road is generated ahead
      // of the samurai and the run ends when the third hit lands.
      startEndless() {
        this.mode = 'endless';
        this.stageIdx = -1;
        this.score = 0;
        this.combo = 1.0;
        this.comboTimer = 0;
        this.endlessDist = 0;
        this.activeCheckpoint = null;
        this.runCoins = 0;
        this.stage = {
          id: 0, kanji: '無', name: 'THE ENDLESS ROAD',
          width: 1e7, height: ENDLESS.PIT_FLOOR + 60,
          checkpoints: [], torii: null
        };
        setTheme('day');   // the road is the daylit world, forever
        Bark.clear();
        input.clearPresses();
        this.endless.begin();
        this.player.reset(200, 420);
        this.player.health = CONFIG.MAX_HEALTH;
        camera.x = this.player.x;
        camera.y = this.player.y;

        const el = document.getElementById('stageTitle');
        if (el) el.textContent = 'THE ENDLESS ROAD — 0 KEN';
        this.updateHUD();

        document.getElementById('overlay').classList.add('hidden');
        this.isRunning = true;
        this.isPaused = false;
        audio.setMuted(false);
        window.GameEvents.gameplayStart();
        this.lastTime = performance.now();
      }

      // The run is over: bank it, rank it, and put the board in front of them.
      endEndlessRun() {
        window.GameEvents.gameplayStop();
        this.isRunning = false;
        camera.shake(6, 0.4);

        const dist = Math.floor(this.endlessDist);
        const entry = {
          name: playerName(),
          score: this.score,
          dist,
          at: Date.now()
        };
        const rank = RunBoard.submit(entry);

        Save.write({
          coinsTotal: (Save.get('coinsTotal') || 0) + this.runCoins,
          highScore: Math.max(Save.get('highScore') || 0, this.highScore),
          endlessBest: Math.max(Save.get('endlessBest') || 0, dist)
        });
        this.runCoins = 0;

        setTimeout(() => this.showRunBoard(entry, rank), 600);
      }

      startOrResume() {
        // Splash button doubles as the pause resume
        if (this.isPaused) {
          document.getElementById('overlay').classList.add('hidden');
          this.isPaused = false;
          this.isRunning = true;
          input.clearPresses();
          window.GameEvents.gameplayStart();
          this.lastTime = performance.now();
          return;
        }
        // The front door is the story. Free play is one button away, but the
        // default for someone who just pressed the big green triangle is the
        // road the game was written around.
        this.startStory();
      }

      // Distance is earned by surviving, not by chaining, so it must not feed
      // the combo meter or the multiplier would climb on its own.
      addRaw(pts) {
        this.score += pts;
        if (this.score > this.highScore) this.highScore = this.score;
        this.updateHUD();
      }

      addScore(pts) {
        this.score += Math.round(pts * this.combo);
        this.comboTimer = CONFIG.COMBO_DECAY_TIME;
        this.combo = Math.min(5.0, Number((this.combo + 0.2).toFixed(1)));
        if (this.score > this.highScore) {
          this.highScore = this.score;
        }
        this.updateHUD();
      }

      updateHUD() {
        document.getElementById('scoreDisplay').textContent = this.score.toLocaleString();
        document.getElementById('highScoreDisplay').textContent = 'HIGH: ' + this.highScore.toLocaleString();
        const badge = document.getElementById('comboBadge');
        if (this.combo > 1.0) {
          badge.innerHTML = '<span class="combo-x">x</span> ' + this.combo.toFixed(1) + ' <span class="combo-lbl">Combo</span>';
          badge.classList.add('active');
        } else {
          badge.classList.remove('active');
        }
        // Health dots
        ['dot1', 'dot2', 'dot3'].forEach((id, i) => {
          const el = document.getElementById(id);
          if (i < this.player.health) el.classList.remove('lost');
          else el.classList.add('lost');
        });
      }

      onPlayerDeath() {
        this.combo = 1.0;
        this.updateHUD();

        if (this.mode === 'endless') {
          this.endEndlessRun();
          return;
        }
        window.GameEvents.gameplayStop();

        // Meaningful save moment: Run ended
        const currentCoins = (Save.get('coinsTotal') || 0) + this.runCoins;
        this.runCoins = 0;
        const bestScore = Math.max(Save.get('highScore') || 0, this.highScore);
        Save.write({
          coinsTotal: currentCoins,
          highScore: bestScore,
          seenControlHint: true
        });

        // Instant checkpoint respawn
        setTimeout(() => {
          this.loadStage(this.stageIdx, true);
          this.player.health = CONFIG.MAX_HEALTH;
          this.updateHUD();
          window.GameEvents.gameplayStart();
        }, 150);
      }

      onStageComplete() {
        window.GameEvents.levelComplete();
        audio.playStageClear();
        camera.shake(5, 0.4);
        particles.burstInk(this.stage.torii.x, this.stage.torii.y, 40, CONFIG.GOLD);
        window.GameEvents.gameplayStop();
        this.isRunning = false;
        Bark.clear();

        // The story has its own bookkeeping: it advances on reaching the gate
        // rather than on meeting par, and it has a scene to play first.
        if (this.mode === 'story') {
          const earned = this.score;
          setTimeout(() => this.onChapterComplete(earned), 700);
          return;
        }

        const idx = this.stageIdx;
        const par = STAGE_CONFIGS[idx].requiredScore;
        const earned = this.score;
        const passed = earned >= par;
        const isLast = idx >= STAGE_CONFIGS.length - 1;

        // Reaching the torii is not enough on its own: the next map only opens
        // when this run also met par, so a sloppy clear has to be replayed.
        const wasUnlocked = Save.get('stagesUnlocked') || 1;
        const nextUnlocked = (passed && !isLast)
          ? Math.max(wasUnlocked, idx + 2)
          : wasUnlocked;

        const best = (Save.get('stageBest') || []).slice();
        best[idx] = Math.max(best[idx] || 0, earned);

        Save.write({
          stageBest: best,
          stagesUnlocked: nextUnlocked,
          coinsTotal: (Save.get('coinsTotal') || 0) + this.runCoins,
          highScore: Math.max(Save.get('highScore') || 0, this.highScore),
          seenControlHint: true
        });
        this.runCoins = 0;

        setTimeout(() => {
          this.showResult(idx, earned, par, passed, isLast, nextUnlocked > wasUnlocked);
        }, 700);
      }

      // The board, shown either after an endless run or straight from the map
      // screen. `justRan` is the entry that was posted this run, if any.
      showRunBoard(justRan, rank) {
        this.isRunning = false;
        this.isPaused = false;
        audio.setMuted(false);
        window.GameEvents.gameplayStop();

        const rows = RunBoard.all();
        const body = document.getElementById('boardRows');
        body.innerHTML = rows.map((r, i) => {
          const mine = justRan && r.at === justRan.at;
          const cls = 'board-row' + (mine ? ' you' : '') + (i === 0 ? ' top' : '');
          return `<div class="${cls}">` +
                 `<span class="rank">${i + 1}</span>` +
                 `<span>${escapeText(r.name || 'RONIN')}</span>` +
                 `<span>${Math.floor((r.dist || 0) / 10).toLocaleString()}</span>` +
                 `<span>${(r.score || 0).toLocaleString()}</span>` +
                 `</div>`;
        }).join('');
        document.getElementById('boardEmpty').classList.toggle('hidden', rows.length > 0);

        const nameInput = document.getElementById('nameInput');
        nameInput.value = playerName();
        nameInput.placeholder = cgUserName || 'RONIN';

        let subtitle;
        if (justRan && rank) {
          subtitle = `${Math.floor(justRan.dist / 10).toLocaleString()} ken · ` +
                     `${justRan.score.toLocaleString()} pts · rank ${rank}`;
        } else if (justRan) {
          const cut = rows.length ? rows[rows.length - 1].score : 0;
          subtitle = `${justRan.score.toLocaleString()} pts — ` +
                     `${(cut - justRan.score + 1).toLocaleString()} short of the board`;
        } else {
          subtitle = 'The furthest anyone has walked this road';
        }

        this.setOverlayMode('board', {
          kanji: rank === 1 ? '極' : '番',
          title: justRan ? (rank === 1 ? 'NEW BEST' : 'RUN ENDED') : 'RUN BOARD',
          subtitle
        });
        this.retryAction = () => this.startEndless();
        this.setOverlayButtons({ retry: true, maps: true, story: true,
                                 retryLabel: 'Run Again' });
      }

      showResult(idx, earned, par, passed, isLast, justUnlocked) {
        const stage = STAGE_CONFIGS[idx];
        const best = (Save.get('stageBest') || [])[idx] || 0;

        document.getElementById('resultRows').innerHTML =
          `<div class="result-row"><span>This run</span><span>${earned.toLocaleString()}</span></div>` +
          `<div class="result-row is-goal"><span>Par</span><span>${par.toLocaleString()}</span></div>` +
          `<div class="result-row"><span>Best here</span><span>${best.toLocaleString()}</span></div>`;

        // Animate the gauge from zero so the shortfall is legible at a glance
        const fill = document.getElementById('resultGaugeFill');
        fill.classList.toggle('pass', passed);
        fill.style.width = '0%';
        requestAnimationFrame(() => {
          fill.style.width = Math.min(100, Math.round(earned / par * 100)) + '%';
        });

        const verdict = document.getElementById('resultVerdict');
        verdict.classList.toggle('pass', passed);
        verdict.classList.toggle('fail', !passed);
        if (isLast && passed) {
          verdict.textContent = 'Every map cleared at par. You mastered the ink path.';
        } else if (justUnlocked) {
          verdict.textContent = `${STAGE_CONFIGS[idx + 1].name} is now open`;
        } else if (passed) {
          verdict.textContent = 'Par met. The road ahead was already open.';
        } else {
          verdict.textContent =
            `${(par - earned).toLocaleString()} points short. The next map stays sealed.`;
        }

        this.setOverlayMode('result', {
          kanji: passed ? '極' : '未',
          title: passed ? 'CLEARED' : 'FELL SHORT',
          subtitle: stage.name
        });
        this.retryAction = () => this.startStage(idx);
        this.setOverlayButtons({ retry: true, next: passed && !isLast,
                                 maps: true, story: true });
      }

      // ===================================================================
      // FIXED PHYSICS TICK (DETERMINISTIC ACROSS ALL MONITORS)
      // ===================================================================
      physicsTick(dt) {
        // Zanshin powerup slows world physics by 50% while player is 100%
        const worldSpeed = (this.player.powerup === 'zanshin') ? 0.5 : 1.0;
        const worldDt = dt * worldSpeed;

        // 1. Combo multiplier decay
        if (this.comboTimer > 0) {
          this.comboTimer -= dt;
          if (this.comboTimer <= 0) {
            this.combo = 1.0;
            this.updateHUD();
          }
        }

        // 2. Moving & Crumbling Platforms
        for (const p of this.runtimePlatforms) {
          if (p.moving) {
            p.phase = (p.phase || 0) + worldDt * (p.moveSpeed || 1);
            if (p.moveX) p.x = p.baseX + Math.sin(p.phase) * p.moveX;
            if (p.moveY) p.y = p.baseY + Math.sin(p.phase) * p.moveY;
          }
          if (p.crumbleTimer > 0) {
            p.crumbleTimer -= worldDt;
            if (p.crumbleTimer <= 0) {
              p.isFallen = true;
              p.respawnTimer = 3.0;
              particles.burstInk(p.x + p.w / 2, p.y + p.h / 2, 10, '#9C8B78');
            }
          } else if (p.isFallen) {
            p.respawnTimer -= worldDt;
            if (p.respawnTimer <= 0) {
              p.isFallen = false;
              p.crumbleTimer = 0;
            }
          }
        }

        // 3. Moving Hazards (Saws) and summoned ones (mon's stakes)
        for (let i = this.runtimeHazards.length - 1; i >= 0; i--) {
          const h = this.runtimeHazards[i];
          if (h.type === 'saw') {
            h.curX += h.dir * h.speed * worldDt;
            if (h.curX > h.endX) { h.curX = h.endX; h.dir = -1; }
            if (h.curX < h.startX) { h.curX = h.startX; h.dir = 1; }
          } else if (h.temp) {
            // Rise, bite, sink, gone. `armed` is the only thing that can hurt
            // the player, and it is false for the whole of the rise — so the
            // animation the player is watching IS the fair warning.
            if (h.warn > 0) {
              h.warn -= worldDt;
              h.rise = Math.max(0, Math.min(1, 1 - h.warn / h.warnMax));
              if (h.warn <= 0) { h.armed = true; h.rise = 1; }
            } else {
              h.life -= worldDt;
              if (h.life <= 0.25) h.rise = Math.max(0, h.life / 0.25);
              if (h.life <= 0) { this.runtimeHazards.splice(i, 1); continue; }
            }
          }
        }

        // 4. Update Player
        this.player.update(dt, this.runtimePlatforms, this.runtimeDestructibles);

        // 4B. Endless: extend the road ahead, drop what is behind, and pay out
        // for ground covered. Distance only ever counts forward progress.
        if (this.mode === 'endless') {
          this.endless.stream(this.player.x);
          const travelled = Math.max(0, this.player.x - 200);
          if (travelled > this.endlessDist) {
            const before = Math.floor(this.endlessDist / 100);
            this.endlessDist = travelled;
            const after = Math.floor(this.endlessDist / 100);
            if (after > before) {
              this.addRaw((after - before) * 10);
              const el = document.getElementById('stageTitle');
              if (el) el.textContent =
                'THE ENDLESS ROAD — ' + Math.floor(this.endlessDist / 10).toLocaleString() + ' KEN';
            }
          }
        }

        // Pit death check. reset() rebuilds the player from scratch, health
        // included, so the hit the pit just cost has to be carried across it —
        // otherwise falling in is free.
        if (this.player.y > this.stage.height + 60) {
          this.player.damage(1);
          if (this.player.health > 0) {
            const carried = this.player.health;
            if (this.mode === 'endless') {
              this.endlessRespawn();
            } else {
              const sp = this.activeCheckpoint || this.stage.spawn;
              this.player.reset(sp.x, sp.y);
            }
            this.player.health = carried;
            this.player.invulnTimer = Math.max(this.player.invulnTimer, 1.0);
            this.updateHUD();
          }
        }

        // Story beats: a line floats up the first time he passes its mark
        if (this.mode === 'story') this.updateBeats();

        // Textless onboarding: a glyph fades in as he reaches it and is gone
        // for good the moment the matching input is used.
        if (this.runtimePrompts.length) this.updatePrompts(dt);
        this.player.evtJump = this.player.evtDash = this.player.evtSlash = false;

        // 5. Enemies update & combat
        const playerBox = {
          x: this.player.x - this.player.w / 2,
          y: this.player.y - this.player.h / 2,
          w: this.player.w,
          h: this.player.h
        };
        const slashReach = (this.player.powerup === 'edge') ? CONFIG.SLASH_RANGE_POWERED : CONFIG.SLASH_RANGE_NORMAL;
        const slashBox = this.player.isSlashing ? {
          x: this.player.facing > 0 ? this.player.x : this.player.x - slashReach,
          y: this.player.y - 24,
          w: slashReach,
          h: 48
        } : null;

        for (const e of this.runtimeEnemies) {
          if (!e.active) continue;
          // Animation clock ticks with the world, so hitstop and Zanshin slow
          // the enemies' limbs too instead of only their positions.
          e.animT = (e.animT || 0) + worldDt;

          // A boss runs its own fight loop — multi-hit health, a telegraph and
          // a volley. Everything past this point is the one-slash-kill path.
          if (e.type === 'boss') {
            this.updateBoss(e, worldDt, slashBox, playerBox);
            continue;
          }
          if (e.type === 'warden') {
            this.updateWarden(e, worldDt, slashBox, playerBox);
            continue;
          }

          // Oni patrol
          if (e.type === 'oni') {
            e.curX += e.vx * worldDt;
            if (e.curX > e.maxX) { e.curX = e.maxX; e.vx = -80; e.facing = -1; }
            if (e.curX < e.minX) { e.curX = e.minX; e.vx = 80; e.facing = 1; }
          }
          // Paper Lantern floating sine drift
          else if (e.type === 'lantern') {
            e.phase += worldDt * e.freq;
            e.curY = e.y + Math.sin(e.phase) * e.amp;
          }
          // Archer shooting
          else if (e.type === 'archer') {
            e.shootTimer -= worldDt;
            if (e.shootTimer <= 0) {
              e.shootTimer = 2.4;
              // Shoot slow ink arrow towards player
              const dir = (this.player.x < e.curX) ? -1 : 1;
              this.arrows.push({
                x: e.curX, y: e.curY - 6,
                vx: dir * 180,
                active: true, owner: e
              });
            }
          }

          const enemyBox = {
            x: e.curX - 16, y: (e.curY || e.y) - 20, w: 32, h: 40
          };

          // Hit by Katana Slash
          if (slashBox && testAABB(slashBox, enemyBox)) {
            e.active = false;
            audio.playHit();
            particles.burstInk(e.curX, enemyBox.y + 20, 24, CONFIG.CRIMSON);
            this.addScore(150);
            this.hitStopTimer = CONFIG.HITSTOP_TIME;
            camera.shake(3.5, 0.12);

            // Aerial bounce mechanic allows chaining slashes
            if (!this.player.isGrounded) {
              this.player.vy = CONFIG.SLASH_BOUNCE_Y;
              this.player.hasAirDash = true; // Refresh air dash on enemy kill!
            }
            continue;
          }

          // Enemy touches player
          if (testAABB(playerBox, enemyBox)) {
            if (this.player.damage(1)) {
              this.updateHUD();
            }
          }
        }

        // 6. Projectile Arrows
        for (let i = this.arrows.length - 1; i >= 0; i--) {
          const arr = this.arrows[i];
          arr.x += arr.vx * worldDt;

          // Nothing else retires a bolt that misses, and a boss volley is five
          // at a time — without this an endless run accumulates them forever.
          if (Math.abs(arr.x - this.player.x) > 1600) {
            this.arrows.splice(i, 1);
            continue;
          }

          const r = arr.big ? 18 : 12;
          const arrowBox = { x: arr.x - r, y: arr.y - r / 3, w: r * 2, h: r / 1.5 };

          // Slash deflects arrow. A shockwave is the one thing it cannot
          // touch: hano's waves have to be jumped, and a player who has
          // learned to parry everything needs one thing that says otherwise.
          if (slashBox && !arr.noParry && testAABB(slashBox, arrowBox)) {
            arr.vx = -arr.vx * 1.5; // reflect backwards
            arr.deflected = true;   // drives the gold tint, see the render pass
            audio.playDeflect();
            particles.burstInk(arr.x, arr.y, 8, CONFIG.GOLD);
            camera.shake(2, 0.08);
            continue;
          }

          // Arrow hits player
          if (testAABB(playerBox, arrowBox)) {
            if (this.player.damage(1)) {
              this.updateHUD();
            }
            this.arrows.splice(i, 1);
            continue;
          }

          // Arrow hits an enemy while deflected. `owner` is the shooter: a bolt
          // spawns inside the hurtbox of whatever fired it, so without this the
          // shooter kills itself on its own first shot.
          for (const e of this.runtimeEnemies) {
            if (!e.active || e === arr.owner) continue;
            const boss = e.type === 'boss';
            const warden = e.type === 'warden';
            if ((boss || warden) && (e.state === 'dying' || e.invulnT > 0)) continue;
            const eb = boss ? bossBox(e)
                     : warden ? wardenBox(e)
                     : { x: e.curX - 16, y: (e.curY || e.y) - 20, w: 32, h: 40 };
            if (testAABB(arrowBox, eb)) {
              if (boss) {
                // A parried bolt is worth one slash. It is the only ranged
                // answer the samurai has, so it has to actually count.
                this.damageBoss(e, 1);
              } else if (warden) {
                // Kani's own kunai, sent back at him. Worth exactly one
                // slash, which makes parrying his volley the fastest way
                // through the fight rather than merely the safest.
                this.damageWarden(e, 1);
              } else {
                e.active = false;
                audio.playHit();
                particles.burstInk(e.curX, eb.y + 20, 20, CONFIG.CRIMSON);
                this.addScore(200);
              }
              this.arrows.splice(i, 1);
              break;
            }
          }
        }

        // 7. Hazard collisions (Spikes & Saws)
        for (const h of this.runtimeHazards) {
          // A summoned stake is scenery until it is all the way out
          if (h.temp && !h.armed) continue;
          const hBox = (h.type === 'saw')
            ? { x: h.curX - 18, y: h.y - 18, w: 36, h: 36 }
            : { x: h.x, y: h.y, w: h.w, h: h.h };

          if (testAABB(playerBox, hBox)) {
            if (this.player.damage(1)) {
              this.updateHUD();
            }
          }
        }

        // 8. Pickups (Coins, Koban, Powerups, Checkpoints, Torii Gate)
        for (let i = 0; i < this.runtimeCoins.length; i++) {
          const c = this.runtimeCoins[i];
          if (c.collected) continue;
          if (Math.hypot(this.player.x - c.x, this.player.y - c.y) < 28) {
            c.collected = true;
            this.runCoins += 1;
            this.addScore(50);
            audio.playCoin(i);
            particles.burstInk(c.x, c.y, 6, CONFIG.GOLD);
          }
        }

        // Rare Koban
        if (this.runtimeKoban && !this.runtimeKoban.collected) {
          const kb = this.runtimeKoban;
          if (Math.hypot(this.player.x - kb.x, this.player.y - kb.y) < 32) {
            kb.collected = true;
            this.runCoins += 10;
            this.addScore(500);
            audio.playKoban();
            particles.burstInk(kb.x, kb.y, 25, CONFIG.GOLD);
            camera.shake(3, 0.15);
          }
        }

        // Powerups
        for (const p of this.runtimePowerups) {
          if (p.collected) continue;
          if (Math.hypot(this.player.x - p.x, this.player.y - p.y) < 32) {
            p.collected = true;
            this.player.applyPowerup(p.type);
            particles.burstInk(p.x, p.y, 18, CONFIG.CRIMSON);
          }
        }

        // Checkpoints (Stone lanterns)
        for (const cp of this.runtimeCheckpoints) {
          if (Math.hypot(this.player.x - cp.x, this.player.y - cp.y) < 48) {
            if (this.activeCheckpoint !== cp) {
              this.activeCheckpoint = cp;
              audio.playCheckpoint();
              particles.burstInk(cp.x, cp.y - 20, 15, CONFIG.GOLD);
            }
          }
        }

        // Torii Gate Clear (the endless road has no gate to reach). On a map
        // with a boss the gate is sealed until it is down — the fight is the
        // map's last obstacle, not something to run past.
        if (this.stage.torii && !this.bossAlive() &&
            Math.hypot(this.player.x - this.stage.torii.x,
                       this.player.y - (this.stage.torii.y - 40)) < 40) {
          this.onStageComplete();
        }

        this.updateBossHUD();

        // Update particles
        particles.update(dt);

        // Update camera
        camera.update(this.player, dt, this.stage.width, this.stage.height);
      }

      // ===================================================================
      // BOSS FIGHTS
      // ===================================================================
      // One hovering boss guards the gate of maps 04, 07 and 10, and the
      // endless road throws one at the samurai every so often. The loop is
      // always the same three beats, so it can be learned once and then read
      // at speed: HUNT (it closes on him) -> WIND (half a second of tell, both
      // on the sprite and in the horn) -> STRIKE (a fan of bolts). Below half
      // health every beat runs faster and the fan gets wider.
      //
      // Every clock here is on `worldDt`, so hitstop and Zanshin slow a boss
      // exactly as much as they slow everything else.

      // Any boss or warden still fighting on this map — the gate stays sealed
      // while this is true. Cheap enough to call per frame.
      bossAlive() {
        for (const e of this.runtimeEnemies) {
          if ((e.type === 'boss' || e.type === 'warden') &&
              e.active && e.state !== 'dying') return true;
        }
        return false;
      }

      updateBoss(e, dt, slashBox, playerBox) {
        e.bob += dt * 2.2;

        // Death is a fixed 1.5s of sinking and fading, then it is gone. It is
        // not interactive: nothing the player does during it changes anything.
        if (e.state === 'dying') {
          e.deathT += dt;
          e.curY += 34 * dt;
          if (e.deathT > 1.5) e.active = false;
          return;
        }

        if (e.invulnT > 0) e.invulnT -= dt;
        e.stateT += dt;

        const enraged = e.hp <= e.maxHp / 2;
        const toPlayer = this.player.x - e.curX;
        e.facing = toPlayer < 0 ? -1 : 1;

        if (e.state === 'hunt') {
          // Closes to arm's length and no further, so it does not simply park
          // on top of the samurai and grind him down by contact.
          if (Math.abs(toPlayer) > 84) {
            e.curX += Math.sign(toPlayer) * (enraged ? 118 : 82) * dt;
          }
          e.curX = Math.max(e.minX, Math.min(e.maxX, e.curX));
          if (e.stateT > (enraged ? 1.15 : 1.8)) {
            e.state = 'wind'; e.stateT = 0;
            audio.playBossTell();
          }
        } else if (e.state === 'wind') {
          if (e.stateT > 0.55) {
            e.state = 'strike'; e.stateT = 0;
            this.bossVolley(e, enraged);
          }
        } else if (e.state === 'strike') {
          if (e.stateT > 0.35) { e.state = 'hunt'; e.stateT = 0; }
        } else if (e.state === 'hurt') {
          // A stagger, not a reset: stateT keeps running underneath it (see
          // damageBoss), so chaining slashes can interrupt a wind-up but can
          // never lock the boss out of ever attacking.
          if (e.invulnT <= 0.24) e.state = 'hunt';
        }

        e.curY = e.homeY + Math.sin(e.bob) * 16;

        const box = bossBox(e);

        // The invulnerability window is what makes this a fight rather than one
        // swing: a slash arc is live for 0.12s and would otherwise land its
        // whole duration against the same hurtbox.
        if (slashBox && e.invulnT <= 0 && testAABB(slashBox, box)) {
          this.damageBoss(e, 1);
          // The aerial chain still pays out, so a boss can be juggled the same
          // way a line of oni can.
          if (!this.player.isGrounded) {
            this.player.vy = CONFIG.SLASH_BOUNCE_Y;
            this.player.hasAirDash = true;
          }
          return;
        }

        if (testAABB(playerBox, box)) {
          if (this.player.damage(1)) this.updateHUD();
        }
      }

      // The tell resolves into a fan of bolts. They go into the same list the
      // caster's arrows do, so the parry the caster taught still works here —
      // and a deflected bolt comes back for real damage.
      bossVolley(e, enraged) {
        const dir = e.facing;
        // Heights are measured off the FLOOR, not off the boss, and the stack
        // stops well below a jump apex. That makes the volley a thing to jump
        // rather than a wall of damage: standing still is always wrong, and
        // there is always a height that is right. Parrying still works too.
        const floor = e.floorY || (e.curY + 80);
        const rows = enraged ? [-20, -62, -104] : [-20, -62];
        for (const dy of rows) {
          this.arrows.push({
            // Clear of its own hurtbox, so the fan is not sitting on top of the
            // boss for the frames the player could parry it in place.
            x: e.curX + dir * 52,
            y: floor + dy,
            vx: dir * (enraged ? 250 : 205),
            active: true, big: true, owner: e
          });
        }
        camera.shake(3, 0.1);
      }

      damageBoss(e, amount) {
        if (e.state === 'dying') return;
        e.hp -= amount;
        // Long enough that a single 0.12s slash arc cannot land twice, and long
        // enough again that the fight has a rhythm instead of being one combo.
        e.invulnT = 0.5;
        // stateT is deliberately NOT reset: the attack clock runs through the
        // stagger, so a player who never stops swinging still has to deal with
        // the volley instead of holding the boss down forever.
        e.state = 'hurt';
        audio.playHit();
        particles.burstInk(e.curX, e.curY, 26, CONFIG.CRIMSON);
        this.hitStopTimer = CONFIG.HITSTOP_TIME * 1.7;
        camera.shake(5, 0.16);
        this.addScore(120);
        // Knocked back along the arena, never out of it.
        e.curX = Math.max(e.minX, Math.min(e.maxX, e.curX + e.facing * 30));
        if (e.hp <= 0) this.killBoss(e);
      }

      killBoss(e) {
        e.hp = 0;
        e.state = 'dying'; e.stateT = 0; e.deathT = 0;
        e.invulnT = 0;
        audio.playBossDown();
        particles.burstInk(e.curX, e.curY, 60, CONFIG.GOLD);
        particles.burstInk(e.curX, e.curY, 40, CONFIG.CRIMSON);
        camera.shake(9, 0.5);
        this.hitStopTimer = 0.18;
        this.addScore(1200);
        // It pays out where it died, so the reward is on the way to the gate
        // it was blocking rather than a number that appears in the corner.
        for (let i = 0; i < 6; i++) {
          this.runtimeCoins.push({
            x: e.curX - 150 + i * 60, y: e.curY + 40, collected: false
          });
        }
      }

      // ===================================================================
      // WARDEN FIGHTS (CHAPTERS 11-13)
      // ===================================================================
      // One state machine, three move lists. See WARDEN_ART for the contract;
      // the short version is that a warden is only dangerous inside the ACTIVE
      // window of a move it has already telegraphed, so every death in these
      // three fights is a window the player misread rather than a body they
      // stood too close to.

      // How far into the current move we are, by name. Kept in one place so
      // the update and the renderer can never disagree about it.
      wardenWindow(e) {
        const m = e.move;
        if (!m) return null;
        const wind = m.wind * (e.phase === 3 ? 0.78 : e.phase === 2 ? 0.9 : 1);
        if (e.moveT < wind) return 'wind';
        if (e.moveT < wind + m.active) return 'active';
        return 'rest';
      }

      // The live hitbox of a melee/dash/leap move. Null unless it is ACTIVE.
      wardenHitBox(e) {
        const m = e.move;
        if (!m || !m.reach || this.wardenWindow(e) !== 'active') return null;
        const top = e.curY + (m.boxY || -60);
        if (m.both) {
          return { x: e.curX - m.reach, y: top, w: m.reach * 2, h: m.boxH || 50 };
        }
        // Starts a little inside the body so a move cannot connect behind him
        return {
          x: e.facing > 0 ? e.curX - 8 : e.curX - m.reach + 8,
          y: top, w: m.reach, h: m.boxH || 50
        };
      }

      // Pick the next move: in phase, off cooldown, and the player standing in
      // its range band. Weighted, so a warden has favourites without being a
      // fixed loop the player can recite.
      pickWardenMove(e, art, dist) {
        const pool = [];
        let total = 0;
        for (const m of art.moves) {
          if ((m.phase || 1) > e.phase) continue;
          if ((e.cools[m.id] || 0) > 0) continue;
          const lo = m.range ? m.range[0] : 0;
          const hi = m.range ? m.range[1] : 9999;
          if (dist < lo || dist > hi) continue;
          // Never heal at full health: it would read as the boss wasting a turn
          if (m.kind === 'heal' && e.hp >= e.maxHp) continue;
          pool.push(m); total += (m.weight || 1);
        }
        if (!pool.length) return null;
        let r = Math.random() * total;
        for (const m of pool) {
          r -= (m.weight || 1);
          if (r <= 0) return m;
        }
        return pool[pool.length - 1];
      }

      startWardenMove(e, m) {
        e.state = 'move';
        e.move = m;
        e.moveT = 0;
        e.didHit = false;
        e.firedAt = false;
        e.launched = false;
        e.guarding = false;
        // Facing is locked in for the whole move. A charge that re-aims itself
        // mid-flight is not a telegraph, it is a homing missile.
        e.facing = (this.player.x < e.curX) ? -1 : 1;
        audio.playWardenTell();
      }

      endWardenMove(e) {
        const art = WARDEN_ART[e.kind] || WARDEN_ART.kani;
        const m = e.move;
        e.cools[m.id] = m.cool || 1.2;
        e.move = null;
        e.guarding = false;
        e.state = 'idle';

        // Two ways a move runs straight into another one with no gap and no
        // fresh telegraph, both of them punishments for a specific habit:
        //   the counter — the samurai swung into a raised guard
        //   the chain   — phase 3, where nothing is held back any more
        let follow = null;
        if (e.counter && art.counterMove) {
          e.counter = false;
          follow = art.counterMove;
        } else if (m.chain && e.phase === 3) {
          follow = m.chain;
        }
        if (follow) {
          const nextMove = art.moves.find(x => x.id === follow);
          // Only if it is actually unlocked — a counter must not smuggle a
          // phase-2 move into phase 1.
          if (nextMove && (nextMove.phase || 1) <= e.phase) {
            this.startWardenMove(e, nextMove);
            return;
          }
        }
        e.counter = false;
        e.gap = e.phase === 3 ? 0.28 : e.phase === 2 ? 0.5 : 0.78;
      }

      updateWarden(e, dt, slashBox, playerBox) {
        const art = WARDEN_ART[e.kind] || WARDEN_ART.kani;

        // Death: he stays on the floor and fades. Not interactive.
        if (e.state === 'dying') {
          e.deathT += dt;
          if (e.deathT > 2.4) e.active = false;
          return;
        }

        if (e.invulnT > 0) e.invulnT -= dt;
        if (e.gap > 0) e.gap -= dt;
        if (e.clangT > 0) e.clangT -= dt;
        // The mashing counter forgets quickly, so it measures a flurry rather
        // than a whole fight's worth of damage.
        if (e.streakT > 0) {
          e.streakT -= dt;
          if (e.streakT <= 0) e.hitStreak = 0;
        }
        for (const k in e.cools) {
          if (e.cools[k] > 0) e.cools[k] -= dt;
        }

        // The fight opens on a line, once, the first time the samurai is close
        // enough that the warden is actually on screen with him.
        if (!e.greeted && Math.abs(this.player.x - e.curX) < 620) {
          e.greeted = true;
          const say = WARDEN_LINES[e.kind];
          if (say) Bark.say(e.kind, say.start, 3.6);
        }

        // Phase escalation. Each threshold is a hard beat: a roar, a second of
        // immunity so it cannot be skipped through, a line, and a charm on the
        // floor — the fight gets harder and the player gets a hit back.
        const ph = wardenPhase(e);
        if (ph > e.phase) {
          e.phase = ph;
          e.invulnT = Math.max(e.invulnT, 0.9);
          e.move = null;
          e.guarding = false;
          e.state = 'idle';
          e.gap = 0.9;
          e.cools = {};
          audio.playWardenRoar();
          camera.shake(7, 0.45);
          particles.burstInk(e.curX, e.curY - 40, 34, CONFIG.CRIMSON);
          const say = WARDEN_LINES[e.kind];
          if (say) Bark.say(e.kind, ph === 3 ? say.phase3 : say.phase2, 3.4);
          this.runtimePowerups.push({
            type: 'charm', x: e.curX + (this.player.x < e.curX ? 120 : -120),
            y: e.floorY - 40, collected: false
          });
        }

        // Airborne: the leap arc. moveT is held at the end of the wind-up
        // while he is in the air, so the ACTIVE window always begins on
        // touchdown however long the arc happens to take.
        if (e.airborne) {
          e.vy += CONFIG.GRAVITY * 0.9 * dt;
          e.curY += e.vy * dt;
          e.curX += (e.leapVx || 0) * dt;
          if (e.curY >= e.floorY && e.vy > 0) {
            e.curY = e.floorY;
            e.vy = 0;
            e.airborne = false;
            camera.shake(4, 0.18);
            particles.dust(e.curX, e.curY, 0);
          }
        }
        e.curX = Math.max(e.minX, Math.min(e.maxX, e.curX));

        const toPlayer = this.player.x - e.curX;
        const dist = Math.abs(toPlayer);

        if (e.state === 'hurt') {
          e.hurtT -= dt;
          if (e.hurtT <= 0) e.state = 'idle';
        } else if (e.state === 'move') {
          this.runWardenMove(e, dt, art, toPlayer);
        } else {
          // Idle / approach. He faces the samurai and holds his preferred
          // distance: too far and there is no fight, too close and every move
          // he has would land before the telegraph could be read.
          e.facing = toPlayer < 0 ? -1 : 1;
          const speedMult = 1 + 0.12 * (e.phase - 1);
          const want = art.hold;
          if (dist > want + 260) {
            e.curX += Math.sign(toPlayer) * art.runSpeed * speedMult * dt;
            e.gait = 'run';
          } else if (dist > want + 26) {
            e.curX += Math.sign(toPlayer) * art.speed * speedMult * dt;
            e.gait = 'walk';
          } else if (dist < want - 40) {
            e.curX -= Math.sign(toPlayer) * art.speed * 0.8 * dt;
            e.gait = 'walk';
          } else {
            e.gait = 'idle';
          }
          e.curX = Math.max(e.minX, Math.min(e.maxX, e.curX));

          // Punished for a flurry: the guard comes up out of turn, ignoring
          // the gap that would otherwise have given the player another swing.
          // hano is the only warden with this, and it is the reason his fight
          // cannot be brute-forced from directly in front of him.
          let acted = false;
          if (art.punish && e.hitStreak >= art.punish && e.invulnT <= 0) {
            const g = art.moves.find(x => x.kind === 'guard');
            if (g && (e.cools[g.id] || 0) <= 0) {
              e.hitStreak = 0;
              this.startWardenMove(e, g);
              acted = true;
            }
          }

          if (!acted && e.gap <= 0 && e.invulnT <= 0) {
            const m = this.pickWardenMove(e, art, dist);
            if (m) this.startWardenMove(e, m);
          }
        }

        // ---- the player's katana -----------------------------------------
        const hurtBox = wardenBox(e);
        if (slashBox && testAABB(slashBox, hurtBox)) {
          this.damageWarden(e, 1);
        }

        // ---- the warden's hitbox -----------------------------------------
        const hit = this.wardenHitBox(e);
        if (hit && !e.didHit && testAABB(playerBox, hit)) {
          e.didHit = true;
          if (this.player.damage(1)) this.updateHUD();
        }
      }

      // The inside of one move: advance the clock, fire on the ACTIVE edge,
      // and drive whatever motion the move's kind implies.
      runWardenMove(e, dt, art, toPlayer) {
        const m = e.move;
        // 'move' without a move is not a state this can recover into halfway.
        // Nothing sets one without the other today; this is here so a future
        // edit that does cannot take the whole frame down with it.
        if (!m) {
          e.state = 'idle';
          e.guarding = false;
          return;
        }
        const win = this.wardenWindow(e);
        const wind = m.wind * (e.phase === 3 ? 0.78 : e.phase === 2 ? 0.9 : 1);

        // Held on the wind/active boundary until he lands again
        if (!e.airborne) e.moveT += dt;

        if (win === 'wind') {
          // Leaps launch at the end of the wind-up, and only once
          if (m.kind === 'leap' && !e.launched && e.moveT >= wind * 0.92) {
            e.launched = true;
            e.airborne = true;
            e.vy = m.launchY || -500;
            // `over` clears the samurai instead of landing on him, which is
            // how mon gets out of a corner without teleporting.
            const span = m.over ? toPlayer * 1.75 : toPlayer;
            // Time to come back down, so the arc actually reaches him
            const flight = (-2 * (m.launchY || -500)) / (CONFIG.GRAVITY * 0.9);
            e.leapVx = Math.max(-460, Math.min(460, span / Math.max(0.28, flight)));
            audio.playJump(false);
          }
        } else if (win === 'active') {
          if (!e.firedAt) {
            e.firedAt = true;
            if (m.fire) this.wardenFire(e, m.fire);
            if (m.kind === 'guard') {
              e.guarding = true;
              audio.playWardenTell();
            }
            if (m.kind === 'heal') {
              audio.playFeast();
              const say = WARDEN_LINES[e.kind];
              if (say && say.heal) Bark.say(e.kind, say.heal, 2.4);
            }
            if (m.kind === 'melee' || m.kind === 'dash' || m.kind === 'leap') {
              audio.playSlash();
            }
          }
          if (m.kind === 'dash') {
            const before = e.curX;
            e.curX += e.facing * m.dash * dt;
            e.curX = Math.max(e.minX, Math.min(e.maxX, e.curX));
            // Ran out of arena: drop straight into recovery rather than
            // grinding against the wall with the hitbox still out.
            if (Math.abs(e.curX - before) < 1) e.moveT = wind + m.active;
          } else if (m.kind === 'melee' && m.lunge) {
            e.curX += e.facing * m.lunge * dt;
          } else if (m.kind === 'guard' && m.creep) {
            e.curX += e.facing * m.creep * dt;
          }
          e.curX = Math.max(e.minX, Math.min(e.maxX, e.curX));
        } else {
          // REST. Guard is down, health goes on the board, and he is open.
          if (e.guarding) e.guarding = false;
          if (m.kind === 'heal' && !e.healed) {
            e.healed = true;
            e.hp = Math.min(e.maxHp, e.hp + (m.heal || 1));
            particles.burstInk(e.curX, e.curY - 50, 22, CONFIG.LEAF);
          }
          if (e.moveT > wind + m.active + m.rest) {
            e.healed = false;
            this.endWardenMove(e);
          }
        }
      }

      // Everything a warden throws. All of it goes into the same two lists the
      // rest of the game already uses — `arrows` for things in the air and
      // `runtimeHazards` for things in the floor — so the parry, the culling
      // and the hazard collision all keep working unchanged.
      wardenFire(e, what) {
        const dir = e.facing;
        const px = this.player.x;

        if (what === 'kunai') {
          // A spread of three, parryable. Deliberately the same mechanic the
          // caster taught in map 03, at twice the speed.
          const n = e.phase >= 3 ? 3 : 2;
          for (let i = 0; i < n; i++) {
            this.arrows.push({
              x: e.curX + dir * 34, y: e.curY - 52 + (i - (n - 1) / 2) * 26,
              vx: dir * 330, active: true, owner: e,
              art: 'k_kunai', frames: 3, cell: 16, spin: Math.random() * 6.28
            });
          }
          return;
        }

        if (what === 'spines' || what === 'grove') {
          // Stakes out of the shrine floor. They rise through their own
          // animation first and only bite once they are all the way out, so
          // the telegraph is the hazard itself.
          //
          // The pattern is the escalation. Phase 1 flanks him and leaves the
          // ground he is standing on clear — the lesson, taught safely. Phase
          // 2 puts one under his feet, so from there he has to move. Phase 3
          // is the grove, five across, where only the gaps are safe.
          const spots = what === 'grove'
            ? [px - 280, px - 140, px, px + 140, px + 280]
            : e.phase === 1 ? [px - 120, px + 120]
                            : [px - 150, px, px + 150];
          for (let i = 0; i < spots.length; i++) {
            const sx = Math.max(e.minX - 120, Math.min(e.maxX + 120, spots[i]));
            // A stagger across the row reads as a wave rather than a wall
            const warn = 0.52 + i * 0.06;
            this.runtimeHazards.push({
              type: 'spike', temp: true,
              x: Math.round(sx) - 32, y: e.floorY - 34, w: 64, h: 34,
              warn, warnMax: warn, life: 1.5, armed: false, rise: 0
            });
          }
          particles.burstInk(e.curX, e.curY - 40, 16, '#E07ACD');
          return;
        }

        if (what === 'wave' || what === 'wave2' || what === 'wave3') {
          // A shockwave along the floor. It CANNOT be parried — the katana
          // passes straight through it — so the only answer is to leave the
          // ground. It is the one attack in the game that says "jump".
          const dirs = what === 'wave' ? [dir]
                     : what === 'wave2' ? [dir, -dir]
                     : [dir, -dir, dir];
          dirs.forEach((d, i) => {
            this.arrows.push({
              x: e.curX + d * 40, y: e.floorY - 16,
              vx: d * (280 + i * 70), active: true, owner: e,
              wave: true, noParry: true, big: true
            });
          });
          camera.shake(6, 0.24);
          return;
        }
      }

      damageWarden(e, amount) {
        if (e.state === 'dying') return;

        // The guard. The katana rings off it, the samurai is shoved back, and
        // nothing else happens. Mashing through this is not an option, which
        // is the whole reason the last fight is the hardest one.
        //
        // It only covers the side he is facing — the same side the plate is
        // drawn on. Getting behind a guarding warden is the answer to it, and
        // a player who works that out has earned the hit.
        const covered = (this.player.x - e.curX) * e.facing >= -6;
        if (e.guarding && covered) {
          if ((e.clangT || 0) > 0) return;
          e.clangT = 0.3;
          // Armed here, spent in endWardenMove: the block is answered the
          // instant the guard comes down.
          e.counter = true;
          audio.playGuardClang();
          particles.burstInk(e.curX + e.facing * 30, e.curY - 54, 12, '#BFD4FF');
          camera.shake(3, 0.12);
          this.hitStopTimer = CONFIG.HITSTOP_TIME;
          // Pushed out of his reach rather than damaged
          this.player.vx = (this.player.x < e.curX ? -1 : 1) * 320;
          return;
        }
        if (e.invulnT > 0) return;

        const win = this.wardenWindow(e);
        let dealt = amount;

        // Interrupting a meal. Double damage, the heal is cancelled, and the
        // player has learned the fight — so it pays like learning it.
        if (e.move && e.move.kind === 'heal' && win !== 'rest') {
          dealt = amount * 2;
          e.move = null;
          e.healed = false;
          e.state = 'hurt';
          e.hurtT = 0.34;
          this.addScore(300);
          Bark.say('ren', 'Not this time.', 2.0);
        } else if (!e.move || win === 'rest') {
          // Poise: he only staggers when he is not committed to a move. A hit
          // landed into a wind-up still counts, it just does not stop him.
          e.state = 'hurt';
          e.hurtT = 0.26;
          e.move = null;
        }

        e.hp -= dealt;
        e.invulnT = 0.4;
        // A flurry, for the wardens that answer one (see `punish`)
        e.hitStreak = (e.hitStreak || 0) + 1;
        e.streakT = 1.8;
        audio.playHit();
        particles.burstInk(e.curX, e.curY - 46, 24, CONFIG.CRIMSON);
        this.hitStopTimer = CONFIG.HITSTOP_TIME * 1.5;
        camera.shake(4.5, 0.15);
        this.addScore(110);
        // Nudged, never launched: he has to stay in his own arena.
        e.curX = Math.max(e.minX, Math.min(e.maxX,
                 e.curX + (this.player.x < e.curX ? 1 : -1) * 14));

        // The aerial chain the rest of the game runs on works here too
        if (!this.player.isGrounded) {
          this.player.vy = CONFIG.SLASH_BOUNCE_Y;
          this.player.hasAirDash = true;
        }

        if (e.hp <= 0) this.killWarden(e);
      }

      killWarden(e) {
        e.hp = 0;
        e.state = 'dying';
        e.deathT = 0;
        e.invulnT = 0;
        e.move = null;
        e.guarding = false;
        e.airborne = false;
        e.curY = e.floorY;
        audio.playBossDown();
        particles.burstInk(e.curX, e.curY - 50, 70, CONFIG.GOLD);
        particles.burstInk(e.curX, e.curY - 50, 44, CONFIG.CRIMSON);
        camera.shake(10, 0.6);
        this.hitStopTimer = 0.22;
        this.addScore(1200);
        const say = WARDEN_LINES[e.kind];
        if (say) Bark.say(e.kind, say.down, 4.0);
        // Paid out where he fell, on the way to the gate he was standing in
        for (let i = 0; i < 8; i++) {
          this.runtimeCoins.push({
            x: e.curX - 210 + i * 60, y: e.floorY - 40, collected: false
          });
        }
      }

      // Nothing calls updateBossHUD while an overlay is up, so the bar has to
      // be taken down explicitly — otherwise a death mid-fight leaves a full
      // health bar sitting over the result screen.
      hideBossBar() {
        const bar = document.getElementById('bossBar');
        if (bar) { bar.classList.remove('active'); bar.classList.remove('rage'); }
        this._bossShown = false;
        this._bossHp = null;
        this._bossPhase = null;
      }

      // The bar only exists while a boss does. Written straight to the DOM the
      // same way the rest of the HUD is.
      updateBossHUD() {
        const bar = document.getElementById('bossBar');
        if (!bar) return;
        let boss = null;
        for (const e of this.runtimeEnemies) {
          if ((e.type === 'boss' || e.type === 'warden') &&
              e.active && e.state !== 'dying') { boss = e; break; }
        }
        if (!boss) {
          if (this._bossShown) {
            bar.classList.remove('active');
            bar.classList.remove('rage');
            this._bossShown = false;
          }
          return;
        }
        const warden = boss.type === 'warden';
        const art = warden
          ? (WARDEN_ART[boss.kind] || WARDEN_ART.kani)
          : (BOSS_ART[boss.kind] || BOSS_ART.mech);
        if (this._bossShown !== boss) {
          document.getElementById('bossBarName').innerHTML =
            '<span class="boss-kanji">' + art.kanji + '</span>' + escapeText(art.name) +
            (warden ? '<span class="boss-bar-phase" id="bossBarPhase"></span>' : '');
          bar.classList.add('active');
          bar.classList.remove('rage');
          this._bossShown = boss;
          this._bossHp = null;   // force the fill to be written for this one
          this._bossPhase = null;
        }
        // Only on a change: this runs every frame and the CSS transition on the
        // fill would otherwise be restarted 60 times a second.
        if (this._bossHp !== boss.hp) {
          this._bossHp = boss.hp;
          document.getElementById('bossBarFill').style.width =
            Math.max(0, boss.hp / boss.maxHp * 100) + '%';
        }
        // A warden's phase is half of what the player needs to know, so it is
        // on the bar in words as well as in the colour of the fill.
        if (warden && this._bossPhase !== boss.phase) {
          this._bossPhase = boss.phase;
          const el = document.getElementById('bossBarPhase');
          if (el) el.textContent = 'PHASE ' + boss.phase + ' / 3';
          bar.classList.toggle('rage', boss.phase === 3);
        }
      }

      // Put the samurai back on the nearest solid ground ahead of him. Endless
      // has no checkpoints, so a pit costs a life and nothing else.
      endlessRespawn() {
        this.endless.fill(this.player.x + ENDLESS.AHEAD);
        let best = null;
        for (const pl of this.runtimePlatforms) {
          if (pl.w < 200 || pl.moving || pl.crumbling) continue;   // ground only
          if (pl.x + pl.w < this.player.x - 200) continue;
          if (!best || pl.x < best.x) best = pl;
        }
        if (best) {
          this.player.reset(Math.max(best.x + 60, this.player.x - 120), best.y - 90);
        } else {
          this.player.reset(this.player.x, 300);
        }
        this.combo = 1.0;
        this.player.invulnTimer = 1.2;
      }

      // Prompts fade in on approach, and are retired permanently by the action
      // they teach — the lesson is over the moment it has been performed once.
      updatePrompts(dt) {
        const p = this.player;
        const did = {
          move: Math.abs(p.vx) > 90,
          jump: p.evtJump,
          slash: p.evtSlash,
          dash: p.evtDash
        };
        for (const pr of this.runtimePrompts) {
          if (pr.used) {
            pr.alpha = Math.max(0, pr.alpha - dt * 3.5);
            continue;
          }
          const near = Math.abs(p.x - pr.x) < 190;
          const target = near ? 1 : 0;
          pr.alpha += (target - pr.alpha) * Math.min(1, dt * 6);
          // Only the glyph he is standing in front of can be satisfied, so
          // running past one does not silently retire the next.
          if (near && did[pr.act]) pr.used = true;
        }
      }

      // Main RAF render loop with hit-stop freeze handling
      loop(currentTime) {
        requestAnimationFrame((t) => this.loop(t));

        // Real elapsed time, needed by the two UI clocks below even on the
        // frames where the world itself is not being stepped.
        let uiDt = (currentTime - (this.uiLastTime || currentTime)) / 1000;
        this.uiLastTime = currentTime;
        if (!(uiDt > 0) || uiDt > 0.25) uiDt = 0.016;
        // The typewriter and the bark run on their own clock: a cutscene plays
        // with the world stopped, and a bark has to keep counting down through
        // a hitstop freeze or it would hang on screen mid-combo.
        Dialogue.tick(uiDt);
        Bark.tick(uiDt);

        if (!this.isRunning || this.isPaused) {
          this.render();
          return;
        }

        // Poll Gamepad
        input.pollGamepad();

        let dt = (currentTime - this.lastTime) / 1000;
        this.lastTime = currentTime;
        if (dt > 0.05) dt = 0.05; // Prevent dt spiral

        // Hit-stop brief 60ms freeze when katana connects
        if (this.hitStopTimer > 0) {
          this.hitStopTimer -= dt;
          this.render();
          return;
        }

        // Fixed-timestep physics accumulator
        this.accumulatedTime += dt;
        while (this.accumulatedTime >= this.fixedStep) {
          this.physicsTick(this.fixedStep);
          this.accumulatedTime -= this.fixedStep;
        }

        this.render();
      }

      // ===================================================================
      // PIXEL ART RENDERING
      // ===================================================================
      render() {
        const ctx = this.ctx;
        const w = camera.viewportW;
        const h = camera.viewportH;

        // Nearest-neighbour for the whole frame: every pixel on screen comes
        // from a 32px tile or a 96px cell and must not be filtered.
        ctx.imageSmoothingEnabled = false;

        ctx.fillStyle = THEME.sky;
        ctx.fillRect(0, 0, w, h);
        this.drawParallax(ctx, w, h);

        // Camera Transform with Shake
        ctx.save();
        const shake = camera.getShakeOffset();
        // Snap the camera transform to whole device pixels. The camera eases in
        // with an exponential lerp, so it otherwise parks on a fractional offset
        // and nearest-neighbour sprite sampling re-phases every frame (shimmer).
        const dpr = this.dpr || 1;
        const snap = (v) => Math.round(v * dpr) / dpr;
        const z = camera.zoom;
        ctx.translate(snap(w / 2 + shake.x), snap(h / 2 + shake.y));
        ctx.scale(z, z);
        ctx.translate(snap(-camera.x * z) / z, snap(-camera.y * z) / z);

        // Everything past this point is world space. Cull to what the camera
        // can actually see - a map is up to 6000px wide and endless has no end.
        const halfW = (w / 2) / camera.zoom + 140;
        const viewL = camera.x - halfW, viewR = camera.x + halfW;
        const onScreen = (x, ww) => (x + (ww || 0)) > viewL && x < viewR;

        // Trees and bushes sit behind the playfield
        this.drawScenery(ctx, viewL, viewR);

        // Render the exit first so the player silhouette always wins over it
        if (this.stage.torii) {
          this.drawToriiGate(ctx, this.stage.torii.x, this.stage.torii.y,
                             this.bossAlive());
        }

        // Checkpoint signposts
        for (const cp of this.runtimeCheckpoints) {
          if (!onScreen(cp.x - 30, 60)) continue;
          this.drawLantern(ctx, cp.x, cp.y, this.activeCheckpoint === cp);
        }

        // Tiled terrain
        for (const p of this.runtimePlatforms) {
          if (p.isFallen || !onScreen(p.x, p.w)) continue;
          this.drawTiledPlatform(ctx, p, viewL, viewR);
        }

        // Render Destructible barricades
        for (const d of this.runtimeDestructibles) {
          this.drawDestructible(ctx, d);
        }

        // Render Hazards (Spikes & Saws)
        for (const hz of this.runtimeHazards) {
          if (hz.type === 'spike') {
            if (onScreen(hz.x, hz.w)) this.drawSpikes(ctx, hz);
          } else if (hz.type === 'saw') {
            if (onScreen(hz.curX - 30, 60)) this.drawSaw(ctx, hz);
          }
        }

        // Render Pickups (Coins, Koban, Powerups)
        for (const c of this.runtimeCoins) {
          if (!c.collected && onScreen(c.x - 16, 32)) this.drawMonCoin(ctx, c.x, c.y);
        }
        if (this.runtimeKoban && !this.runtimeKoban.collected) {
          this.drawGoldenKoban(ctx, this.runtimeKoban.x, this.runtimeKoban.y);
        }
        for (const pw of this.runtimePowerups) {
          if (!pw.collected) this.drawPowerupItem(ctx, pw);
        }

        // Caster bolts. A deflected one turns gold, which is the whole tell
        // that the parry worked.
        for (const arr of this.arrows) {
          // A thrown kunai is a real sprite rather than a bolt of light, so
          // kani's volley reads as coming off a person.
          if (arr.art) {
            const f = frameAt(performance.now() / 1000 + arr.spin, 14, arr.frames || 3);
            const d = arr.cell || 16;
            ctx.save();
            ctx.translate(Math.round(arr.x), Math.round(arr.y));
            // Deflected: it comes back the other way round and glows gold
            ctx.scale(arr.vx < 0 ? -1 : 1, 1);
            if (arr.deflected) glow(ctx, 0, 0, 26, '242, 193, 78', 0.5);
            if (!drawFrame(ctx, arr.art, f, d, d, -d, -d, d * 2, d * 2)) {
              ctx.fillStyle = '#FF8A3D';
              ctx.fillRect(-8, -3, 16, 6);
            }
            ctx.restore();
            continue;
          }

          // A shockwave hugs the floor. Drawn as a low crescent of ink rather
          // than a ball, because the shape is the instruction: it is wide, it
          // is short, and there is clean air above it.
          if (arr.wave) {
            const t = performance.now() / 90;
            const h = 26 + Math.sin(t) * 3;
            ctx.save();
            ctx.translate(Math.round(arr.x), Math.round(arr.y));
            ctx.scale(Math.sign(arr.vx) || 1, 1);
            glow(ctx, 0, 4, 54, '150, 170, 255', 0.34);
            ctx.fillStyle = 'rgba(191, 212, 255, 0.9)';
            ctx.beginPath();
            ctx.moveTo(-30, 14);
            ctx.quadraticCurveTo(-6, -h, 22, 12);
            ctx.quadraticCurveTo(2, -h * 0.45, -30, 14);
            ctx.fill();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.beginPath();
            ctx.moveTo(-14, 12);
            ctx.quadraticCurveTo(-2, -h * 0.55, 12, 11);
            ctx.quadraticCurveTo(-1, -h * 0.2, -14, 12);
            ctx.fill();
            ctx.restore();
            continue;
          }

          // Boss bolts are half again as big and violet, so a fan of five is
          // never mistaken for a lone caster's shot.
          const hot = arr.deflected ? CONFIG.GOLD : (arr.big ? '#C77DFF' : '#FF8A3D');
          const s = arr.big ? 1.55 : 1;
          ctx.save();
          ctx.globalAlpha = 0.35;
          ctx.fillStyle = hot;
          ctx.beginPath(); ctx.arc(arr.x, arr.y, 11 * s, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
          ctx.fillStyle = hot;
          ctx.beginPath(); ctx.arc(arr.x, arr.y, 5.5 * s, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#FFF3C4';
          ctx.beginPath(); ctx.arc(arr.x - Math.sign(arr.vx) * 1.5, arr.y - 1, 2.4 * s, 0, Math.PI * 2); ctx.fill();
          // A short tail pointing back down the flight path
          ctx.globalAlpha = 0.4;
          ctx.fillStyle = hot;
          ctx.fillRect(arr.x - Math.sign(arr.vx) * 16 * s, arr.y - 1.5 * s, 12 * s, 3 * s);
          ctx.restore();
        }

        // Render Enemies
        for (const e of this.runtimeEnemies) {
          // A boss is drawn 150px wide, so it needs the wider cull box or it
          // pops in with its head already past the screen edge. A warden is
          // drawn from a 128px cell at 1.46 — wider still.
          const pad = (e.type === 'boss') ? 110 : (e.type === 'warden') ? 140 : 60;
          if (!e.active || !onScreen(e.curX - pad, pad * 2)) continue;
          if (e.type === 'oni') this.drawOni(ctx, e);
          else if (e.type === 'lantern') this.drawLanternEnemy(ctx, e);
          else if (e.type === 'archer') this.drawArcher(ctx, e);
          else if (e.type === 'boss') this.drawBoss(ctx, e);
          else if (e.type === 'warden') this.drawWarden(ctx, e);
        }

        // Render the onboarding glyphs behind him, so he is never hidden by
        // the thing that is trying to teach him
        for (const pr of this.runtimePrompts) this.drawPrompt(ctx, pr);

        // Render Player Samurai
        this.player.draw(ctx);

        // Render Particles
        particles.draw(ctx);

        ctx.restore();
      }

      // ---- Textless onboarding glyphs -------------------------------------
      // Drawn in the world, at the exact spot the lesson applies. No sentence,
      // no tooltip: the shape of the control the player is holding, plus an ink
      // mark for what it does. They fade out for good once used.
      drawPrompt(ctx, pr) {
        if (pr.alpha < 0.01) return;
        const touch = input.touchActive;
        const bob = Math.sin(performance.now() / 380 + pr.x) * 3;

        ctx.save();
        ctx.globalAlpha = pr.alpha * 0.92;
        ctx.translate(pr.x, pr.y + bob);

        const caps = (pr.act === 'move') ? 2 : 1;
        const capW = (pr.act === 'jump' && !touch) ? 62 : 30;
        const gap = 8;
        const totalW = caps * capW + (caps - 1) * gap;
        let cx = -totalW / 2 + capW / 2;

        for (let i = 0; i < caps; i++) {
          this.drawKeyCap(ctx, cx, 0, capW, 30, touch);
          const icon = (pr.act === 'move') ? (i === 0 ? 'left' : 'right') : pr.act;
          this.drawKeyIcon(ctx, cx, 0, icon, touch, i);
          cx += capW + gap;
        }

        // A thin tick pointing at the ground the lesson is about
        ctx.strokeStyle = CONFIG.LEAF;
        ctx.globalAlpha = pr.alpha * 0.5;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, 20);
        ctx.lineTo(0, 34);
        ctx.stroke();
        ctx.restore();
      }

      drawKeyCap(ctx, x, y, w, h, round) {
        ctx.beginPath();
        if (round) {
          ctx.arc(x, y, h / 2 + 2, 0, Math.PI * 2);
        } else {
          const r = 6, hw = w / 2, hh = h / 2;
          ctx.moveTo(x - hw + r, y - hh);
          ctx.arcTo(x + hw, y - hh, x + hw, y + hh, r);
          ctx.arcTo(x + hw, y + hh, x - hw, y + hh, r);
          ctx.arcTo(x - hw, y + hh, x - hw, y - hh, r);
          ctx.arcTo(x - hw, y - hh, x + hw, y - hh, r);
          ctx.closePath();
        }
        // A dark cap with a bright rim: the glyph has to sit on top of a busy
        // tiled world without becoming another piece of scenery.
        ctx.fillStyle = 'rgba(21, 20, 31, 0.88)';
        ctx.fill();
        ctx.strokeStyle = CONFIG.LEAF;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      drawKeyIcon(ctx, x, y, icon, touch, idx) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = '#F4F0E2';
        ctx.fillStyle = '#F4F0E2';
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        switch (icon) {
          case 'left':
          case 'right': {
            const d = icon === 'right' ? 1 : -1;
            ctx.beginPath();
            ctx.moveTo(-3 * d, -6); ctx.lineTo(3 * d, 0); ctx.lineTo(-3 * d, 6);
            ctx.stroke();
            break;
          }
          case 'jump':
            // Up chevron over a ground line: rise, from here
            ctx.beginPath();
            ctx.moveTo(-6, -1); ctx.lineTo(0, -8); ctx.lineTo(6, -1);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-7, 6); ctx.lineTo(7, 6);
            ctx.stroke();
            break;
          case 'slash':
            // The katana's own crescent, the same arc the attack draws
            ctx.beginPath();
            ctx.arc(-4, 0, 9, -0.9, 0.9);
            ctx.stroke();
            ctx.fillStyle = CONFIG.CRIMSON;
            ctx.beginPath();
            ctx.arc(5, -8, 2, 0, Math.PI * 2);
            ctx.fill();
            break;
          case 'dash':
            // Three speed strokes, longest last
            for (let i = 0; i < 3; i++) {
              ctx.globalAlpha = 0.45 + i * 0.27;
              ctx.beginPath();
              ctx.moveTo(-8, -5 + i * 5);
              ctx.lineTo(-8 + 6 + i * 4, -5 + i * 5);
              ctx.stroke();
            }
            break;
        }
        ctx.restore();
      }

      // ===================================================================
      // WORLD RENDERING — 32px TILES, PARALLAX PLATES, PIXEL PROPS
      // ===================================================================

      // Four plates, each scrolling at its own rate and tiled horizontally so
      // they never run out. The sky is pinned; everything else slides.
      drawParallax(ctx, w, h) {
        // The plates ship bright, because in the source pack they are the whole
        // picture. Here they are behind a playfield, so each one is knocked
        // back further than the one in front of it and the whole stack sits
        // under a dark veil — the readable thing on screen has to be the part
        // the player can touch.
        for (const [name, speed, drift, alpha] of THEME.plates) {
          if (!usable(name)) continue;
          const im = IMG[name];
          // Cover the viewport height, keep the plate's aspect, sit on the floor
          const scale = Math.max(h / im.height, w / im.width, 1);
          const pw = Math.ceil(im.width * scale);
          const ph = Math.ceil(im.height * scale);
          const oy = h - ph + camera.y * drift;
          let ox = -((camera.x * speed) % pw);
          if (ox > 0) ox -= pw;
          ctx.globalAlpha = alpha;
          for (let x = ox; x < w; x += pw) {
            ctx.drawImage(im, Math.round(x), Math.round(oy), pw, ph);
          }
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = THEME.veil;
        ctx.fillRect(0, 0, w, h);
      }

      // Solid ground: a grassy cap row, body rows, and a rounded underside.
      // Anything 30px or thinner is a ledge and gets the half-height strip.
      drawTiledPlatform(ctx, p, viewL, viewR) {
        const thin = p.h <= 30;

        // A ground slab can be 1500px of 32px tiles; only the columns the
        // camera can see are worth issuing draw calls for.
        const cols = Math.max(1, Math.ceil(p.w / TILE));
        const c0 = Math.max(0, Math.floor((viewL - p.x) / TILE));
        const c1 = Math.min(cols - 1, Math.ceil((viewR - p.x) / TILE));
        if (c1 < c0) return;

        // No tileset (a failed load, or an offline first paint): a flat slab
        // still shows exactly where the ground is, so the map stays playable.
        if (!usable(THEME.sheet)) {
          ctx.fillStyle = thin ? '#5A4636' : '#3E3226';
          ctx.fillRect(p.x, p.y, p.w, p.h);
          ctx.fillStyle = CONFIG.LEAF;
          ctx.fillRect(p.x, p.y, p.w, 4);
          return;
        }

        ctx.save();
        ctx.beginPath();
        ctx.rect(p.x, p.y, p.w, thin ? p.h + 18 : p.h);
        ctx.clip();

        if (thin) {
          for (let c = c0; c <= c1; c++) {
            const cell = cols === 1 ? TSET.ledgeM
                       : c === 0 ? TSET.ledgeL
                       : c === cols - 1 ? TSET.ledgeR : TSET.ledgeM;
            drawTile(ctx, cell, p.x + c * TILE, p.y);
          }
        } else {
          const rows = Math.max(1, Math.ceil(p.h / TILE));
          for (let r = 0; r < rows; r++) {
            // The last row is pinned to the platform's own bottom edge instead
            // of the tile grid, so a block whose height is not a multiple of 32
            // still ends on a finished edge rather than a sliced one.
            const last = r === rows - 1 && rows > 2;
            const y = last ? p.y + p.h - TILE : p.y + r * TILE;
            for (let c = c0; c <= c1; c++) {
              const left = c === 0, right = c === cols - 1 && cols > 1;
              let cell;
              if (r === 0) cell = left ? TSET.topL : right ? TSET.topR : TSET.topM;
              else if (last) cell = left ? TSET.botL : right ? TSET.botR : TSET.botM;
              else cell = left ? TSET.midL : right ? TSET.midR : TSET.midM;
              drawTile(ctx, cell, p.x + c * TILE, y);
            }
          }
        }
        ctx.restore();

        // A ledge that is about to give way flickers and bleeds dust
        if (p.crumbling && p.crumbleTimer > 0) {
          ctx.save();
          ctx.globalAlpha = 0.35 + Math.sin(performance.now() / 40) * 0.25;
          ctx.fillStyle = CONFIG.CRIMSON;
          ctx.fillRect(p.x, p.y, p.w, 3);
          ctx.restore();
        }
      }

      // Breakable pillar barring the way
      drawDestructible(ctx, d) {
        drawProp(ctx, 'barricade', d.x + d.w / 2, d.y + d.h, d.h / 64);
      }

      // The spike sheet is a rise-and-fall animation; frame 8 is fully out,
      // which is the only honest pose for a hazard that is always lethal.
      //
      // A summoned stake is the exception, and the reason the sheet's other
      // frames finally get used: `rise` walks frame 0 -> 8 while it comes out
      // of the floor and back down again while it sinks, so the animation is
      // the telegraph rather than something drawn over the top of one.
      drawSpikes(ctx, hz) {
        if (!usable('spikes')) return;
        const FW = 32, FH = 64;
        const F = hz.temp ? Math.round(Math.max(0, Math.min(1, hz.rise)) * 8) : 8;
        const cols = Math.ceil(hz.w / FW);
        ctx.save();
        ctx.beginPath(); ctx.rect(hz.x, hz.y - 24, hz.w, hz.h + 24); ctx.clip();
        if (hz.temp) {
          // Still coming up: drawn dimmer, and with a warning glow on the
          // floor under it, so it reads at a glance in a busy fight.
          if (!hz.armed) {
            ctx.globalAlpha = 0.55 + hz.rise * 0.45;
            glow(ctx, hz.x + hz.w / 2, hz.y + hz.h, 46, '224, 122, 205', 0.34);
          }
        }
        for (let c = 0; c < cols; c++) {
          // The spikes sit at the top of the 64px cell, so pull the cell up to
          // put the points at the top edge of the hazard box.
          ctx.drawImage(IMG.spikes, F * FW, 0, FW, FH,
                        hz.x + c * FW, hz.y - 22, FW, FH);
        }
        ctx.restore();
      }

      // A spinning rock blade on a track
      drawSaw(ctx, hz) {
        ctx.save();
        ctx.translate(hz.curX, hz.y);
        ctx.rotate(performance.now() / 220);
        for (let i = 0; i < 4; i++) {
          ctx.rotate(Math.PI / 2);
          drawProp(ctx, 'spikeRock', 0, 20, 0.62);
        }
        ctx.restore();
      }

      // Spinning coins. The x term in the clock stops a row of them turning
      // in lockstep, which reads as one wide object rather than several coins;
