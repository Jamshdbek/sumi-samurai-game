    // =====================================================================
    // 7. ENTITIES & LOGIC
    // =====================================================================
    class Animator {
      constructor(sprites) {
        this.sprites = sprites;
        this.clip = 'idle';
        this.frame = 0;
        this.timer = 0;
        this.done = false;
      }

      play(clipName) {
        if (this.clip !== clipName) {
          this.clip = clipName;
          this.frame = 0;
          this.timer = 0;
          this.done = false;
        }
      }

      update(dt) {
        const config = this.sprites[this.clip];
        if (!config) return;

        if (this.done && !config.loop) return;

        const frameDuration = 1 / (config.fps || 10);
        this.timer += dt;

        while (this.timer >= frameDuration) {
          this.timer -= frameDuration;
          if (this.frame + 1 < config.frames) {
            this.frame += 1;
          } else if (config.loop) {
            this.frame = 0;
          } else {
            this.done = true;
            this.frame = config.frames - 1; // hold last frame
            break;
          }
        }
      }

      getCurrentFrame() {
        const config = this.sprites[this.clip];
        if (!config) return 0;
        const start = config.startFrame || 0;
        return start + this.frame;
      }
    }

    class Player {
      constructor() {
        // Collision box stays exactly CONFIG.playerW x CONFIG.playerH world units
        this.w = CONFIG.playerW;
        this.h = CONFIG.playerH;
        this.animator = new Animator(SPRITES);
        this.reset(80, 440);
      }

      reset(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.facing = 1; // 1 = right, -1 = left
        this.isGrounded = false;
        this.isWallSliding = false;
        this.wallDir = 0; // -1 wall left, 1 wall right
        this.coyoteTimer = 0;
        this.jumpBufferTimer = 0;
        this.hasDoubleJump = true;
        this.hasAirDash = true;
        this.isDashing = false;
        this.dashTimer = 0;
        this.jumpHoldTimer = 0;
        this.wallLockoutTimer = 0;

        // Katana attack
        this.isSlashing = false;
        this.slashTimer = 0;

        // Health & Invulnerability
        this.health = CONFIG.MAX_HEALTH;
        this.invulnTimer = 0;

        // Animation state machine
        this.scaleX = 1;
        this.scaleY = 1;
        this.animTime = 0;
        this.runCycle = 0;
        this.landTimer = 0;
        this.animState = 'idle';
        this.animator.play('idle');

        // Active powerup
        this.powerup = null; // 'zanshin' | 'edge' | 'charm'
        this.powerupTimer = 0;
      }

      applyPowerup(type) {
        this.powerup = type;
        this.powerupTimer = 10.0;
        audio.playPowerup();
        const pill = document.getElementById('powerupPill');
        if (pill) {
          pill.style.display = 'block';
          pill.textContent = type.toUpperCase() + ' 10s';
        }
      }

      damage(amount = 1) {
        if (this.invulnTimer > 0) return false;

        // Charm absorbs hit
        if (this.powerup === 'charm') {
          this.powerup = null;
          this.powerupTimer = 0;
          this.invulnTimer = 0.6;
          audio.playDeflect();
          camera.shake(3, 0.15);
          particles.burstInk(this.x, this.y, 16, CONFIG.GOLD);
          const pill = document.getElementById('powerupPill');
          if (pill) pill.style.display = 'none';
          return false;
        }

        this.health -= amount;
        this.invulnTimer = CONFIG.INVULN_TIME;
        this.animState = 'hurt';
        this.scaleX = 0.92; this.scaleY = 1.12;
        audio.playHit();
        camera.shake(6, 0.25);
        particles.burstInk(this.x, this.y, 20, CONFIG.CRIMSON);

        // Flash vignette
        const flash = document.getElementById('damage-flash');
        if (flash) {
          flash.style.opacity = '1';
          setTimeout(() => { flash.style.opacity = '0'; }, 180);
        }

        if (this.health <= 0) {
          game.onPlayerDeath();
        }
        return true;
      }

      update(dt, platforms, destructibles) {
        // Powerup timer countdown
        if (this.powerupTimer > 0) {
          this.powerupTimer -= dt;
          const pill = document.getElementById('powerupPill');
          if (pill) {
            pill.textContent = this.powerup.toUpperCase() + ' ' + Math.ceil(this.powerupTimer) + 's';
          }
          if (this.powerupTimer <= 0) {
            this.powerup = null;
            if (pill) pill.style.display = 'none';
          }
        }

        if (this.invulnTimer > 0) this.invulnTimer -= dt;
        if (this.wallLockoutTimer > 0) this.wallLockoutTimer -= dt;

        // 1. Air Dash state
        if (this.isDashing) {
          this.dashTimer -= dt;
          this.vy = 0; // suspend gravity during dash
          this.vx = this.facing * CONFIG.DASH_SPEED;
          particles.dust(this.x - this.facing * 12, this.y, -this.facing);

          if (this.dashTimer <= 0) {
            this.isDashing = false;
            this.vx = this.facing * CONFIG.MAX_RUN_SPEED;
          }
        } else {
          // 2. Horizontal Run Acceleration & Friction
          let moveInput = 0;
          if (this.wallLockoutTimer <= 0) {
            if (input.left) moveInput -= 1;
            if (input.right) moveInput += 1;
          }

          if (moveInput !== 0) {
            this.facing = moveInput > 0 ? 1 : -1;
            // Skid check
            const isSkidding = (this.vx > 60 && moveInput < 0) || (this.vx < -60 && moveInput > 0);
            const accel = isSkidding ? CONFIG.SKID_DECEL : CONFIG.RUN_ACCEL;
            this.vx += moveInput * accel * dt;

            if (isSkidding && this.isGrounded) {
              particles.dust(this.x, this.y + this.h / 2, this.facing);
            }
          } else {
            // Deceleration to stop
            if (this.vx > 0) {
              this.vx = Math.max(0, this.vx - CONFIG.RUN_DECEL * dt);
            } else if (this.vx < 0) {
              this.vx = Math.min(0, this.vx + CONFIG.RUN_DECEL * dt);
            }
          }
          // Clamp top speed
          this.vx = Math.max(-CONFIG.MAX_RUN_SPEED, Math.min(CONFIG.MAX_RUN_SPEED, this.vx));

          // 3. Vertical & Gravity
          if (!this.isGrounded) {
            this.coyoteTimer -= dt;

            if (this.isWallSliding) {
              // Wall slide drag
              if (this.vy > CONFIG.WALL_SLIDE_SPEED) {
                this.vy = CONFIG.WALL_SLIDE_SPEED;
              } else {
                this.vy += CONFIG.GRAVITY * 0.4 * dt;
              }
              if (Math.random() < 0.25) {
                particles.dust(this.x + this.wallDir * (this.w / 2), this.y, 0);
              }
            } else {
              // Variable jump boost while holding jump
              if (input.jumpHeld && this.jumpHoldTimer > 0) {
                this.vy += CONFIG.JUMP_HOLD_ACCEL * dt;
                this.jumpHoldTimer -= dt;
              }
              this.vy += CONFIG.GRAVITY * dt;
              if (this.vy > CONFIG.MAX_FALL_SPEED) this.vy = CONFIG.MAX_FALL_SPEED;
            }
          } else {
            this.coyoteTimer = CONFIG.COYOTE_TIME;
            this.hasDoubleJump = true;
            this.hasAirDash = true;
            this.isWallSliding = false;
            // Landing snaps the feet to exactly plat.y, where the overlap test
            // (bottom > rect.y) reads false. Without a downward bias the very
            // next frame reports airborne, gravity re-lands the player, and the
            // pose alternates jumpFall/land at 60Hz. Keep the feet biting in.
            this.vy = CONFIG.GROUND_STICK_VEL;
          }

          // Dash Trigger (max 15% deformation)
          if (input.consumeDash() && this.hasAirDash) {
            this.hasAirDash = false;
            this.isDashing = true;
            this.dashTimer = CONFIG.DASH_DURATION;
            this.scaleX = 1.15; this.scaleY = 0.88; // Sleek horizontal deformation
            audio.playDash();
            camera.shake(2.5, 0.1);
          }

          // Jump Input Buffer (squash & stretch within 15% max deformation)
          if (input.consumeJump()) {
            this.jumpBufferTimer = CONFIG.JUMP_BUFFER;
          }
          if (this.jumpBufferTimer > 0) {
            this.jumpBufferTimer -= dt;
            // A) Normal or Coyote Jump
            if (this.coyoteTimer > 0) {
              this.vy = CONFIG.JUMP_INITIAL_VEL;
              this.jumpHoldTimer = CONFIG.JUMP_HOLD_MAX_TIME;
              this.coyoteTimer = 0;
              this.jumpBufferTimer = 0;
              this.isGrounded = false;
              this.scaleX = 0.88; this.scaleY = 1.15; // Vertical stretch on rise
              audio.playJump(false);
              particles.dust(this.x, this.y + this.h / 2, 0);
            }
            // B) Wall Jump
            else if (this.isWallSliding) {
              this.vy = CONFIG.WALL_JUMP_VEL_Y;
              this.vx = -this.wallDir * CONFIG.WALL_JUMP_VEL_X;
              this.facing = -this.wallDir;
              this.wallLockoutTimer = CONFIG.WALL_JUMP_LOCKOUT;
              this.isWallSliding = false;
              this.jumpBufferTimer = 0;
              this.hasAirDash = true; // Wall kick refreshes dash
              this.scaleX = 0.88; this.scaleY = 1.15;
              audio.playJump(false);
              particles.burstInk(this.x + this.wallDir * (this.w / 2), this.y, 8, CONFIG.GREY_MID);
            }
            // C) Air Double Jump
            else if (this.hasDoubleJump) {
              this.hasDoubleJump = false;
              this.vy = CONFIG.DOUBLE_JUMP_VEL;
              this.jumpHoldTimer = CONFIG.JUMP_HOLD_MAX_TIME * 0.75;
              this.jumpBufferTimer = 0;
              this.scaleX = 0.88; this.scaleY = 1.15;
              audio.playJump(true);
              particles.burstInk(this.x, this.y + this.h / 2, 14, CONFIG.INK_BLACK);
            }
          }
        }

        // Katana Slash
        if (input.consumeSlash() && !this.isSlashing) {
          this.isSlashing = true;
          this.slashTimer = CONFIG.SLASH_DURATION;
          audio.playSlash();
          camera.shake(1.5, 0.08);

          // Test destructible blocks break
          const reach = (this.powerup === 'edge') ? CONFIG.SLASH_RANGE_POWERED : CONFIG.SLASH_RANGE_NORMAL;
          const slashBox = {
            x: this.facing > 0 ? this.x : this.x - reach,
            y: this.y - 20,
            w: reach,
            h: 44
          };
          for (let i = destructibles.length - 1; i >= 0; i--) {
            const d = destructibles[i];
            if (testAABB(slashBox, d)) {
              particles.burstInk(d.x + d.w / 2, d.y + d.h / 2, 22, CONFIG.GREY_DARK);
              audio.playHit();
              destructibles.splice(i, 1);
              game.addScore(100);
            }
          }
        }
        if (this.isSlashing) {
          this.slashTimer -= dt;
          if (this.slashTimer <= 0) this.isSlashing = false;
        }

        // 4. Move and Collide with Platforms
        // Snapshot before the reset: the landing impact must fire on the
        // air->ground transition, not on every frame the feet touch down.
        const wasGrounded = this.isGrounded;
        this.isGrounded = false;
        this.isWallSliding = false;
        this.wallDir = 0;

        // Move X
        this.x += this.vx * dt;
        for (const plat of platforms) {
          if (plat.isFallen) continue;
          if (this.checkCollision(plat)) {
            if (this.vx > 0) {
              this.x = plat.x - this.w / 2;
              this.vx = 0;
              // Check wall slide
              if (!wasGrounded && input.right && this.vy > 0) {
                this.isWallSliding = true;
                this.wallDir = 1;
              }
            } else if (this.vx < 0) {
              this.x = plat.x + plat.w + this.w / 2;
              this.vx = 0;
              if (!wasGrounded && input.left && this.vy > 0) {
                this.isWallSliding = true;
                this.wallDir = -1;
              }
            }
          }
        }

        // Move Y
        this.y += this.vy * dt;
        for (const plat of platforms) {
          if (plat.isFallen) continue;
          if (this.checkCollision(plat)) {
            if (this.vy > 0) { // Landing
              this.y = plat.y - this.h / 2;
              this.vy = 0;
              if (!wasGrounded) {
                // Land squash (max 15% deformation: 0.85 scaleY, 1.15 scaleX)
                this.scaleX = 1.15; this.scaleY = 0.85;
                this.landTimer = 0.12;
                particles.dust(this.x, this.y + this.h / 2, 0);
              }
              this.isGrounded = true;
              this.hasAirDash = true;

              // Step on crumbling platform
              if (plat.crumbling && !plat.crumbleTimer) {
                plat.crumbleTimer = 0.4;
              }
            } else if (this.vy < 0) { // Head bump
              this.y = plat.y + plat.h + this.h / 2;
              this.vy = 0;
            }
          }
        }

        // Smooth squash and stretch relaxation (capped strictly at max 15% deformation)
        this.scaleX += (1 - this.scaleX) * 12 * dt;
        this.scaleY += (1 - this.scaleY) * 12 * dt;
        this.scaleX = Math.max(0.85, Math.min(1.15, this.scaleX));
        this.scaleY = Math.max(0.85, Math.min(1.15, this.scaleY));

        // 5. Animation State Determination by Strict Priority:
        // dead > hurt > dash > slash > wallSlide > jumpRise/jumpFall > land > run > idle
        this.animTime += dt;
        if (this.health <= 0) {
          this.animState = 'dead';
        } else if (this.invulnTimer > 0.6) {
          this.animState = 'hurt';
        } else if (this.isDashing) {
          this.animState = 'dash';
        } else if (this.isSlashing) {
          this.animState = 'slash';
        } else if (this.isWallSliding) {
          this.animState = 'wallSlide';
        } else if (!this.isGrounded) {
          this.animState = (this.vy < -20) ? 'jumpRise' : 'jumpFall';
        } else if (this.landTimer > 0) {
          this.animState = 'land';
          this.landTimer -= dt;
        } else if (Math.abs(this.vx) > 20) {
          this.animState = 'run';
          this.runCycle += dt * (Math.abs(this.vx) / 28);
        } else {
          this.animState = 'idle';
        }

        this.animator.play(this.animState);
        this.animator.update(dt);
      }

      checkCollision(rect) {
        const left = this.x - this.w / 2;
        const right = this.x + this.w / 2;
        const top = this.y - this.h / 2;
        const bottom = this.y + this.h / 2;
        return (
          left < rect.x + rect.w &&
          right > rect.x &&
          top < rect.y + rect.h &&
          bottom > rect.y
        );
      }

      draw(ctx) {
        const prevSmoothing = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = false;

        ctx.save();

        // Invulnerable flicker: toggle ctx.globalAlpha, never skip drawing entirely
        if (this.invulnTimer > 0) {
          ctx.globalAlpha = (Math.floor(Date.now() / 70) % 2 === 0) ? 0.35 : 0.85;
        }

        const clipName = this.animator.clip || 'idle';
        const clipConfig = SPRITES[clipName] || SPRITES.idle;
        const imgObj = spriteImages[clipConfig.file];
        const hasValidImage = imgObj && !imgObj.failed && imgObj.complete && imgObj.naturalWidth > 0;

        // Position calculations rounded to whole device pixels to prevent shimmering
        const cx = Math.round(this.x + (CONFIG.spriteAnchorX || 0));
        const feetY = Math.round(this.y + this.h / 2 + (CONFIG.spriteAnchorY || 0));
        const destW = Math.round(clipConfig.frameW * CONFIG.spriteScale);
        const destH = Math.round(clipConfig.frameH * CONFIG.spriteScale);

        ctx.translate(cx, feetY);
        ctx.scale(this.facing, 1);

        if (hasValidImage) {
          const frameIndex = this.animator.getCurrentFrame();
          const sx = frameIndex * clipConfig.frameW;
          const sy = 0;
          const dx = Math.round(-destW / 2);
          const dy = Math.round(-destH);

          ctx.drawImage(
            imgObj,
            sx,
            sy,
            clipConfig.frameW,
            clipConfig.frameH,
            dx,
            dy,
            destW,
            destH
          );
        } else {
          // Fallback to plain filled rectangle in player ink colour
          ctx.fillStyle = CONFIG.INK_BLACK;
          ctx.fillRect(
            Math.round(-this.w / 2),
            Math.round(-this.h),
            this.w,
            this.h
          );
        }

        ctx.restore();

        // Katana slash crescent stroke visualization
        if (this.isSlashing) {
          const progress = 1 - (this.slashTimer / CONFIG.SLASH_DURATION);
          const reach = (this.powerup === 'edge') ? CONFIG.SLASH_RANGE_POWERED : CONFIG.SLASH_RANGE_NORMAL;
          ctx.save();
          ctx.translate(Math.round(this.x), Math.round(this.y));
          ctx.scale(this.facing, 1);
          ctx.globalAlpha = Math.max(0, 1 - progress * 0.85);
          ctx.strokeStyle = (this.powerup === 'edge') ? CONFIG.CRIMSON : CONFIG.INK_BLACK;
          ctx.lineWidth = 4.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          const startAngle = -1.1 + progress * 0.5;
          const endAngle = 0.9 + progress * 0.4;
          ctx.arc(6, -2, reach, startAngle, endAngle);
          ctx.stroke();

          // Crimson Edge shockwave aura
          if (this.powerup === 'edge') {
            ctx.strokeStyle = 'rgba(224, 59, 59, 0.45)';
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.arc(6, -2, reach + 8, startAngle - 0.1, endAngle + 0.1);
            ctx.stroke();
          }
          ctx.restore();
        }

        // Debug Hitbox outline in crimson
        if (CONFIG.DEBUG_HITBOX) {
          ctx.save();
          ctx.strokeStyle = CONFIG.CRIMSON;
          ctx.lineWidth = 1.5;
          ctx.strokeRect(
            Math.round(this.x - this.w / 2),
            Math.round(this.y - this.h / 2),
            this.w,
            this.h
          );
          ctx.restore();
        }

        ctx.imageSmoothingEnabled = prevSmoothing;
      }
    }

    // AABB Collision Helper
    function testAABB(r1, r2) {
      return (
        r1.x < r2.x + r2.w &&
        r1.x + r1.w > r2.x &&
        r1.y < r2.y + r2.h &&
        r1.y + r1.h > r2.y
      );
    }

    // =====================================================================
    // 8. GAME LOOP & STATE MANAGEMENT
    // =====================================================================
    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.stageIdx = 0;
        this.player = new Player();
        this.stage = null;
        this.activeCheckpoint = null;

        // Score, Coins & Combo
        this.score = 0;
        this.highScore = Save.get('highScore') || 0;
        this.combo = 1.0;
        this.comboTimer = 0;
        this.runCoins = 0;

        // State Flags
        this.isRunning = false;
        this.isPaused = false;
        this.hitStopTimer = 0;

        // Timing accumulator
        this.lastTime = 0;
        this.accumulatedTime = 0;
        this.fixedStep = 1 / 60; // 60Hz deterministic physics tick

        // Arrows, particles, platforms runtime
        this.arrows = [];
        this.runtimePlatforms = [];
        this.runtimeEnemies = [];
        this.runtimeCoins = [];
        this.runtimePowerups = [];
        this.runtimeHazards = [];
        this.runtimeDestructibles = [];
        this.runtimeKoban = null;

        this.setupWindow();
        this.loadStage(0);
        this.updateHUD();
      }

      setupWindow() {
        const resize = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          this.dpr = dpr;
          const w = window.innerWidth;
          const h = window.innerHeight;
          this.canvas.width = w * dpr;
          this.canvas.height = h * dpr;
          this.ctx.resetTransform?.();
          this.ctx.scale(dpr, dpr);
          camera.viewportW = w;
          camera.viewportH = h;
        };
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', resize);
        resize();

        // Pause on tab switch & save run high score
        document.addEventListener('visibilitychange', () => {
          if (document.hidden && this.isRunning && !this.isPaused) {
            this.togglePause();
            if (this.highScore > (Save.get('highScore') || 0)) {
              Save.write({ highScore: this.highScore });
            }
          }
        });
        window.addEventListener('blur', () => {
          if (this.isRunning && !this.isPaused) {
            this.togglePause();
          }
        });

        // UI Controls setup
        document.getElementById('startBtn').addEventListener('click', () => {
          audio.init();
          this.startOrResume();
        });
        document.getElementById('muteBtn').addEventListener('click', () => {
          audio.init();
          this.toggleMute();
        });
        document.getElementById('pauseBtn').addEventListener('click', () => {
          this.togglePause();
        });
      }

      toggleMute() {
        const m = audio.toggleMute();
        document.getElementById('muteBtn').textContent = m ? '🔇' : '♪';
      }

      togglePause() {
        if (!this.isRunning) return;
        this.isPaused = !this.isPaused;
        audio.setMuted(this.isPaused);
        const overlay = document.getElementById('overlay');
        if (this.isPaused) {
          window.GameEvents.gameplayStop();
          document.getElementById('overlayKanji').textContent = '憩';
          document.getElementById('overlayTitle').textContent = 'PAUSED';
          document.getElementById('overlaySubtitle').textContent = 'The wind pauses in the bamboo grove.';
          const playCaption = document.getElementById('playCaption');
          if (playCaption) playCaption.textContent = 'Click to Resume';
          overlay.classList.remove('hidden');
        } else {
          window.GameEvents.gameplayStart();
          overlay.classList.add('hidden');
          this.lastTime = performance.now();
        }
      }

      loadStage(idx, respawnAtCheckpoint = false) {
        this.stageIdx = idx;
        const data = STAGE_CONFIGS[idx];
        this.stage = data;

        const stageTitleEl = document.getElementById('stageTitle');
        if (stageTitleEl) {
          stageTitleEl.textContent = `PHASE 0${idx + 1}: ${data.title.toUpperCase()}`;
        }

        // Clone runtime platforms
        this.runtimePlatforms = data.platforms.map(p => ({
          ...p,
          baseX: p.x, baseY: p.y,
          crumbleTimer: 0,
          isFallen: false,
          respawnTimer: 0
        }));

        // Clone hazards
        this.runtimeHazards = data.hazards.map(h => ({
          ...h,
          curX: h.x, curY: h.y, dir: 1
        }));

        // Clone enemies
        this.runtimeEnemies = data.enemies.map(e => ({
          ...e,
          curX: e.x, curY: e.y,
          vx: e.type === 'oni' ? 80 : 0,
          facing: 1,
          shootTimer: 1.5,
          active: true,
          phase: Math.random() * 10
        }));

        // Clone destructibles
        this.runtimeDestructibles = data.destructibles.map(d => ({ ...d }));

        // Clone coins & items
        this.runtimeCoins = data.coins.map(c => ({ ...c, collected: false }));
        this.runtimeKoban = data.koban ? { ...data.koban, collected: false } : null;
        this.runtimePowerups = (data.powerups || []).map(p => ({ ...p, collected: false }));

        this.arrows = [];

        // Spawn player
        const spawnPoint = (respawnAtCheckpoint && this.activeCheckpoint)
          ? this.activeCheckpoint
          : data.spawn;
        this.player.reset(spawnPoint.x, spawnPoint.y);
        camera.x = this.player.x;
        camera.y = this.player.y;
      }

      startOrResume() {
        document.getElementById('overlay').classList.add('hidden');
        this.isRunning = true;
        this.isPaused = false;
        window.GameEvents.gameplayStart();
        this.lastTime = performance.now();
        if (!Save.get('seenControlHint')) {
          Save.write({ seenControlHint: true });
        }
      }

      addScore(pts) {
        this.score += Math.round(pts * this.combo);
        this.comboTimer = CONFIG.COMBO_DECAY_TIME;
        this.combo = Math.min(5.0, Number((this.combo + 0.2).toFixed(1)));
        if (this.score > this.highScore) {
          this.highScore = this.score;
        }
        this.updateHUD();
      }

      updateHUD() {
        document.getElementById('scoreDisplay').textContent = this.score.toLocaleString();
        document.getElementById('highScoreDisplay').textContent = 'HIGH: ' + this.highScore.toLocaleString();
        const badge = document.getElementById('comboBadge');
        if (this.combo > 1.0) {
          badge.innerHTML = '<span class="combo-x">x</span> ' + this.combo.toFixed(1) + ' <span class="combo-lbl">Combo</span>';
          badge.classList.add('active');
        } else {
          badge.classList.remove('active');
        }
        // Health dots
        ['dot1', 'dot2', 'dot3'].forEach((id, i) => {
          const el = document.getElementById(id);
          if (i < this.player.health) el.classList.remove('lost');
          else el.classList.add('lost');
        });
      }

      onPlayerDeath() {
        window.GameEvents.gameplayStop();
        this.combo = 1.0;
        this.updateHUD();

        // Meaningful save moment: Run ended
        const currentCoins = (Save.get('coinsTotal') || 0) + this.runCoins;
        this.runCoins = 0;
        const bestScore = Math.max(Save.get('highScore') || 0, this.highScore);
        Save.write({
          coinsTotal: currentCoins,
          highScore: bestScore,
          seenControlHint: true
        });

        // Instant checkpoint respawn
        setTimeout(() => {
          this.loadStage(this.stageIdx, true);
          this.player.health = CONFIG.MAX_HEALTH;
          this.updateHUD();
          window.GameEvents.gameplayStart();
        }, 150);
      }

      onStageComplete() {
        window.GameEvents.levelComplete();
        audio.playStageClear();
        camera.shake(5, 0.4);
        particles.burstInk(this.stage.torii.x, this.stage.torii.y, 40, CONFIG.GOLD);

        // Meaningful save moment: Stage cleared & coins collected & new high score
        const nextUnlocked = Math.max(Save.get('stagesUnlocked') || 1, this.stageIdx + 2);
        const currentCoins = (Save.get('coinsTotal') || 0) + this.runCoins;
        this.runCoins = 0;
        const bestScore = Math.max(Save.get('highScore') || 0, this.highScore);
        Save.write({
          stagesUnlocked: nextUnlocked,
          coinsTotal: currentCoins,
          highScore: bestScore,
          seenControlHint: true
        });

        if (this.stageIdx < STAGE_CONFIGS.length - 1) {
          setTimeout(() => {
            this.activeCheckpoint = null;
            this.loadStage(this.stageIdx + 1);
            this.updateHUD();
          }, 800);
        } else {
          // Game Victory Overlay: Run ended!
          window.GameEvents.gameplayStop();
          this.isRunning = false;
          const overlay = document.getElementById('overlay');
          document.getElementById('overlayKanji').textContent = '極';
          document.getElementById('overlayTitle').textContent = 'SUMI MASTERED';
          document.getElementById('overlaySubtitle').textContent =
            `You mastered the ink path with a final score of ${this.score.toLocaleString()}!`;
          const playCaption = document.getElementById('playCaption');
          if (playCaption) playCaption.textContent = 'Click to Run Again';
          overlay.classList.remove('hidden');
          this.stageIdx = 0;
          this.activeCheckpoint = null;
        }
      }

      // ===================================================================
      // FIXED PHYSICS TICK (DETERMINISTIC ACROSS ALL MONITORS)
      // ===================================================================
      physicsTick(dt) {
        // Zanshin powerup slows world physics by 50% while player is 100%
        const worldSpeed = (this.player.powerup === 'zanshin') ? 0.5 : 1.0;
        const worldDt = dt * worldSpeed;

        // 1. Combo multiplier decay
        if (this.comboTimer > 0) {
          this.comboTimer -= dt;
          if (this.comboTimer <= 0) {
            this.combo = 1.0;
            this.updateHUD();
          }
        }

        // 2. Moving & Crumbling Platforms
        for (const p of this.runtimePlatforms) {
          if (p.moving) {
            p.phase = (p.phase || 0) + worldDt * (p.moveSpeed || 1);
            if (p.moveX) p.x = p.baseX + Math.sin(p.phase) * p.moveX;
            if (p.moveY) p.y = p.baseY + Math.sin(p.phase) * p.moveY;
          }
          if (p.crumbleTimer > 0) {
            p.crumbleTimer -= worldDt;
            if (p.crumbleTimer <= 0) {
              p.isFallen = true;
              p.respawnTimer = 3.0;
              particles.burstInk(p.x + p.w / 2, p.y + p.h / 2, 10, CONFIG.GREY_MID);
            }
          } else if (p.isFallen) {
            p.respawnTimer -= worldDt;
            if (p.respawnTimer <= 0) {
              p.isFallen = false;
              p.crumbleTimer = 0;
            }
          }
        }

        // 3. Moving Hazards (Saws)
        for (const h of this.runtimeHazards) {
          if (h.type === 'saw') {
            h.curX += h.dir * h.speed * worldDt;
            if (h.curX > h.endX) { h.curX = h.endX; h.dir = -1; }
            if (h.curX < h.startX) { h.curX = h.startX; h.dir = 1; }
          }
        }

        // 4. Update Player
        this.player.update(dt, this.runtimePlatforms, this.runtimeDestructibles);

        // Pit death check
        if (this.player.y > this.stage.height + 60) {
          this.player.damage(1);
          if (this.player.health > 0) {
            const sp = this.activeCheckpoint || this.stage.spawn;
            this.player.reset(sp.x, sp.y);
            this.updateHUD();
          }
        }

        // 5. Enemies update & combat
        const playerBox = {
          x: this.player.x - this.player.w / 2,
          y: this.player.y - this.player.h / 2,
          w: this.player.w,
          h: this.player.h
        };
        const slashReach = (this.player.powerup === 'edge') ? CONFIG.SLASH_RANGE_POWERED : CONFIG.SLASH_RANGE_NORMAL;
        const slashBox = this.player.isSlashing ? {
          x: this.player.facing > 0 ? this.player.x : this.player.x - slashReach,
          y: this.player.y - 24,
          w: slashReach,
          h: 48
        } : null;

        for (const e of this.runtimeEnemies) {
          if (!e.active) continue;

          // Oni patrol
          if (e.type === 'oni') {
            e.curX += e.vx * worldDt;
            if (e.curX > e.maxX) { e.curX = e.maxX; e.vx = -80; e.facing = -1; }
            if (e.curX < e.minX) { e.curX = e.minX; e.vx = 80; e.facing = 1; }
          }
          // Paper Lantern floating sine drift
          else if (e.type === 'lantern') {
            e.phase += worldDt * e.freq;
            e.curY = e.y + Math.sin(e.phase) * e.amp;
          }
          // Archer shooting
          else if (e.type === 'archer') {
            e.shootTimer -= worldDt;
            if (e.shootTimer <= 0) {
              e.shootTimer = 2.4;
              // Shoot slow ink arrow towards player
              const dir = (this.player.x < e.curX) ? -1 : 1;
              this.arrows.push({
                x: e.curX, y: e.curY - 6,
                vx: dir * 180,
                active: true
              });
            }
          }

          const enemyBox = {
            x: e.curX - 16, y: (e.curY || e.y) - 20, w: 32, h: 40
          };

          // Hit by Katana Slash
          if (slashBox && testAABB(slashBox, enemyBox)) {
            e.active = false;
            audio.playHit();
            particles.burstInk(e.curX, enemyBox.y + 20, 24, CONFIG.INK_BLACK);
            this.addScore(150);
            this.hitStopTimer = CONFIG.HITSTOP_TIME;
            camera.shake(3.5, 0.12);

            // Aerial bounce mechanic allows chaining slashes
            if (!this.player.isGrounded) {
              this.player.vy = CONFIG.SLASH_BOUNCE_Y;
              this.player.hasAirDash = true; // Refresh air dash on enemy kill!
            }
            continue;
          }

          // Enemy touches player
          if (testAABB(playerBox, enemyBox)) {
            if (this.player.damage(1)) {
              this.updateHUD();
            }
          }
        }

        // 6. Projectile Arrows
        for (let i = this.arrows.length - 1; i >= 0; i--) {
          const arr = this.arrows[i];
          arr.x += arr.vx * worldDt;

          const arrowBox = { x: arr.x - 12, y: arr.y - 4, w: 24, h: 8 };

          // Slash deflects arrow
          if (slashBox && testAABB(slashBox, arrowBox)) {
            arr.vx = -arr.vx * 1.5; // reflect backwards
            audio.playDeflect();
            particles.burstInk(arr.x, arr.y, 8, CONFIG.GOLD);
            camera.shake(2, 0.08);
            continue;
          }

          // Arrow hits player
          if (testAABB(playerBox, arrowBox)) {
            if (this.player.damage(1)) {
              this.updateHUD();
            }
            this.arrows.splice(i, 1);
            continue;
          }

          // Arrow hits an enemy while deflected
          for (const e of this.runtimeEnemies) {
            if (!e.active) continue;
            const eb = { x: e.curX - 16, y: (e.curY || e.y) - 20, w: 32, h: 40 };
            if (testAABB(arrowBox, eb)) {
              e.active = false;
              audio.playHit();
              particles.burstInk(e.curX, eb.y + 20, 20, CONFIG.INK_BLACK);
              this.addScore(200);
              this.arrows.splice(i, 1);
              break;
            }
          }
        }

        // 7. Hazard collisions (Spikes & Saws)
        for (const h of this.runtimeHazards) {
          const hBox = (h.type === 'saw')
            ? { x: h.curX - 18, y: h.y - 18, w: 36, h: 36 }
            : { x: h.x, y: h.y, w: h.w, h: h.h };

          if (testAABB(playerBox, hBox)) {
            if (this.player.damage(1)) {
              this.updateHUD();
            }
          }
        }

        // 8. Pickups (Coins, Koban, Powerups, Checkpoints, Torii Gate)
        for (let i = 0; i < this.runtimeCoins.length; i++) {
          const c = this.runtimeCoins[i];
          if (c.collected) continue;
          if (Math.hypot(this.player.x - c.x, this.player.y - c.y) < 28) {
            c.collected = true;
            this.runCoins += 1;
            this.addScore(50);
            audio.playCoin(i);
            particles.burstInk(c.x, c.y, 6, CONFIG.GOLD);
          }
        }

        // Rare Koban
        if (this.runtimeKoban && !this.runtimeKoban.collected) {
          const kb = this.runtimeKoban;
          if (Math.hypot(this.player.x - kb.x, this.player.y - kb.y) < 32) {
            kb.collected = true;
            this.runCoins += 10;
            this.addScore(500);
            audio.playKoban();
            particles.burstInk(kb.x, kb.y, 25, CONFIG.GOLD);
            camera.shake(3, 0.15);
          }
        }

        // Powerups
        for (const p of this.runtimePowerups) {
          if (p.collected) continue;
          if (Math.hypot(this.player.x - p.x, this.player.y - p.y) < 32) {
            p.collected = true;
            this.player.applyPowerup(p.type);
            particles.burstInk(p.x, p.y, 18, CONFIG.CRIMSON);
          }
        }

        // Checkpoints (Stone lanterns)
        for (const cp of (this.stage.checkpoints || [])) {
          if (Math.hypot(this.player.x - cp.x, this.player.y - cp.y) < 40) {
            if (this.activeCheckpoint !== cp) {
              this.activeCheckpoint = cp;
              audio.playCheckpoint();
              particles.burstInk(cp.x, cp.y - 20, 15, CONFIG.GOLD);
            }
          }
        }

        // Torii Gate Clear
        if (Math.hypot(this.player.x - this.stage.torii.x, this.player.y - (this.stage.torii.y - 40)) < 40) {
          this.onStageComplete();
        }

        // Update particles
        particles.update(dt);

        // Update camera
        camera.update(this.player, dt, this.stage.width, this.stage.height);
      }

      // Main RAF render loop with hit-stop freeze handling
      loop(currentTime) {
        requestAnimationFrame((t) => this.loop(t));

        if (!this.isRunning || this.isPaused) {
          this.render();
          return;
        }

        // Poll Gamepad
        input.pollGamepad();

        let dt = (currentTime - this.lastTime) / 1000;
        this.lastTime = currentTime;
        if (dt > 0.05) dt = 0.05; // Prevent dt spiral

        // Hit-stop brief 60ms freeze when katana connects
        if (this.hitStopTimer > 0) {
          this.hitStopTimer -= dt;
          this.render();
          return;
        }

        // Fixed-timestep physics accumulator
        this.accumulatedTime += dt;
        while (this.accumulatedTime >= this.fixedStep) {
          this.physicsTick(this.fixedStep);
          this.accumulatedTime -= this.fixedStep;
        }

        this.render();
      }

      // ===================================================================
      // PROCEDURAL SUMI-E RENDERING
      // ===================================================================
      render() {
        const ctx = this.ctx;
        const w = camera.viewportW;
        const h = camera.viewportH;

        // Base Paper Background Fill
        ctx.fillStyle = CONFIG.PAPER_BG;
        ctx.fillRect(0, 0, w, h);

        // Procedural Paper Texture overlay
        if (paperCanvas) {
          ctx.save();
          ctx.globalAlpha = 0.6;
          const pattern = ctx.createPattern(paperCanvas, 'repeat');
          ctx.fillStyle = pattern;
          ctx.fillRect(0, 0, w, h);
          ctx.restore();
        }

        // PARALLAX LAYER 1 (0.15 speed): Distant ink wash mountains in light grey
        this.drawParallaxMountains(ctx, 0.15, CONFIG.GREY_LIGHT, 0.35, 180);

        // PARALLAX LAYER 2 (0.35 speed): Midground bamboo ridges
        this.drawParallaxBamboo(ctx, 0.35, CONFIG.GREY_MID, 0.5, 260);

        // Camera Transform with Shake
        ctx.save();
        const shake = camera.getShakeOffset();
        // Snap the camera transform to whole device pixels. The camera eases in
        // with an exponential lerp, so it otherwise parks on a fractional offset
        // and nearest-neighbour sprite sampling re-phases every frame (shimmer).
        const dpr = this.dpr || 1;
        const snap = (v) => Math.round(v * dpr) / dpr;
        const z = camera.zoom;
        ctx.translate(snap(w / 2 + shake.x), snap(h / 2 + shake.y));
        ctx.scale(z, z);
        ctx.translate(snap(-camera.x * z) / z, snap(-camera.y * z) / z);

        // Render Checkpoint Stone Lanterns
        for (const cp of (this.stage.checkpoints || [])) {
          this.drawLantern(ctx, cp.x, cp.y, this.activeCheckpoint === cp);
        }

        // Render Torii Gate (Grand Stage Exit)
        this.drawToriiGate(ctx, this.stage.torii.x, this.stage.torii.y);

        // Render Platforms with Organic Brush Stroke Edges & Ink Bleed
        for (const p of this.runtimePlatforms) {
          if (p.isFallen) continue;
          this.drawBrushPlatform(ctx, p);
        }

        // Render Destructible bamboo barriers
        for (const d of this.runtimeDestructibles) {
          this.drawDestructible(ctx, d);
        }

        // Render Hazards (Spikes & Saws)
        for (const hz of this.runtimeHazards) {
          if (hz.type === 'spike') this.drawSpikes(ctx, hz);
          else if (hz.type === 'saw') this.drawSaw(ctx, hz);
        }

        // Render Pickups (Coins, Koban, Powerups)
        for (const c of this.runtimeCoins) {
          if (!c.collected) this.drawMonCoin(ctx, c.x, c.y);
        }
        if (this.runtimeKoban && !this.runtimeKoban.collected) {
          this.drawGoldenKoban(ctx, this.runtimeKoban.x, this.runtimeKoban.y);
        }
        for (const pw of this.runtimePowerups) {
          if (!pw.collected) this.drawPowerupItem(ctx, pw);
        }

        // Render Arrows
        for (const arr of this.arrows) {
          ctx.save();
          ctx.strokeStyle = CONFIG.INK_BLACK;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(arr.x - 12, arr.y);
          ctx.lineTo(arr.x + 12, arr.y);
          ctx.stroke();
          // Arrow head
          ctx.fillStyle = (arr.vx < 0) ? CONFIG.CRIMSON : CONFIG.INK_BLACK;
          ctx.beginPath();
          const headX = (arr.vx > 0) ? arr.x + 12 : arr.x - 12;
          ctx.arc(headX, arr.y, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Render Enemies
        for (const e of this.runtimeEnemies) {
          if (!e.active) continue;
          if (e.type === 'oni') this.drawOni(ctx, e);
          else if (e.type === 'lantern') this.drawLanternEnemy(ctx, e);
          else if (e.type === 'archer') this.drawArcher(ctx, e);
        }

        // Render Player Samurai
        this.player.draw(ctx);

        // Render Particles
        particles.draw(ctx);

        ctx.restore();
      }

      // Sumi-e Brush Platform: wobbly brush contour, ink bleed gradient beneath
      drawBrushPlatform(ctx, p) {
        ctx.save();
        // Soft ink-bleed shadow underneath
        ctx.fillStyle = 'rgba(13, 13, 16, 0.08)';
        ctx.fillRect(p.x, p.y + p.h, p.w, 14);

        // Solid ink body
        ctx.fillStyle = CONFIG.INK_BLACK;
        ctx.beginPath();
        // Organic wobbly top line
        ctx.moveTo(p.x, p.y);
        const steps = Math.max(4, Math.floor(p.w / 30));
        for (let i = 1; i <= steps; i++) {
          const px = p.x + (p.w / steps) * i;
          const py = p.y + ((i % 2 === 0) ? -1.5 : 1.5);
          ctx.lineTo(px, py);
        }
        ctx.lineTo(p.x + p.w, p.y + p.h);
        ctx.lineTo(p.x, p.y + p.h);
        ctx.closePath();
        ctx.fill();

        // Crumbling crack indicator
        if (p.crumbling && p.crumbleTimer > 0) {
          ctx.strokeStyle = CONFIG.PAPER_BG;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(p.x + p.w * 0.3, p.y);
          ctx.lineTo(p.x + p.w * 0.5, p.y + p.h);
          ctx.stroke();
        }
        ctx.restore();
      }

      drawDestructible(ctx, d) {
        ctx.save();
        ctx.fillStyle = CONFIG.GREY_DARK;
        ctx.fillRect(d.x, d.y, d.w, d.h);
        ctx.strokeStyle = CONFIG.INK_BLACK;
        ctx.lineWidth = 2;
        ctx.strokeRect(d.x, d.y, d.w, d.h);
        // Diagonal crack
        ctx.strokeStyle = CONFIG.CRIMSON;
        ctx.beginPath();
        ctx.moveTo(d.x + 4, d.y + 4);
        ctx.lineTo(d.x + d.w - 4, d.y + d.h - 4);
        ctx.stroke();
        ctx.restore();
      }

      drawSpikes(ctx, hz) {
        ctx.save();
        ctx.fillStyle = CONFIG.GREY_DARK;
        const count = Math.floor(hz.w / 16);
        for (let i = 0; i < count; i++) {
          const sx = hz.x + i * 16;
          ctx.beginPath();
          ctx.moveTo(sx, hz.y + hz.h);
          ctx.lineTo(sx + 8, hz.y);
          ctx.lineTo(sx + 16, hz.y + hz.h);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      drawSaw(ctx, hz) {
        ctx.save();
        ctx.translate(hz.curX, hz.y);
        ctx.rotate((performance.now() / 80));
        ctx.fillStyle = CONFIG.INK_BLACK;
        // 4-bladed spinning shuriken
        for (let i = 0; i < 4; i++) {
          ctx.rotate(Math.PI / 2);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(-6, -16);
          ctx.lineTo(0, -22);
          ctx.lineTo(6, -16);
          ctx.closePath();
          ctx.fill();
        }
        ctx.fillStyle = CONFIG.CRIMSON;
        ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      drawMonCoin(ctx, x, y) {
        ctx.save();
        ctx.translate(x, y + Math.sin(performance.now() / 250 + x) * 3);
        ctx.fillStyle = CONFIG.GREY_MID;
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fill();
        // Square center hole
        ctx.fillStyle = CONFIG.PAPER_BG;
        ctx.fillRect(-3, -3, 6, 6);
        ctx.restore();
      }

      drawGoldenKoban(ctx, x, y) {
        ctx.save();
        ctx.translate(x, y + Math.sin(performance.now() / 200) * 4);
        ctx.fillStyle = CONFIG.GOLD;
        ctx.beginPath();
        ctx.ellipse(0, 0, 9, 14, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = CONFIG.INK_BLACK;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // Inscription lines
        ctx.fillStyle = CONFIG.INK_BLACK;
        ctx.fillRect(-4, -6, 8, 2);
        ctx.fillRect(-4, 0, 8, 2);
        ctx.fillRect(-4, 6, 8, 2);
        ctx.restore();
      }

      drawPowerupItem(ctx, pw) {
        ctx.save();
        ctx.translate(pw.x, pw.y + Math.sin(performance.now() / 220) * 4);
        // Spinning aura ring
        ctx.strokeStyle = CONFIG.CRIMSON;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.stroke();
        // Icon / Kanji
        ctx.fillStyle = CONFIG.INK_BLACK;
        ctx.font = 'bold 13px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const symbol = pw.type === 'zanshin' ? '残' : (pw.type === 'edge' ? '刃' : '札');
        ctx.fillText(symbol, 0, 1);
        ctx.restore();
      }

      drawLantern(ctx, x, y, active) {
        ctx.save();
        ctx.translate(x, y);
        // Stone base
        ctx.fillStyle = CONFIG.GREY_DARK;
        ctx.fillRect(-8, -12, 16, 12);
        ctx.fillRect(-12, -18, 24, 6);
        // Window chamber
        ctx.fillStyle = active ? CONFIG.GOLD : CONFIG.GREY_MID;
        ctx.fillRect(-6, -28, 12, 10);
        // Roof cap
        ctx.fillStyle = CONFIG.INK_BLACK;
        ctx.beginPath();
        ctx.moveTo(-16, -28);
        ctx.lineTo(0, -36);
        ctx.lineTo(16, -28);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      drawToriiGate(ctx, x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = CONFIG.INK_BLACK;
        // Two main pillars
        ctx.fillRect(-28, -80, 8, 80);
        ctx.fillRect(20, -80, 8, 80);
        // Top curved crossbeam (Kasagi)
        ctx.beginPath();
        ctx.moveTo(-42, -84);
        ctx.quadraticCurveTo(0, -90, 42, -84);
        ctx.lineTo(44, -76);
        ctx.quadraticCurveTo(0, -82, -44, -76);
        ctx.closePath();
        ctx.fill();
        // Lower crossbeam (Nuki)
        ctx.fillRect(-34, -68, 68, 6);
        // Golden sacred crest
        ctx.fillStyle = CONFIG.GOLD;
        ctx.beginPath();
        ctx.arc(0, -75, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawOni(ctx, e) {
        ctx.save();
        ctx.translate(e.curX, e.curY);
        ctx.scale(e.facing, 1);
        ctx.fillStyle = CONFIG.INK_BLACK;
        // Horned silhouette body
        ctx.beginPath();
        ctx.arc(0, -8, 12, 0, Math.PI * 2);
        ctx.fill();
        // Horns
        ctx.beginPath();
        ctx.moveTo(-6, -18); ctx.lineTo(-10, -26); ctx.lineTo(-3, -20);
        ctx.moveTo(6, -18); ctx.lineTo(10, -26); ctx.lineTo(3, -20);
        ctx.fill();
        // Glowing crimson eye dot
        ctx.fillStyle = CONFIG.CRIMSON;
        ctx.beginPath();
        ctx.arc(4, -8, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawLanternEnemy(ctx, e) {
        ctx.save();
        ctx.translate(e.curX, e.curY);
        ctx.fillStyle = CONFIG.GREY_DARK;
        ctx.beginPath();
        ctx.ellipse(0, 0, 12, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        // Center crimson flicker
        ctx.fillStyle = CONFIG.CRIMSON;
        ctx.beginPath();
        ctx.arc(0, 0, 4 + Math.sin(e.phase * 3) * 1.5, 0, Math.PI * 2);
        ctx.fill();
        // Paper tassel trailing below
        ctx.strokeStyle = CONFIG.INK_BLACK;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, 16);
        ctx.lineTo(Math.sin(e.phase * 2) * 4, 26);
        ctx.stroke();
        ctx.restore();
      }

      drawArcher(ctx, e) {
        ctx.save();
        ctx.translate(e.curX, e.curY);
        const dir = (this.player.x < e.curX) ? -1 : 1;
        ctx.scale(dir, 1);
        ctx.fillStyle = CONFIG.INK_BLACK;
        // Torso
        ctx.fillRect(-8, -24, 16, 24);
        // Head
        ctx.beginPath(); ctx.arc(0, -30, 7, 0, Math.PI * 2); ctx.fill();
        // Bow arc
        ctx.strokeStyle = CONFIG.CRIMSON;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(10, -16, 14, -1, 1);
        ctx.stroke();
        ctx.restore();
      }

      drawParallaxMountains(ctx, speed, color, alpha, baseHeight) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        const scrollX = camera.x * speed;
        const w = camera.viewportW;
        const h = camera.viewportH;
        ctx.beginPath();
        ctx.moveTo(0, h);
        const mountainW = 280;
        const startIdx = Math.floor(scrollX / mountainW) - 1;
        const endIdx = startIdx + Math.ceil(w / mountainW) + 2;
        for (let i = startIdx; i <= endIdx; i++) {
          const mx = i * mountainW - scrollX;
          const peakY = h - baseHeight - Math.abs(Math.sin(i * 1.7)) * 120;
          ctx.lineTo(mx, peakY);
        }
        ctx.lineTo(w, h);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      drawParallaxBamboo(ctx, speed, color, alpha, baseHeight) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        const scrollX = camera.x * speed;
        const w = camera.viewportW;
        const h = camera.viewportH;
        const stalkSpacing = 90;
        const startIdx = Math.floor(scrollX / stalkSpacing) - 1;
        const endIdx = startIdx + Math.ceil(w / stalkSpacing) + 2;
        for (let i = startIdx; i <= endIdx; i++) {
          const bx = i * stalkSpacing - scrollX;
          const bh = baseHeight + (i % 3) * 40;
          ctx.fillRect(bx, h - bh, 6, bh);
          // Bamboo leaves
          ctx.beginPath();
          ctx.ellipse(bx + 12, h - bh + 20, 14, 4, 0.3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // =====================================================================
    // 9. BOOTSTRAP INITIALIZATION
    // =====================================================================
    // Preload sprite sheets before Play button activates
    loadSprites();

    // Instantiate game immediately so Play overlay is functional with 0 delay
    const game = new Game();
    window.game = game;
    requestAnimationFrame((t) => game.loop(t));

    // Parallel SDK Boot Sequence (never blocks the Play button)
    (async function bootCrazyGamesAndStorage() {
      let sdkInitSuccess = false;
      try {
        const initPromise = (async () => {
          if (window.CrazyGames && window.CrazyGames.SDK && typeof window.CrazyGames.SDK.init === 'function') {
            await window.CrazyGames.SDK.init();
            return true;
          }
          return false;
        })();

        const timeoutPromise = new Promise((resolve) => setTimeout(() => resolve(false), 3000));
        sdkInitSuccess = await Promise.race([initPromise, timeoutPromise]);
      } catch (e) {
        console.warn('[CrazyGames] SDK init error / timeout caught:', e);
        sdkInitSuccess = false;
      }

      // Resolve the single 3-tier Save wrapper
      await Save.init(sdkInitSuccess);

      // Sync state to audio and HUD
      if (Save.get('muted')) {
        audio.muted = true;
        if (audio.masterGain && audio.ctx) {
          audio.masterGain.gain.setValueAtTime(0, audio.ctx.currentTime);
        }
        const muteBtn = document.getElementById('muteBtn');
        if (muteBtn) muteBtn.textContent = '🔇';
      }

      if (game) {
        game.highScore = Math.max(game.highScore, Save.get('highScore') || 0);
        game.updateHUD();
      }

      if (Save.get('seenControlHint')) {
        const hint = document.getElementById('controlsHint');
        if (hint) hint.classList.add('faded');
      }
    })();

  })();
  </script>
</body>
