    // =====================================================================
    // 3. INPUT HANDLING & TOUCH DUAL CONTROLS
    // =====================================================================
    class InputSystem {
      constructor() {
        this.left = false;
        this.right = false;
        this.jumpPressed = false;
        this.jumpHeld = false;
        this.slashPressed = false;
        this.dashPressed = false;
        this.touchActive = false;

        this.setupKeyboard();
        this.setupTouch();
      }

      setupKeyboard() {
        window.addEventListener('keydown', (e) => {
          audio.init();
          if (e.repeat) return;
          // A cutscene owns the keyboard while it is up. Advancing it must not
          // also queue a jump for the run waiting behind it.
          if (Dialogue.active) {
            if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyJ' ||
                e.code === 'KeyX' || e.code === 'ArrowRight' || e.code === 'KeyD') {
              e.preventDefault();
              Dialogue.advance();
            } else if (e.code === 'Escape') {
              e.preventDefault();
              // Escape ends the scene outright rather than pausing behind it
              while (Dialogue.active) Dialogue.advance();
            }
            return;
          }
          switch (e.code) {
            case 'KeyA': case 'ArrowLeft': this.left = true; break;
            case 'KeyD': case 'ArrowRight': this.right = true; break;
            case 'Space': case 'KeyW': case 'ArrowUp':
              this.jumpPressed = true; this.jumpHeld = true; e.preventDefault(); break;
            case 'KeyJ': case 'KeyX': this.slashPressed = true; break;
            case 'ShiftLeft': case 'ShiftRight': case 'KeyK': case 'KeyC':
              this.dashPressed = true; break;
            case 'KeyP': case 'Escape':
              game.togglePause(); break;
            case 'KeyM':
              game.toggleMute(); break;
          }
        });

        window.addEventListener('keyup', (e) => {
          switch (e.code) {
            case 'KeyA': case 'ArrowLeft': this.left = false; break;
            case 'KeyD': case 'ArrowRight': this.right = false; break;
            case 'Space': case 'KeyW': case 'ArrowUp': this.jumpHeld = false; break;
          }
        });
      }

      setupTouch() {
        const touchArea = document.getElementById('touch-controls');
        const enableTouchUI = () => {
          if (!this.touchActive) {
            this.touchActive = true;
            touchArea.classList.add('active');
          }
          audio.init();
        };

        window.addEventListener('touchstart', enableTouchUI, { passive: true });

        const bindBtn = (id, onDown, onUp) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            el.classList.add('pressed');
            onDown();
          }, { passive: false });
          el.addEventListener('touchend', (e) => {
            e.preventDefault(); e.stopPropagation();
            el.classList.remove('pressed');
            if (onUp) onUp();
          }, { passive: false });
          el.addEventListener('touchcancel', () => {
            el.classList.remove('pressed');
            if (onUp) onUp();
          });
        };

        bindBtn('tBtnLeft', () => { this.left = true; }, () => { this.left = false; });
        bindBtn('tBtnRight', () => { this.right = true; }, () => { this.right = false; });
        bindBtn('tBtnJump', () => { this.jumpPressed = true; this.jumpHeld = true; }, () => { this.jumpHeld = false; });
        bindBtn('tBtnSlash', () => { this.slashPressed = true; });
        bindBtn('tBtnDash', () => { this.dashPressed = true; });
      }

      pollGamepad() {
        if (!navigator.getGamepads) return;
        const gamepads = navigator.getGamepads();
        for (let i = 0; i < gamepads.length; i++) {
          const gp = gamepads[i];
          if (!gp) continue;
          // Left stick & Dpad
          const axisX = gp.axes[0] || 0;
          const dpadLeft = gp.buttons[14] && gp.buttons[14].pressed;
          const dpadRight = gp.buttons[15] && gp.buttons[15].pressed;
          if (axisX < -0.3 || dpadLeft) this.left = true;
          else if (!this.touchActive && !keysDown['ArrowLeft'] && !keysDown['KeyA']) this.left = false;

          if (axisX > 0.3 || dpadRight) this.right = true;
          else if (!this.touchActive && !keysDown['ArrowRight'] && !keysDown['KeyD']) this.right = false;

          // A button (jump)
          if (gp.buttons[0] && gp.buttons[0].pressed) {
            if (!this.gpJumpPrev) { this.jumpPressed = true; this.jumpHeld = true; }
            this.gpJumpPrev = true;
          } else {
            if (this.gpJumpPrev) { this.jumpHeld = false; this.gpJumpPrev = false; }
          }
          // X button (slash)
          if (gp.buttons[2] && gp.buttons[2].pressed) {
            if (!this.gpSlashPrev) this.slashPressed = true;
            this.gpSlashPrev = true;
          } else { this.gpSlashPrev = false; }
          // B or R1 button (dash)
          if ((gp.buttons[1] && gp.buttons[1].pressed) || (gp.buttons[5] && gp.buttons[5].pressed)) {
            if (!this.gpDashPrev) this.dashPressed = true;
            this.gpDashPrev = true;
          } else { this.gpDashPrev = false; }
          break;
        }
      }

      consumeJump() {
        const p = this.jumpPressed;
        this.jumpPressed = false;
        return p;
      }
      consumeSlash() {
        const p = this.slashPressed;
        this.slashPressed = false;
        return p;
      }
      consumeDash() {
        const p = this.dashPressed;
        this.dashPressed = false;
        return p;
      }

      // Drop every buffered press and every held direction. Called whenever
      // the game hands control back to the player after a menu or a cutscene,
      // so the first frame of a chapter is never a jump nobody asked for.
      clearPresses() {
        this.left = this.right = false;
        this.jumpPressed = this.jumpHeld = false;
        this.slashPressed = this.dashPressed = false;
      }
    }
    const keysDown = {};
    const input = new InputSystem();

    // =====================================================================
    // 4. PROCEDURAL SUMI-E GRAPHICS & PARTICLE POOL
    // =====================================================================
    // High performance particle system with static pool
    class ParticlePool {
      constructor(max = 240) {
        this.particles = new Array(max).fill(null).map(() => ({
          active: false, x: 0, y: 0, vx: 0, vy: 0,
          radius: 2, color: CONFIG.INK_BLACK, life: 1, maxLife: 1, type: 'ink'
        }));
      }

      spawn(x, y, vx, vy, radius, color, life, type = 'ink') {
        const p = this.particles.find(pt => !pt.active);
        if (!p) return;
        p.active = true;
        p.x = x; p.y = y; p.vx = vx; p.vy = vy;
        p.radius = radius; p.color = color;
        p.life = life; p.maxLife = life;
        p.type = type;
      }

      burstInk(x, y, count = 12, color = CONFIG.LEAF) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 40 + Math.random() * 180;
          this.spawn(
            x, y,
            Math.cos(angle) * speed, Math.sin(angle) * speed,
            2 + Math.random() * 4.5,
            color,
            0.3 + Math.random() * 0.45,
            'ink'
          );
        }
      }

      dust(x, y, dir = 0) {
        for (let i = 0; i < 4; i++) {
          this.spawn(
            x, y + 2,
            (Math.random() * 40 - 20) + dir * 30, -15 - Math.random() * 30,
            1.5 + Math.random() * 2.5,
            'rgba(228, 224, 210, 0.45)',
            0.25 + Math.random() * 0.2,
            'dust'
          );
        }
      }

      update(dt) {
        for (let i = 0; i < this.particles.length; i++) {
          const p = this.particles[i];
          if (!p.active) continue;
          p.life -= dt;
          if (p.life <= 0) { p.active = false; continue; }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.type === 'ink') {
            p.vy += 420 * dt; // ink gravity
            p.vx *= 0.96;
          } else {
            p.vx *= 0.92;
            p.vy *= 0.92;
          }
        }
      }

      draw(ctx) {
        for (let i = 0; i < this.particles.length; i++) {
          const p = this.particles[i];
          if (!p.active) continue;
          const alpha = p.life / p.maxLife;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }
    const particles = new ParticlePool();

    // =====================================================================
    // 5. CAMERA & ADAPTIVE DUAL VIEWPORT (LANDSCAPE + PORTRAIT)
    // =====================================================================
    class Camera {
      constructor() {
        this.x = 0;
        this.y = 0;
        this.targetX = 0;
        this.targetY = 0;
        this.zoom = 1;
        this.viewportW = 960;
        this.viewportH = 540;
        this.shakeTime = 0;
        this.shakeMag = 0;
        this.isPortrait = false;
      }

      shake(mag = 4, time = 0.2) {
        this.shakeMag = Math.min(mag, CONFIG.SCREEN_SHAKE_MAX);
        this.shakeTime = time;
      }

      update(target, dt, stageWidth, stageHeight) {
        if (this.shakeTime > 0) this.shakeTime -= dt;

        // Dynamic orientation calculation
        const aspect = window.innerWidth / Math.max(1, window.innerHeight);
        this.isPortrait = aspect < 1.0;

        // Portrait zooms in ~1.35x and frames higher vertical room
        this.zoom = this.isPortrait ? 1.35 : 1.0;
        const lookAheadX = this.isPortrait ? (target.facing * 40) : (target.facing * 110);
        const offsetY = this.isPortrait ? -30 : -20;

        this.targetX = target.x + lookAheadX;
        this.targetY = target.y + offsetY;

        // Smooth damped camera follow
        const lerpFactor = 8.0 * dt;
        this.x += (this.targetX - this.x) * Math.min(lerpFactor, 1.0);
        this.y += (this.targetY - this.y) * Math.min(lerpFactor, 1.0);

        // Clamp camera to stage borders
        const halfW = (this.viewportW / 2) / this.zoom;
        const halfH = (this.viewportH / 2) / this.zoom;
        this.x = Math.max(halfW - 40, Math.min(stageWidth - halfW + 40, this.x));
        this.y = Math.max(halfH - 80, Math.min(stageHeight - halfH + 80, this.y));
      }

      getShakeOffset() {
        if (this.shakeTime <= 0) return { x: 0, y: 0 };
        const mag = this.shakeMag * (this.shakeTime / 0.2);
        return {
          x: (Math.random() * 2 - 1) * mag,
          y: (Math.random() * 2 - 1) * mag
        };
      }
    }
    const camera = new Camera();

    // Map numbers are two digits all the way to 10, so the labels stay aligned
    const mapNo = (i) => String(i + 1).padStart(2, '0');

    // =====================================================================
    // 6B. ENDLESS ROAD — THE SAME VOCABULARY, GENERATED FOREVER
    // =====================================================================
    // Ten maps end. This does not: chunks are appended a screen and a half
    // ahead of the samurai and dropped a screen behind him, so the world stays
    // a constant size no matter how far the run goes. Every piece it can place
    // is a piece one of the handcrafted maps already taught.
    const ENDLESS = {
      AHEAD: 1700,        // build this far past the player
      BEHIND: 900,        // and forget everything this far back
      GROUND_MIN: 400,
      GROUND_MAX: 560,
      PIT_FLOOR: 760,
      GROUND_H: 170,     // slab thickness; the pit below it is empty air
      RAMP_DISTANCE: 9000, // distance over which difficulty reaches full
      BOSS_FIRST: 5000,   // world-x of the first boss on the road
      BOSS_EVERY: 6500    // and how far apart they stand after that
    };

    class EndlessWorld {
      constructor(game) {
        this.game = game;
      }

      begin() {
        const g = this.game;
        g.runtimePlatforms = [];
        g.runtimeHazards = [];
        g.runtimeEnemies = [];
        g.runtimeDestructibles = [];
        g.runtimeCoins = [];
        g.runtimePowerups = [];
        g.runtimeKoban = null;
        g.runtimePrompts = [];
        g.runtimeCheckpoints = [];
        g.sceneryProps = [];
        g.arrows = [];

        this.groundY = 500;
        this.cursor = -200;
        this.lastKind = 'run';
        this.sinceItem = 0;
        this.nextBoss = ENDLESS.BOSS_FIRST;
        this.bossCount = 0;

        // A long, empty, flat opener. The first three seconds of an endless run
        // must never kill anyone — that is where the player learns the rhythm.
        this.push('platform', { x: -200, y: 500, w: 1100, h: ENDLESS.GROUND_H });
        this.cursor = 900;
        this.fill(2600);
      }

      // Difficulty is a single 0..1 dial every chunk reads from.
      get heat() {
        return Math.min(1, Math.max(0, this.game.endlessDist / ENDLESS.RAMP_DISTANCE));
      }

      push(kind, obj) {
        const g = this.game;
        if (kind === 'platform') {
          g.runtimePlatforms.push({
            ...obj, baseX: obj.x, baseY: obj.y,
            crumbleTimer: 0, isFallen: false, respawnTimer: 0, phase: 0
          });
        } else if (kind === 'hazard') {
          g.runtimeHazards.push({ ...obj, curX: obj.x, curY: obj.y, dir: 1 });
        } else if (kind === 'enemy') {
          g.runtimeEnemies.push({
            ...obj, curX: obj.x,
            curY: (obj.type === 'oni' || obj.type === 'archer')
              ? standOn(obj.x, obj.y, g.runtimePlatforms) : obj.y,
            vx: obj.type === 'oni' ? 80 : 0, facing: 1, animT: Math.random() * 3,
            shootTimer: 1.5 + Math.random(), active: true, phase: Math.random() * 10,
            ...(obj.type === 'boss'
                ? bossRuntime(obj, standOn(obj.x, obj.y, g.runtimePlatforms) + 20)
                : null)
          });
        } else if (kind === 'coin') {
          g.runtimeCoins.push({ ...obj, collected: false });
        } else if (kind === 'powerup') {
          g.runtimePowerups.push({ ...obj, collected: false });
        }
      }

      // Spikes filling exactly the hole between two world-x positions
      pit(x0, x1) {
        if (x1 - x0 < 20) return;
        this.push('hazard', {
          type: 'spike', x: x0, y: ENDLESS.PIT_FLOOR - 50, w: x1 - x0, h: 50
        });
      }

      coinArc(x, y, n, step = 60) {
        for (let i = 0; i < n; i++) this.push('coin', { x: x + i * step, y });
      }

      // Keep building until the world reaches `target` world-x.
      fill(target) {
        let guard = 0;
        while (this.cursor < target && guard++ < 40) this.chunk();
      }

      chunk() {
        const h = this.heat;
        // A boss holds the road at fixed intervals. Measured in world-x rather
        // than distance travelled, because chunks are built well ahead of the
        // samurai and the boss has to be standing there when he arrives.
        if (this.cursor >= this.nextBoss) {
          this.nextBoss = this.cursor + ENDLESS.BOSS_EVERY;
          this.lastKind = 'boss';
          this.chunk_boss(h);
          return;
        }
        const r = Math.random();
        // Early on the road is mostly ground with the occasional hop. Later the
        // gaps, the moving pieces and the walls crowd it out.
        let kind;
        if (r < 0.30 - h * 0.16) kind = 'run';
        else if (r < 0.55 - h * 0.10) kind = 'gap';
        else if (r < 0.70) kind = 'steps';
        else if (r < 0.82) kind = 'crumble';
        else if (r < 0.92) kind = 'moving';
        else kind = 'chimney';
        // Never the same shape twice in a row: repetition is what makes a
        // generated level feel generated.
        if (kind === this.lastKind && kind !== 'run') kind = 'run';
        this.lastKind = kind;
        this['chunk_' + kind](h);

        // An item roughly every fourth chunk, so the reward beat has a rhythm.
        this.sinceItem++;
        if (this.sinceItem >= 4) {
          this.sinceItem = 0;
          const types = ['charm', 'zanshin', 'edge'];
          this.push('powerup', {
            type: types[(Math.random() * 3) | 0],
            x: this.cursor - 120, y: this.groundY - 70
          });
        }
      }

      // A stretch of solid ground. Room to breathe, sometimes an oni on it.
      chunk_run(h) {
        const w = 380 + Math.random() * 260;
        const x = this.cursor;
        this.push('platform', { x, y: this.groundY, w, h: ENDLESS.GROUND_H });
        this.coinArc(x + 70, this.groundY - 44, 3 + ((Math.random() * 3) | 0));
        if (Math.random() < 0.35 + h * 0.4) {
          this.push('enemy', {
            type: 'oni', x: x + w * 0.6, y: this.groundY - 40,
            minX: x + 40, maxX: x + w - 40
          });
        }
        if (Math.random() < h * 0.4) {
          this.push('enemy', { type: 'archer', x: x + w - 50, y: this.groundY - 40 });
        }
        this.cursor = x + w;
      }

      // A hole with spikes at the bottom of it.
      chunk_gap(h) {
        const gap = 130 + h * 130 + Math.random() * 60;
        const x = this.cursor;
        this.push('hazard', { type: 'spike', x, y: ENDLESS.PIT_FLOOR - 50, w: gap, h: 50 });
        this.coinArc(x + gap * 0.5 - 30, this.groundY - 110, 2, 60);
        this.stepGround(gap);
        const w = 300 + Math.random() * 200;
        this.push('platform', { x: this.cursor, y: this.groundY, w, h: ENDLESS.GROUND_H });
        if (Math.random() < 0.4 + h * 0.3) {
          this.push('enemy', {
            type: 'lantern', x: this.cursor + w * 0.5, y: this.groundY - 150,
            amp: 40 + h * 30, freq: 2 + Math.random()
          });
        }
        this.cursor += w;
      }

      // Two or three ledges climbing away from the ground line.
      chunk_steps(h) {
        const n = 2 + ((Math.random() * 2) | 0);
        const gapStart = this.cursor;
        let x = this.cursor + 60;
        let y = this.groundY - 70;
        const dir = Math.random() < 0.5 ? -1 : 1;
        for (let i = 0; i < n; i++) {
          this.push('platform', { x, y, w: 110, h: 22 });
          this.push('coin', { x: x + 55, y: y - 42 });
          x += 185 + h * 30;
          y = Math.max(220, Math.min(this.groundY - 50, y + dir * 62));
        }
        this.cursor = x + 20;
        this.pit(gapStart, this.cursor);
        const w = 300 + Math.random() * 160;
        this.push('platform', { x: this.cursor, y: this.groundY, w, h: ENDLESS.GROUND_H });
        this.cursor += w;
      }

      // Ledges that drop away the moment they are stood on.
      chunk_crumble(h) {
        const n = 3;
        const gapStart = this.cursor;
        let x = this.cursor + 70;
        const y = this.groundY - 60;
        for (let i = 0; i < n; i++) {
          this.push('platform', { x, y: y - i * 12, w: 95, h: 20, crumbling: true });
          this.push('coin', { x: x + 47, y: y - i * 12 - 42 });
          x += 170;
        }
        this.cursor = x + 20;
        this.pit(gapStart, this.cursor);
        this.stepGround(0);
        const w = 320 + Math.random() * 160;
        this.push('platform', { x: this.cursor, y: this.groundY, w, h: ENDLESS.GROUND_H });
        this.cursor += w;
      }

      // One raft over a pit, sweeping sideways or riding up and down.
      chunk_moving(h) {
        const x = this.cursor;
        const span = 420 + h * 120;
        this.push('hazard', { type: 'spike', x, y: ENDLESS.PIT_FLOOR - 50, w: span, h: 50 });
        const vertical = Math.random() < 0.5;
        this.push('platform', {
          x: x + span * 0.35, y: this.groundY - 70, w: 125, h: 22, moving: true,
          moveX: vertical ? 0 : 150 + h * 60,
          moveY: vertical ? 110 + h * 40 : 0,
          moveSpeed: 1.0 + h * 0.6
        });
        this.coinArc(x + span * 0.4, this.groundY - 150, 3, 55);
        if (Math.random() < 0.5) {
          this.push('hazard', {
            type: 'saw', x: x + span * 0.5, y: ENDLESS.PIT_FLOOR - 110,
            startX: x + 60, endX: x + span - 60, speed: 150 + h * 90
          });
        }
        this.cursor = x + span;
        this.stepGround(0);
        const w = 300 + Math.random() * 160;
        this.push('platform', { x: this.cursor, y: this.groundY, w, h: ENDLESS.GROUND_H });
        this.cursor += w;
      }

      // A wall-jump shaft with a coin column up the middle of it.
      chunk_chimney(h) {
        const x = this.cursor + 60;
        const top = 180 - h * 60;
        this.pit(this.cursor, x + 285);
        this.push('platform', { x, y: top + 40, w: 45, h: ENDLESS.PIT_FLOOR - top - 40 });
        this.push('platform', { x: x + 200, y: top, w: 45, h: ENDLESS.PIT_FLOOR - top });
        this.push('platform', { x: x + 45, y: top + 20, w: 155, h: 22 });
        for (let i = 0; i < 4; i++) {
          this.push('coin', { x: x + 122, y: this.groundY - 40 - i * 80 });
        }
        if (Math.random() < 0.4 + h * 0.4) {
          this.push('hazard', { type: 'spike', x: x + 45, y: this.groundY - 170, w: 20, h: 50 });
        }
        this.cursor = x + 245 + 40;
        const w = 320 + Math.random() * 160;
        this.push('platform', { x: this.cursor, y: this.groundY, w, h: ENDLESS.GROUND_H });
        this.cursor += w;
      }

      // A boss, on a long flat slab with nothing else on it. The road has no
      // gate to seal, so this one can be run straight past — it is the only
      // thing out here that is worth stopping for rather than something that
      // has to be beaten, and the arena is flat so that choice stays honest.
      chunk_boss(h) {
        const w = 940;
        const x = this.cursor;
        this.push('platform', { x, y: this.groundY, w, h: ENDLESS.GROUND_H });
        const kinds = ['mech', 'ooze', 'bear'];
        this.push('enemy', {
          type: 'boss',
          kind: kinds[this.bossCount++ % kinds.length],
          x: x + w * 0.62, y: this.groundY - 80,
          minX: x + 150, maxX: x + w - 150
        });
        this.coinArc(x + 170, this.groundY - 150, 4, 80);
        this.cursor = x + w;
      }

      // Nudge the ground line up or down. How much it may RISE is capped by how
      // wide the gap in front of it is: a 320px gap plus a 100px step up is past
      // what the jump arc can do, and a generated map may never be impossible.
      stepGround(gapWidth) {
        const room = Math.max(0, 1 - gapWidth / 320);
        const up = 100 * room;
        const delta = -up + Math.random() * (up + 90);
        this.groundY = Math.max(ENDLESS.GROUND_MIN,
                       Math.min(ENDLESS.GROUND_MAX, this.groundY + delta));
        this.cursor += gapWidth;
      }

      // Build ahead, forget behind. Called every tick while endless is running.
      stream(playerX) {
        const before = this.game.runtimePlatforms.length;
        this.fill(playerX + ENDLESS.AHEAD);
        if (this.game.runtimePlatforms.length !== before) {
          // Dress only the newly generated ground, then keep what is still
          // on the road behind us.
          const fresh = this.game.runtimePlatforms.slice(before);
          this.game.sceneryProps = (this.game.sceneryProps || [])
            .concat(buildScenery(fresh, (this.seed = (this.seed || 12345) + 7919)));
        }
        const cut = playerX - ENDLESS.BEHIND;
        const g = this.game;
        const alive = (o, w) => (o.x + (w || o.w || 40)) > cut;
        g.runtimePlatforms = g.runtimePlatforms.filter(p => alive(p));
        g.sceneryProps = (g.sceneryProps || []).filter(sp => sp.x > cut);
        g.runtimeHazards = g.runtimeHazards.filter(z => alive(z, z.type === 'saw' ? 40 : z.w));
        g.runtimeEnemies = g.runtimeEnemies.filter(e => e.curX > cut);
        g.runtimeCoins = g.runtimeCoins.filter(c => c.x > cut);
        g.runtimePowerups = g.runtimePowerups.filter(p => p.x > cut);
      }
    }

    // =====================================================================
    // 6C. RUN BOARD — THE REASON TO COME BACK
    // =====================================================================
    // Persisted through the same three-tier Save wrapper as everything else,
    // so on CrazyGames it follows the account across devices. It ranks runs,
    // not just a single number, and it records how the run ended.
    const RunBoard = {
      MAX: 12,

      all() {
        const rows = Save.get('runBoard');
        return Array.isArray(rows) ? rows : [];
      },

      // Returns the 1-based rank the run landed at, or 0 if it did not place.
      submit(entry) {
        const rows = this.all().slice();
        rows.push(entry);
        rows.sort((a, b) => (b.score - a.score) || (b.dist - a.dist));
        const trimmed = rows.slice(0, this.MAX);
        const rank = trimmed.indexOf(entry);
        Save.write({ runBoard: trimmed });
        return rank < 0 ? 0 : rank + 1;
      }
    };

    // Board names are typed by the player and go through innerHTML, so they
    // are escaped on the way out rather than trusted.
    function escapeText(str) {
      return String(str).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    // The name on the board. CrazyGames hands us a real account name when the
    // player is signed in there; otherwise it is whatever they typed, and a
    // ronin has no name until he earns one.
    let cgUserName = '';
    function playerName() {
      const typed = (Save.get('playerName') || '').trim();
      return (typed || cgUserName || 'RONIN').slice(0, 10).toUpperCase();
    }

                   STAGE_CONFIGS.length + ' maps — they must be index-aligned');

    // ---------------------------------------------------------------------
    // CUTSCENE CARD
    // ---------------------------------------------------------------------
    // Types the line out, then waits. A second press while it is still typing
    // finishes the line instead of skipping it — the one interaction rule
    // every player already knows from every other game with a text box.
    const Dialogue = {
      lines: [], idx: 0, onDone: null, active: false,
      shown: '', full: '', typing: false, typeT: 0,

      el(id) { return document.getElementById(id); },

      play(lines, onDone) {
        if (!lines || !lines.length) { if (onDone) onDone(); return; }
        this.lines = lines;
        this.idx = 0;
        this.onDone = onDone || null;
        this.active = true;
        this.el('dialogue').classList.remove('hidden');
        document.body.classList.add('in-scene');
        this.render();
      },

      render() {
        const l = this.lines[this.idx];
        const who = CAST[l.who] || CAST.none;
        const card = this.el('dlgCard');
        const face = this.el('dlgFace');

        card.classList.toggle('narration', !who.face);
        if (who.face) {
          const src = FACE[who.face];
          // Only reassign on a change: writing the same src restarts the
          // decode and flashes the portrait between two lines by one speaker.
          if (face.getAttribute('src') !== src) face.src = src;
          face.style.objectPosition = who.crop;
        }
        this.el('dlgName').innerHTML = who.name
          ? escapeText(who.name) + '<span class="dlg-title">' + escapeText(who.title) + '</span>'
          : '';
        this.el('dlgProgress').textContent = (this.idx + 1) + ' / ' + this.lines.length;
        // touchActive only turns on after a first touch, and the opening scene
        // of the game happens before one — so ask the device as well.
        let coarse = false;
        try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
        this.el('dlgHint').textContent = (input.touchActive || coarse)
          ? 'Tap to continue' : 'Click or [SPACE] to continue';

        this.full = l.text;
        this.shown = '';
        this.typing = true;
        this.typeT = 0;
      },

      // Driven off the render loop rather than a timer, so it slows down with
      // a backgrounded tab instead of finishing invisibly.
      tick(dt) {
        if (!this.active || !this.typing) return;
        this.typeT += dt;
        const n = Math.floor(this.typeT / 0.022);
        if (n >= this.full.length) {
          this.shown = this.full;
          this.typing = false;
        } else {
          this.shown = this.full.slice(0, n);
        }
        this.el('dlgText').innerHTML = escapeText(this.shown) +
          (this.typing ? '<span class="dlg-caret">▍</span>' : '');
      },

      // One press: finish the line. Another: take the next one.
      advance() {
        if (!this.active) return;
        if (this.typing) {
          this.typing = false;
          this.shown = this.full;
          this.el('dlgText').textContent = this.full;
          return;
        }
        this.idx++;
        if (this.idx >= this.lines.length) { this.finish(); return; }
        this.render();
      },

      finish() {
        this.active = false;
        this.el('dialogue').classList.add('hidden');
        document.body.classList.remove('in-scene');
        const cb = this.onDone;
        this.onDone = null;
        // Space and J both advance a scene and both do something in the run
        // that follows. Without this the samurai jumps the instant it ends.
        input.clearPresses();
        if (cb) cb();
      }
    };

    // ---------------------------------------------------------------------
    // IN-RUN BARK
    // ---------------------------------------------------------------------
    // Queued rather than replaced: two barks landing in the same second (a
    // level beat and a phase change) must not eat each other.
    const Bark = {
      queue: [], holdT: 0, showing: false,

      say(who, text, hold = 3.2) {
        if (!text) return;
        this.queue.push({ who, text, hold });
        if (!this.showing) this.next();
      },

      next() {
        const b = this.queue.shift();
        const el = document.getElementById('bark');
        if (!b) {
          this.showing = false;
          el.classList.remove('show');
          // Left in the tree until the fade finishes, then taken out of it
          setTimeout(() => { if (!this.showing) el.classList.add('hidden'); }, 320);
          return;
        }
        const who = CAST[b.who] || CAST.none;
        el.classList.toggle('no-face', !who.face);
        if (who.face) {
          const img = document.getElementById('barkFace');
          const src = FACE[who.face];
          if (img.getAttribute('src') !== src) img.src = src;
          img.style.objectPosition = who.crop;
        }
        document.getElementById('barkWho').textContent = who.name;
        document.getElementById('barkText').textContent = b.text;
        el.classList.remove('hidden');
        // One frame of layout before the transition, or it snaps in
        requestAnimationFrame(() => el.classList.add('show'));
        this.showing = true;
        this.holdT = b.hold;
      },

      tick(dt) {
        if (!this.showing) return;
        this.holdT -= dt;
        if (this.holdT <= 0) {
          if (this.queue.length) {
            this.next();
          } else {
            this.showing = false;
            const el = document.getElementById('bark');
            el.classList.remove('show');
            setTimeout(() => { if (!this.showing) el.classList.add('hidden'); }, 320);
          }
        }
      },

      // Leaving a run must not leave a line hanging over the menu
      clear() {
        this.queue.length = 0;
        this.showing = false;
        const el = document.getElementById('bark');
        el.classList.remove('show');
        el.classList.add('hidden');
      }
    };

    // =====================================================================
    // 7. ENTITIES & LOGIC
    // =====================================================================
    // Frame clock for the samurai sheets. It never gates anything: the game
    // sets a clip every tick and this just decides which cell to blit, so an
    // action can always interrupt whatever is playing.
    class Animator {
      constructor() {
        this.clip = 'idle';
        this.frame = 0;
        this.timer = 0;
        this.done = false;
      }

      play(clipName) {
        if (this.clip !== clipName) {
          this.clip = clipName;
          this.frame = 0;
          this.timer = 0;
          this.done = false;
        }
      }

      update(dt) {
        const c = SPRITES[this.clip];
        if (!c) return;
        if (this.done && !c.loop) return;
        const step = 1 / (c.fps || 10);
        this.timer += dt;
        while (this.timer >= step) {
          this.timer -= step;
          if (this.frame + 1 < c.frames) {
            this.frame += 1;
          } else if (c.loop) {
            this.frame = 0;
          } else {
            this.done = true;
            this.frame = c.frames - 1;   // hold the last cell
            break;
          }
        }
      }

      cell() {
        const c = SPRITES[this.clip];
        return c ? (c.startFrame || 0) + this.frame : 0;
      }
    }

    class Player {
      constructor() {
        // Collision box stays exactly CONFIG.playerW x CONFIG.playerH world units
        this.w = CONFIG.playerW;
        this.h = CONFIG.playerH;
        this.animator = new Animator();
        this.trail = [];
        this.reset(80, 440);
      }

      reset(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.facing = 1; // 1 = right, -1 = left
        this.isGrounded = false;
        this.isWallSliding = false;
        this.wallDir = 0; // -1 wall left, 1 wall right
        this.coyoteTimer = 0;
        this.jumpBufferTimer = 0;
        this.hasDoubleJump = true;
        this.hasAirDash = true;
        this.isDashing = false;
        this.dashTimer = 0;
        this.jumpHoldTimer = 0;
        this.wallLockoutTimer = 0;

        // Katana attack
        this.isSlashing = false;
        this.slashTimer = 0;
        this.slashCooldown = 0;

        // Health & Invulnerability
        this.health = CONFIG.MAX_HEALTH;
        this.invulnTimer = 0;

        // Animation state machine
        this.scaleX = 1;
        this.scaleY = 1;
        this.animTime = 0;
        this.runCycle = 0;
        this.landTimer = 0;
        this.landPeak = 0.12;
        this.animState = 'idle';
        this.animator.play('idle');
        this.trail.length = 0;

        // One-shot "the player just did this" flags, read and cleared by the
        // game each tick. The textless prompts are the only consumer.
        this.evtJump = false;
        this.evtDash = false;
        this.evtSlash = false;

        // Active powerup
        this.powerup = null; // 'zanshin' | 'edge' | 'charm'
        this.powerupTimer = 0;
      }

      applyPowerup(type) {
        this.powerup = type;
        this.powerupTimer = 10.0;
        audio.playPowerup();
        const pill = document.getElementById('powerupPill');
        if (pill) {
          pill.style.display = 'block';
          pill.textContent = type.toUpperCase() + ' 10s';
        }
      }

      damage(amount = 1) {
        if (this.invulnTimer > 0) return false;

        // Charm absorbs hit
        if (this.powerup === 'charm') {
          this.powerup = null;
          this.powerupTimer = 0;
          this.invulnTimer = 0.6;
          audio.playDeflect();
          camera.shake(3, 0.15);
          particles.burstInk(this.x, this.y, 16, CONFIG.GOLD);
          const pill = document.getElementById('powerupPill');
          if (pill) pill.style.display = 'none';
          return false;
        }

        this.health -= amount;
        this.invulnTimer = CONFIG.INVULN_TIME;
        this.animState = 'hurt';
        this.scaleX = 0.92; this.scaleY = 1.12;
        audio.playHit();
        // The same 60ms bite the katana gets. Getting hit should land with the
        // same weight as landing a hit, or damage reads as a number changing.
        game.hitStopTimer = CONFIG.HITSTOP_TIME;
        camera.shake(6, 0.25);
        particles.burstInk(this.x, this.y, 20, CONFIG.CRIMSON);

        // Flash vignette
        const flash = document.getElementById('damage-flash');
        if (flash) {
          flash.style.opacity = '1';
          setTimeout(() => { flash.style.opacity = '0'; }, 180);
        }

        if (this.health <= 0) {
          game.onPlayerDeath();
        }
        return true;
      }

      update(dt, platforms, destructibles) {
        // Powerup timer countdown
        if (this.powerupTimer > 0) {
          this.powerupTimer -= dt;
          const pill = document.getElementById('powerupPill');
          if (pill) {
            pill.textContent = this.powerup.toUpperCase() + ' ' + Math.ceil(this.powerupTimer) + 's';
          }
          if (this.powerupTimer <= 0) {
            this.powerup = null;
            if (pill) pill.style.display = 'none';
          }
        }

        if (this.invulnTimer > 0) this.invulnTimer -= dt;
        if (this.wallLockoutTimer > 0) this.wallLockoutTimer -= dt;

        // 1. Air Dash state
        if (this.isDashing) {
          this.dashTimer -= dt;
          this.vy = 0; // suspend gravity during dash
          this.vx = this.facing * CONFIG.DASH_SPEED;
          particles.dust(this.x - this.facing * 12, this.y, -this.facing);

          if (this.dashTimer <= 0) {
            this.isDashing = false;
            this.vx = this.facing * CONFIG.MAX_RUN_SPEED;
          }
        } else {
          // 2. Horizontal Run Acceleration & Friction
          let moveInput = 0;
          if (this.wallLockoutTimer <= 0) {
            if (input.left) moveInput -= 1;
            if (input.right) moveInput += 1;
          }

          if (moveInput !== 0) {
            this.facing = moveInput > 0 ? 1 : -1;
            // Skid check
            const isSkidding = (this.vx > 60 && moveInput < 0) || (this.vx < -60 && moveInput > 0);
            const accel = isSkidding ? CONFIG.SKID_DECEL : CONFIG.RUN_ACCEL;
            this.vx += moveInput * accel * dt;

            if (isSkidding && this.isGrounded) {
              particles.dust(this.x, this.y + this.h / 2, this.facing);
            }
          } else {
            // Deceleration to stop
            if (this.vx > 0) {
              this.vx = Math.max(0, this.vx - CONFIG.RUN_DECEL * dt);
            } else if (this.vx < 0) {
              this.vx = Math.min(0, this.vx + CONFIG.RUN_DECEL * dt);
            }
          }
          // Clamp top speed
          this.vx = Math.max(-CONFIG.MAX_RUN_SPEED, Math.min(CONFIG.MAX_RUN_SPEED, this.vx));

          // 3. Vertical & Gravity
          if (!this.isGrounded) {
            this.coyoteTimer -= dt;

            if (this.isWallSliding) {
              // Wall slide drag
              if (this.vy > CONFIG.WALL_SLIDE_SPEED) {
                this.vy = CONFIG.WALL_SLIDE_SPEED;
              } else {
                this.vy += CONFIG.GRAVITY * 0.4 * dt;
              }
              if (Math.random() < 0.25) {
                particles.dust(this.x + this.wallDir * (this.w / 2), this.y, 0);
              }
            } else {
              // Variable jump boost while holding jump
              if (input.jumpHeld && this.jumpHoldTimer > 0) {
                this.vy += CONFIG.JUMP_HOLD_ACCEL * dt;
                this.jumpHoldTimer -= dt;
              }
              // Apex hang, then fast fall. Near the top of the arc the samurai
              // floats — that is the window the player actually aims in — and
              // once he is past it he drops hard, so the landing is a decision
              // instead of a wait.
              let g = CONFIG.GRAVITY;
              if (Math.abs(this.vy) < CONFIG.APEX_VY_WINDOW) {
                g *= CONFIG.APEX_GRAVITY_MULT;
              } else if (this.vy > 0) {
                g *= CONFIG.FAST_FALL_MULT;
              }
              this.vy += g * dt;
              if (this.vy > CONFIG.MAX_FALL_SPEED) this.vy = CONFIG.MAX_FALL_SPEED;
            }
          } else {
            this.coyoteTimer = CONFIG.COYOTE_TIME;
            this.hasDoubleJump = true;
            this.hasAirDash = true;
            this.isWallSliding = false;
            // Landing snaps the feet to exactly plat.y, where the overlap test
            // (bottom > rect.y) reads false. Without a downward bias the very
            // next frame reports airborne, gravity re-lands the player, and the
            // pose alternates jumpFall/land at 60Hz. Keep the feet biting in.
            this.vy = CONFIG.GROUND_STICK_VEL;
          }

          // Dash Trigger (max 15% deformation)
          if (input.consumeDash() && this.hasAirDash) {
            this.hasAirDash = false;
            this.isDashing = true;
            this.evtDash = true;
            this.dashTimer = CONFIG.DASH_DURATION;
            this.scaleX = 1.15; this.scaleY = 0.88; // Sleek horizontal deformation
            audio.playDash();
            camera.shake(2.5, 0.1);
          }

          // Jump Input Buffer (squash & stretch within 15% max deformation)
          if (input.consumeJump()) {
            this.jumpBufferTimer = CONFIG.JUMP_BUFFER;
          }
          if (this.jumpBufferTimer > 0) {
            this.jumpBufferTimer -= dt;
            // A) Normal or Coyote Jump
            if (this.coyoteTimer > 0) {
              this.vy = CONFIG.JUMP_INITIAL_VEL;
              this.evtJump = true;
              this.jumpHoldTimer = CONFIG.JUMP_HOLD_MAX_TIME;
              this.coyoteTimer = 0;
              this.jumpBufferTimer = 0;
              this.isGrounded = false;
              this.scaleX = 0.88; this.scaleY = 1.15; // Vertical stretch on rise
              audio.playJump(false);
              particles.dust(this.x, this.y + this.h / 2, 0);
            }
            // B) Wall Jump
            else if (this.isWallSliding) {
              this.vy = CONFIG.WALL_JUMP_VEL_Y;
              this.evtJump = true;
              this.vx = -this.wallDir * CONFIG.WALL_JUMP_VEL_X;
              this.facing = -this.wallDir;
              this.wallLockoutTimer = CONFIG.WALL_JUMP_LOCKOUT;
              this.isWallSliding = false;
              this.jumpBufferTimer = 0;
              this.hasAirDash = true; // Wall kick refreshes dash
              this.scaleX = 0.88; this.scaleY = 1.15;
              audio.playJump(false);
              particles.burstInk(this.x + this.wallDir * (this.w / 2), this.y, 8, '#CFCBBC');
            }
            // C) Air Double Jump
            else if (this.hasDoubleJump) {
              this.hasDoubleJump = false;
              this.evtJump = true;
              this.vy = CONFIG.DOUBLE_JUMP_VEL;
              this.jumpHoldTimer = CONFIG.JUMP_HOLD_MAX_TIME * 0.75;
              this.jumpBufferTimer = 0;
              this.scaleX = 0.88; this.scaleY = 1.15;
              audio.playJump(true);
              particles.burstInk(this.x, this.y + this.h / 2, 14, '#DCD7C6');
            }
          }
        }

        // Katana Slash. Gated by a cooldown shorter than the arc itself, so a
        // second press cuts the previous arc off instead of being swallowed —
        // the slash never has to play out before the next one is allowed.
        if (this.slashCooldown > 0) this.slashCooldown -= dt;
        if (input.consumeSlash() && this.slashCooldown <= 0) {
          this.isSlashing = true;
          this.evtSlash = true;
          this.slashTimer = CONFIG.SLASH_DURATION;
          this.slashCooldown = CONFIG.SLASH_COOLDOWN;
          audio.playSlash();
          camera.shake(1.5, 0.08);

          // Test destructible blocks break
          const reach = (this.powerup === 'edge') ? CONFIG.SLASH_RANGE_POWERED : CONFIG.SLASH_RANGE_NORMAL;
          const slashBox = {
            x: this.facing > 0 ? this.x : this.x - reach,
            y: this.y - 20,
            w: reach,
            h: 44
          };
          for (let i = destructibles.length - 1; i >= 0; i--) {
            const d = destructibles[i];
            if (testAABB(slashBox, d)) {
              particles.burstInk(d.x + d.w / 2, d.y + d.h / 2, 22, '#9C8B78');
              audio.playHit();
              destructibles.splice(i, 1);
              game.addScore(100);
              // Same 60ms bite the katana gets on a body: contact always stops
              // the world for a beat, whatever it connected with.
              game.hitStopTimer = CONFIG.HITSTOP_TIME;
              camera.shake(3, 0.12);
            }
          }
        }
        if (this.isSlashing) {
          this.slashTimer -= dt;
          if (this.slashTimer <= 0) this.isSlashing = false;
        }

        // 4. Move and Collide with Platforms
        // Snapshot before the reset: the landing impact must fire on the
        // air->ground transition, not on every frame the feet touch down.
        const wasGrounded = this.isGrounded;
        this.isGrounded = false;
        this.isWallSliding = false;
        this.wallDir = 0;

        // Move X
        this.x += this.vx * dt;
        for (const plat of platforms) {
          if (plat.isFallen) continue;
          if (this.checkCollision(plat)) {
            if (this.vx > 0) {
              this.x = plat.x - this.w / 2;
              this.vx = 0;
              // Check wall slide
              if (!wasGrounded && input.right && this.vy > 0) {
                this.isWallSliding = true;
                this.wallDir = 1;
              }
            } else if (this.vx < 0) {
              this.x = plat.x + plat.w + this.w / 2;
              this.vx = 0;
              if (!wasGrounded && input.left && this.vy > 0) {
                this.isWallSliding = true;
                this.wallDir = -1;
              }
            }
          }
        }

        // Move Y
        const impactVy = this.vy;
        this.y += this.vy * dt;
        for (const plat of platforms) {
          if (plat.isFallen) continue;
          if (this.checkCollision(plat)) {
            if (this.vy > 0) { // Landing
              this.y = plat.y - this.h / 2;
              this.vy = 0;
              if (!wasGrounded) {
                // Land squash scaled by how hard the touchdown was, so a hop
                // and a long fall read differently. Capped at 15% deformation.
                const impact = Math.min(1, impactVy / CONFIG.MAX_FALL_SPEED);
                this.scaleX = 1 + 0.15 * impact;
                this.scaleY = 1 - 0.15 * impact;
                this.landTimer = 0.09 + 0.09 * impact;
                this.landPeak = this.landTimer;
                particles.dust(this.x, this.y + this.h / 2, 0);
                if (impact > 0.55) {
                  camera.shake(2.2 * impact, 0.1);
                  particles.dust(this.x - 8, this.y + this.h / 2, -1);
                  particles.dust(this.x + 8, this.y + this.h / 2, 1);
                }
              }
              this.isGrounded = true;
              this.hasAirDash = true;

              // Step on crumbling platform
              if (plat.crumbling && !plat.crumbleTimer) {
                plat.crumbleTimer = 0.4;
              }
            } else if (this.vy < 0) { // Head bump
              this.y = plat.y + plat.h + this.h / 2;
              this.vy = 0;
            }
          }
        }

        // Smooth squash and stretch relaxation (capped strictly at max 15% deformation)
        this.scaleX += (1 - this.scaleX) * 12 * dt;
        this.scaleY += (1 - this.scaleY) * 12 * dt;
        this.scaleX = Math.max(0.85, Math.min(1.15, this.scaleX));
        this.scaleY = Math.max(0.85, Math.min(1.15, this.scaleY));

        // 5. Animation State Determination by Strict Priority:
        // dead > hurt > dash > slash > wallSlide > jumpRise/jumpFall > land > run > idle
        this.animTime += dt;
        if (this.health <= 0) {
          this.animState = 'dead';
        } else if (this.invulnTimer > 0.6) {
          this.animState = 'hurt';
        } else if (this.isDashing) {
          this.animState = 'dash';
        } else if (this.isSlashing) {
          this.animState = 'slash';
        } else if (this.isWallSliding) {
          this.animState = 'wallSlide';
        } else if (!this.isGrounded) {
          this.animState = (this.vy < -20) ? 'jumpRise' : 'jumpFall';
        } else if (this.landTimer > 0) {
          this.animState = 'land';
          this.landTimer -= dt;
        } else if (Math.abs(this.vx) > 20) {
          this.animState = 'run';
          this.runCycle += dt * (Math.abs(this.vx) / 28);
        } else {
          this.animState = 'idle';
        }

        this.animator.play(this.animState);
        this.animator.update(dt);

        // Dash afterimages. Only the dash leaves them, so the burst reads as
        // distance covered rather than as generic speed lines.
        for (let i = this.trail.length - 1; i >= 0; i--) {
          this.trail[i].life -= dt;
          if (this.trail[i].life <= 0) this.trail.splice(i, 1);
        }
        if (this.isDashing && (this.trail.length === 0 ||
            Math.abs(this.x - this.trail[this.trail.length - 1].x) > 9)) {
          this.trail.push({ x: this.x, y: this.y, facing: this.facing, life: 0.22 });
        }
      }

      checkCollision(rect) {
        const left = this.x - this.w / 2;
        const right = this.x + this.w / 2;
        const top = this.y - this.h / 2;
        const bottom = this.y + this.h / 2;
        return (
          left < rect.x + rect.w &&
          right > rect.x &&
          top < rect.y + rect.h &&
          bottom > rect.y
        );
      }

      // Blit one samurai cell with the feet on the bottom of the hitbox.
      blit(ctx, alpha) {
        const clip = SPRITES[this.animator.clip] || SPRITES.idle;
        const dw = Math.round(CELL * CONFIG.spriteScale);
        const dh = dw;
        ctx.globalAlpha = alpha;
        if (!drawFrame(ctx, clip.img, this.animator.cell(), CELL, CELL,
                       Math.round(-dw / 2), -dh, dw, dh)) {
          // Sheet missing: a plain block still shows where the player is
          ctx.fillStyle = '#E8D9A0';
          ctx.fillRect(Math.round(-this.w / 2), -this.h, this.w, this.h);
        }
      }

      draw(ctx) {
        const smooth = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = false;   // pixel art must stay crisp

        // Dash afterimages, oldest and faintest first
        for (const t of this.trail) {
          ctx.save();
          ctx.translate(Math.round(t.x), Math.round(t.y + this.h / 2));
          ctx.scale(t.facing, 1);
          this.blit(ctx, (t.life / 0.22) * 0.3);
          ctx.restore();
        }

        ctx.save();
        // Feet sit on the hitbox bottom, which is where the sheets are anchored
        ctx.translate(Math.round(this.x + (CONFIG.spriteAnchorX || 0)),
                      Math.round(this.y + this.h / 2 + (CONFIG.spriteAnchorY || 0)));
        ctx.scale(this.facing * this.scaleX, this.scaleY);
        // Invulnerable flicker: fade, never skip drawing entirely
        const a = this.invulnTimer > 0
          ? ((Math.floor(Date.now() / 70) % 2 === 0) ? 0.35 : 0.9) : 1;
        this.blit(ctx, a);
        ctx.restore();
        ctx.globalAlpha = 1;

        // A ward crystal orbiting the shoulder while the charm is up
        if (this.powerup === 'charm') {
          drawProp(ctx, 'crystalC', this.x,
                   this.y - 30 + Math.sin(performance.now() / 220) * 3, 0.7);
        }
        ctx.imageSmoothingEnabled = smooth;

        // Katana slash crescent stroke visualization
        if (this.isSlashing) {
          const progress = 1 - (this.slashTimer / CONFIG.SLASH_DURATION);
          const reach = (this.powerup === 'edge') ? CONFIG.SLASH_RANGE_POWERED : CONFIG.SLASH_RANGE_NORMAL;
          ctx.save();
          ctx.translate(Math.round(this.x), Math.round(this.y));
          ctx.scale(this.facing, 1);
          ctx.globalAlpha = Math.max(0, 1 - progress * 0.85);
          ctx.strokeStyle = (this.powerup === 'edge') ? '#FF6B5A' : '#F4F0E2';
          ctx.lineWidth = 4.5;
          ctx.shadowColor = (this.powerup === 'edge') ? CONFIG.CRIMSON : '#8FE3FF';
          ctx.shadowBlur = 10;
          ctx.lineCap = 'round';
          ctx.beginPath();
          const startAngle = -1.1 + progress * 0.5;
          const endAngle = 0.9 + progress * 0.4;
          ctx.arc(6, -2, reach, startAngle, endAngle);
          ctx.stroke();

          // Crimson Edge shockwave aura
          if (this.powerup === 'edge') {
            ctx.strokeStyle = 'rgba(224, 59, 59, 0.45)';
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.arc(6, -2, reach + 8, startAngle - 0.1, endAngle + 0.1);
            ctx.stroke();
          }
          ctx.restore();
        }

        // Debug Hitbox outline in crimson
        if (CONFIG.DEBUG_HITBOX) {
          ctx.save();
          ctx.strokeStyle = CONFIG.CRIMSON;
          ctx.lineWidth = 1.5;
          ctx.strokeRect(
            Math.round(this.x - this.w / 2),
            Math.round(this.y - this.h / 2),
            this.w,
            this.h
          );
          ctx.restore();
        }
      }
    }

    // Small deterministic RNG so a map's scenery is identical every run —
    // trees that move between attempts read as bugs.
    function seededRandom(seed) {
      let s = seed >>> 0 || 1;
      return () => {
        s ^= s << 13; s >>>= 0;
        s ^= s >> 17;
        s ^= s << 5; s >>>= 0;
        return s / 4294967296;
      };
    }

    // Dress the tops of the wide platforms with trees and bushes. Purely
    // decorative: nothing here is ever collided against or drawn in front of
    // the player, so it can never hide a hazard.
    const SCENERY_KEYS = [
      { key: 'treeMid',      scale: 0.85, weight: 1, alpha: 0.9 },
      { key: 'treeSmall',    scale: 0.9,  weight: 2, alpha: 0.95 },
      { key: 'bushBig',      scale: 1.0,  weight: 3, alpha: 1 },
      { key: 'bushMid',      scale: 1.0,  weight: 3, alpha: 1 },
      { key: 'bushSmall',    scale: 1.0,  weight: 3, alpha: 1 },
      { key: 'mushroom',     scale: 1.0,  weight: 2, alpha: 1 },
      { key: 'mushroomTall', scale: 1.0,  weight: 2, alpha: 1 }
    ];
    const SCENERY_BAG = SCENERY_KEYS.flatMap(e => Array(e.weight).fill(e));

    function buildScenery(platforms, seed) {
      const rnd = seededRandom(seed);
      const props = [];
      for (const p of platforms) {
        if (p.w < 160 || p.h < 40 || p.moving || p.crumbling) continue;  // ground only
        const n = Math.min(6, Math.floor(p.w / 190));
        for (let i = 0; i < n; i++) {
          const pick = SCENERY_BAG[Math.floor(rnd() * SCENERY_BAG.length)];
          props.push({
            key: pick.key,
            x: Math.round(p.x + 40 + rnd() * (p.w - 80)),
            y: p.y + 2,
            scale: pick.scale * (0.85 + rnd() * 0.3),
            alpha: pick.alpha
          });
        }
      }
      // Far things first so the near ones overlap them correctly
      props.sort((a, b) => b.scale - a.scale);
      return props;
    }

    // A walking enemy's hitbox is curY-20 .. curY+20, so its feet rest on a
    // surface when curY is 20 above that surface's top. Finds the nearest one
    // below the authored position and returns the curY that plants it there.
    function standOn(x, y, platforms) {
      let bestTop = null;
      for (const p of platforms) {
        if (x < p.x - 8 || x > p.x + p.w + 8) continue;
        if (p.y < y - 30) continue;                 // above the enemy: not a floor
        if (bestTop === null || p.y < bestTop) bestTop = p.y;
      }
      return bestTop === null ? y : bestTop - 20;
    }

    // AABB Collision Helper
    function testAABB(r1, r2) {
      return (
        r1.x < r2.x + r2.w &&
        r1.x + r1.w > r2.x &&
        r1.y < r2.y + r2.h &&
        r1.y + r1.h > r2.y
      );
    }

    // =====================================================================
    // 8. GAME LOOP & STATE MANAGEMENT
    // =====================================================================
    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.stageIdx = 0;
        this.mode = 'stage';           // 'stage' | 'story' | 'endless'
        this.chapterIdx = 0;           // which STORY entry is being walked
        this.runtimeBeats = [];        // this chapter's barks, armed by x
        this.lastAdAt = 0;
        this.endless = new EndlessWorld(this);
        this.endlessDist = 0;
        this.runtimePrompts = [];
        this.runtimeCheckpoints = [];
        this.player = new Player();
        this.stage = null;
        this.activeCheckpoint = null;

        // Score, Coins & Combo
        this.score = 0;
        this.highScore = Save.get('highScore') || 0;
        this.combo = 1.0;
        this.comboTimer = 0;
        this.runCoins = 0;

        // State Flags
        this.isRunning = false;
        this.isPaused = false;
        this.overlayMode = 'title';
        this.hitStopTimer = 0;

        // Timing accumulator
        this.lastTime = 0;
        this.accumulatedTime = 0;
        this.fixedStep = 1 / 60; // 60Hz deterministic physics tick

        // Arrows, particles, platforms runtime
        this.arrows = [];
        this.runtimePlatforms = [];
        this.runtimeEnemies = [];
        this.runtimeCoins = [];
        this.runtimePowerups = [];
        this.runtimeHazards = [];
        this.runtimeDestructibles = [];
        this.runtimeKoban = null;

        this.setupWindow();
        this.loadStage(0);
        this.updateHUD();
        // The splash is already in the markup; this fills in the chapter the
        // Play button would resume and puts the secondary paths beside it.
        this.showTitle();
      }

      setupWindow() {
        const resize = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          this.dpr = dpr;
          const w = window.innerWidth;
          const h = window.innerHeight;
          this.canvas.width = w * dpr;
          this.canvas.height = h * dpr;
          this.ctx.resetTransform?.();
          this.ctx.scale(dpr, dpr);
          camera.viewportW = w;
          camera.viewportH = h;
        };
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', resize);
        resize();

        // Pause on tab switch & save run high score
        document.addEventListener('visibilitychange', () => {
          if (document.hidden && this.isRunning && !this.isPaused) {
            this.togglePause();
            if (this.highScore > (Save.get('highScore') || 0)) {
              Save.write({ highScore: this.highScore });
            }
          }
        });
        window.addEventListener('blur', () => {
          if (this.isRunning && !this.isPaused) {
            this.togglePause();
          }
        });

        // UI Controls setup
        document.getElementById('startBtn').addEventListener('click', () => {
          audio.init();
          this.startOrResume();
        });

        // A cutscene is advanced by clicking it anywhere. The keyboard path
        // lives in InputSystem.setupKeyboard, which shorts out while one is up.
        const dlg = document.getElementById('dialogue');
        dlg.addEventListener('click', () => { audio.init(); Dialogue.advance(); });
        dlg.addEventListener('touchstart', (ev) => {
          ev.preventDefault();
          audio.init();
          Dialogue.advance();
        }, { passive: false });
        document.getElementById('muteBtn').addEventListener('click', () => {
          audio.init();
          this.toggleMute();
        });
        document.getElementById('pauseBtn').addEventListener('click', () => {
          this.togglePause();
        });
        document.getElementById('btnRetry').addEventListener('click', () => {
          audio.init();
          // Each screen decides what "again" means: the board always means
          // another endless run, a stage result means that stage.
          (this.retryAction || (() => this.startStage(this.stageIdx)))();
        });
        document.getElementById('btnBoard').addEventListener('click', () => {
          audio.init();
          this.showRunBoard(null, 0);
        });

        // The name is committed as it is typed; there is no submit step to miss
        const nameInput = document.getElementById('nameInput');
        const commitName = () => {
          const v = nameInput.value.trim().slice(0, 10).toUpperCase();
          Save.write({ playerName: v });
        };
        nameInput.addEventListener('change', commitName);
        nameInput.addEventListener('blur', commitName);
        // Typing a name must not steer the samurai
        nameInput.addEventListener('keydown', (e) => {
          e.stopPropagation();
          if (e.key === 'Enter') nameInput.blur();
        });
        document.getElementById('btnNext').addEventListener('click', () => {
          audio.init();
          // In the story the button means the next chapter, with its scene;
          // in free play it means the next map and nothing else.
          if (this.mode === 'story') {
            const next = Math.min(this.chapterIdx + 1, STORY.length - 1);
            this.withAdBreak(() => this.startChapter(next));
            return;
          }
          const nextIdx = Math.min(this.stageIdx + 1, STAGE_CONFIGS.length - 1);
          this.withAdBreak(() => this.startStage(nextIdx));
        });
        document.getElementById('btnMaps').addEventListener('click', () => {
          audio.init();
          this.showMapSelect();
        });
        document.getElementById('btnStory').addEventListener('click', () => {
          audio.init();
          this.showStorySelect();
        });
      }

      toggleMute() {
        const m = audio.toggleMute();
        document.getElementById('muteBtn').textContent = m ? '🔇' : '♪';
      }

      togglePause() {
        if (!this.isRunning) return;
        this.isPaused = !this.isPaused;
        audio.setMuted(this.isPaused);
        const overlay = document.getElementById('overlay');
        if (this.isPaused) {
          window.GameEvents.gameplayStop();
          // 'paused' mode hides the map grid and result panel, shows the play button
          this.setOverlayMode('paused', {
            kanji: '憩',
            title: 'PAUSED',
            subtitle: 'The wind pauses in the bamboo grove.',
            caption: 'Click to Resume'
          });
          this.setOverlayButtons({ maps: true, story: this.mode === 'story' });
        } else {
          window.GameEvents.gameplayStart();
          overlay.classList.add('hidden');
          this.lastTime = performance.now();
        }
      }

      loadStage(idx, respawnAtCheckpoint = false) {
        this.stageIdx = idx;
        const data = STAGE_CONFIGS[idx];
        this.stage = data;
        setTheme(data.theme);
        this.hideBossBar();

        const stageTitleEl = document.getElementById('stageTitle');
        if (stageTitleEl) {
          stageTitleEl.textContent = `MAP ${mapNo(idx)} — ${data.name}`;
        }

        // Clone runtime platforms
        this.runtimePlatforms = data.platforms.map(p => ({
          ...p,
          baseX: p.x, baseY: p.y,
          crumbleTimer: 0,
          isFallen: false,
          respawnTimer: 0
        }));

        // Clone hazards
        this.runtimeHazards = data.hazards.map(h => ({
          ...h,
          curX: h.x, curY: h.y, dir: 1
        }));

        // Clone enemies. Oni and archers walk, so their feet are snapped to the
        // surface underneath them — the authored y values put their hitboxes
        // 20-40px in the air, which reads as enemies hovering over the ground.
        this.runtimeEnemies = data.enemies.map(e => ({
          ...e,
          curX: e.x,
          curY: (e.type === 'oni' || e.type === 'archer')
            ? standOn(e.x, e.y, this.runtimePlatforms)
            : e.y,
          vx: e.type === 'oni' ? 80 : 0,
          facing: 1,
          animT: Math.random() * 3,   // desync identical enemies
          shootTimer: 1.5,
          active: true,
          phase: Math.random() * 10,
          // Bosses hover, so they keep their authored y and carry a fight state.
          ...(e.type === 'boss'
              ? bossRuntime(e, standOn(e.x, e.y, this.runtimePlatforms) + 20)
              : null),
          // A warden stands on the arena floor, so its curY is snapped to that
          // surface and its whole fight is clamped to it.
          ...(e.type === 'warden'
              ? (() => {
                  const floor = standOn(e.x, e.y, this.runtimePlatforms) + 20;
                  return { curY: floor, ...wardenRuntime(e, floor) };
                })()
              : null)
        }));

        // Clone destructibles
        this.runtimeDestructibles = data.destructibles.map(d => ({ ...d }));

        // Decorative dressing, seeded off the map id so it never shifts
        this.sceneryProps = buildScenery(this.runtimePlatforms, (idx + 1) * 7919);

        // Stone lanterns are drawn upward from their anchor, so the authored y
        // (a hitbox-centre height) leaves them hanging in the air. Clone them
        // with the anchor moved down onto the surface they mark.
        this.runtimeCheckpoints = (data.checkpoints || []).map(cp => ({
          ...cp, y: standOn(cp.x, cp.y, this.runtimePlatforms) + 20
        }));

        // Clone the textless onboarding glyphs. `used` is set the first time
        // the player performs the matching action, and the glyph never returns.
        this.runtimePrompts = (data.prompts || []).map(p => ({ ...p, alpha: 0, used: false }));

        // Clone coins & items
        this.runtimeCoins = data.coins.map(c => ({ ...c, collected: false }));
        this.runtimeKoban = data.koban ? { ...data.koban, collected: false } : null;
        this.runtimePowerups = (data.powerups || []).map(p => ({ ...p, collected: false }));

        this.arrows = [];

        // Spawn player
        const spawnPoint = (respawnAtCheckpoint && this.activeCheckpoint)
          ? this.activeCheckpoint
          : data.spawn;
        this.player.reset(spawnPoint.x, spawnPoint.y);
        camera.x = this.player.x;
        camera.y = this.player.y;
      }

      // ===================================================================
      // OVERLAY SCREENS: TITLE -> MAP SELECT -> PLAY -> RESULT
      // ===================================================================
      setOverlayMode(mode, { kanji, title, subtitle, caption } = {}) {
        const el = (id) => document.getElementById(id);
        // Any overlay means the run is not on screen; the boss bar goes with it
        // (a pause is the one case where it is worth leaving up).
        if (mode !== 'paused') this.hideBossBar();
        if (kanji !== undefined) el('overlayKanji').textContent = kanji;
        if (title !== undefined) el('overlayTitle').textContent = title;
        if (subtitle !== undefined) el('overlaySubtitle').textContent = subtitle;
        if (caption !== undefined) el('playCaption').textContent = caption;

        // The round play button belongs to the splash and the pause screen only
        const showPlay = (mode === 'title' || mode === 'paused');
        el('overlayActions').classList.toggle('hidden', !showPlay);
        el('mapSelect').classList.toggle('hidden', mode !== 'maps');
        el('storyPanel').classList.toggle('hidden', mode !== 'story');
        el('resultPanel').classList.toggle('hidden', mode !== 'result');
        el('boardPanel').classList.toggle('hidden', mode !== 'board');
        el('overlayTitle').classList.toggle('compact',
          mode === 'maps' || mode === 'result' || mode === 'board' || mode === 'story');
        // Only the splash advertises which chapter Play would resume
        el('storyBadge').classList.toggle('hidden', mode !== 'title');

        el('overlay').classList.remove('hidden');
        this.overlayMode = mode;
      }

      setOverlayButtons({ retry = false, next = false, maps = false, board = false,
                          story = false, retryLabel = 'Retry Map',
                          nextLabel = 'Next Map' } = {}) {
        const pairs = { btnRetry: retry, btnNext: next, btnStory: story,
                        btnBoard: board, btnMaps: maps };
        for (const id in pairs) {
          document.getElementById(id).classList.toggle('hidden', !pairs[id]);
        }
        document.getElementById('btnRetry').textContent = retryLabel;
        document.getElementById('btnNext').textContent = nextLabel;
        document.getElementById('overlayBtnRow')
          .classList.toggle('hidden', !(retry || next || maps || board || story));
      }

      // ===================================================================
      // STORY MODE
      // ===================================================================
      // The splash Play button lands here, so this is the game's front door.
      // A chapter is one authored map plus the scene that opens it, the barks
      // that run over it and the scene that closes it. Progress is by reaching
      // the gate — par still exists, but it seals free play, never the story.
      // Nobody should be stopped from finding out what happens next.

      // The chapter Play would resume: the furthest reached, clamped to what
      // actually exists in case a save outlives a shorter chapter list.
      currentChapter() {
        return Math.max(0, Math.min(STORY.length - 1, Save.get('storyChapter') || 0));
      }

      showTitle() {
        this.mode = 'stage';
        this.isRunning = false;
        this.isPaused = false;
        Bark.clear();
        audio.setMuted(false);
        const ch = this.currentChapter();
        const done = Save.get('storyDone');
        const badge = document.getElementById('storyBadge');
        badge.textContent = done
          ? 'The road walked · Chapter ' + mapNo(ch) + ' — ' + STORY[ch].name
          : (ch === 0 ? 'Story · Chapter 01 — ' + STORY[0].name
                      : 'Continue · Chapter ' + mapNo(ch) + ' — ' + STORY[ch].name);
        this.setOverlayMode('title', {
          kanji: '墨',
          title: 'SUMI',
          subtitle: 'Shadow of the Brush',
          caption: artReady ? (ch === 0 && !done ? 'Begin the story' : 'Continue the story')
                            : 'Loading'
        });
        this.setOverlayButtons({ story: true, maps: true, board: true });
      }

      showStorySelect() {
        this.isRunning = false;
        this.isPaused = false;
        Bark.clear();
        audio.setMuted(false);
        window.GameEvents.gameplayStop();
        this.renderStoryPanel();
        const ch = this.currentChapter();
        this.setOverlayMode('story', {
          kanji: '道',
          title: 'THE ROAD',
          subtitle: Save.get('storyDone')
            ? 'Every chapter open · walk any of them again'
            : 'Chapter ' + mapNo(ch) + ' of ' + mapNo(STORY.length - 1) + ' — reach the gate to open the next'
        });
        this.setOverlayButtons({ maps: true, board: true });
      }

      renderStoryPanel() {
        const reached = this.currentChapter();
        const done = Save.get('storyDone');
        const best = Save.get('stageBest') || [];
        const panel = document.getElementById('storyPanel');
        panel.innerHTML = '';

        STORY.forEach((ch, i) => {
          // Finishing the game opens the whole road for replay
          const open = done || i <= reached;
          const cleared = done || i < reached;
          const row = document.createElement('button');
          row.className = 'chapter-row'
            + (open ? '' : ' locked')
            + (ch.warden ? ' boss' : '')
            + (cleared ? ' cleared' : '')
            + (i === reached && !done ? ' current' : '');
          row.setAttribute('aria-label',
            'Chapter ' + mapNo(i) + (open ? ': ' + ch.name : ': sealed'));
          row.type = 'button';
          row.disabled = !open;
          row.innerHTML =
            '<span class="chapter-kanji">' + ch.kanji + '</span>' +
            '<span>' +
              '<span class="chapter-no">CHAPTER ' + mapNo(i) + '</span>' +
              '<span class="chapter-name">' + escapeText(open ? ch.name : '— SEALED —') + '</span>' +
              '<span class="chapter-line">' +
                escapeText(open ? ch.epigraph : 'Walk the chapter before it') +
              '</span>' +
            '</span>' +
            '<span class="chapter-mark' + (ch.boss ? ' boss' : '') + '">' +
              (!open ? '鎖' : ch.boss ? escapeText(ch.boss) : (best[i] ? '極' : '')) +
            '</span>';
          if (open) {
            row.addEventListener('click', () => {
              audio.init();
              this.startChapter(i);
            });
          }
          panel.appendChild(row);
        });
      }

      // Resume the story from the splash. Replaying a chapter already seen
      // skips straight to the map; the scene is only forced the first time.
      startStory() {
        // The portal's storage tier can take up to three seconds to win the
        // race in the boot sequence, and until it does `currentChapter()` is
        // reading preLoad's guess. The Play button is deliberately never
        // disabled, so a player who presses it inside that window waits here
        // for half a second instead of being dropped back into chapter one.
        if (!saveReady) {
          // Pressing Play twice inside the window must not queue two chapters
          if (this.storyPending) return;
          this.storyPending = true;
          document.getElementById('playCaption').textContent = 'Finding the road';
          saveSettled.then(() => {
            this.storyPending = false;
            // They may have gone to the chapter list or free play meanwhile
            if (this.isRunning || Dialogue.active || this.overlayMode !== 'title') return;
            this.startChapter(this.currentChapter());
          });
          return;
        }
        this.startChapter(this.currentChapter());
      }

      startChapter(idx) {
        const ch = STORY[Math.max(0, Math.min(STORY.length - 1, idx))];
        this.chapterIdx = Math.max(0, Math.min(STORY.length - 1, idx));
        Bark.clear();
        document.getElementById('overlay').classList.add('hidden');
        window.GameEvents.gameplayStop();
        this.isRunning = false;

        const seen = Save.get('storySeen') || [];
        const first = seen.indexOf(this.chapterIdx) < 0;
        const begin = () => {
          // The chapter's own barks, armed and unfired
          this.runtimeBeats = (ch.beats || []).map(b => ({ ...b, fired: false }));
          this.startStage(this.chapterIdx, 'story');
        };

        if (first) {
          const nextSeen = seen.concat([this.chapterIdx]);
          Save.write({ storySeen: nextSeen });
          Dialogue.play(ch.open, begin);
        } else {
          begin();
        }
      }

      // Barks fire once, the first time the samurai gets past their x. They
      // never block: he keeps running and the line floats up over the top.
      updateBeats() {
        if (!this.runtimeBeats || !this.runtimeBeats.length) return;
        for (const b of this.runtimeBeats) {
          if (b.fired || this.player.x < b.x) continue;
          b.fired = true;
          Bark.say(b.who, b.text, 3.6);
        }
      }

      // The gate has been reached in story mode: bank the chapter, play the
      // closing scene, then put up the result.
      onChapterComplete(earned) {
        const idx = this.chapterIdx;
        const ch = STORY[idx];
        const isLast = idx >= STORY.length - 1;

        const reached = Save.get('storyChapter') || 0;
        const nextChapter = isLast ? reached : Math.max(reached, idx + 1);
        const wasDone = Save.get('storyDone');

        // Free play unlocks alongside the story, so a player who only ever
        // presses Play still ends up with every map open in the grid.
        const wasUnlocked = Save.get('stagesUnlocked') || 1;
        const best = (Save.get('stageBest') || []).slice();
        best[idx] = Math.max(best[idx] || 0, earned);

        Save.write({
          storyChapter: nextChapter,
          storyDone: wasDone || isLast,
          stageBest: best,
          stagesUnlocked: Math.max(wasUnlocked, Math.min(STAGE_CONFIGS.length, idx + 2)),
          coinsTotal: (Save.get('coinsTotal') || 0) + this.runCoins,
          highScore: Math.max(Save.get('highScore') || 0, this.highScore),
          seenControlHint: true
        });
        this.runCoins = 0;

        // Close, then the epilogue on the very first finish, then the card
        const after = () => this.showChapterResult(idx, earned, isLast);
        const closing = (ch.close || []).slice();
        if (isLast && ch.epilogue && !wasDone) {
          Dialogue.play(closing.concat(ch.epilogue), after);
        } else {
          Dialogue.play(closing, after);
        }
      }

      showChapterResult(idx, earned, isLast) {
        const ch = STORY[idx];
        const stage = STAGE_CONFIGS[idx];
        const par = stage.requiredScore;
        const best = (Save.get('stageBest') || [])[idx] || 0;
        const mastered = earned >= par;

        document.getElementById('resultRows').innerHTML =
          `<div class="result-row"><span>This run</span><span>${earned.toLocaleString()}</span></div>` +
          `<div class="result-row is-goal"><span>Mastery par</span><span>${par.toLocaleString()}</span></div>` +
          `<div class="result-row"><span>Best here</span><span>${best.toLocaleString()}</span></div>`;

        const fill = document.getElementById('resultGaugeFill');
        fill.classList.toggle('pass', mastered);
        fill.style.width = '0%';
        requestAnimationFrame(() => {
          fill.style.width = Math.min(100, Math.round(earned / par * 100)) + '%';
        });

        // Par is not a wall in the story — it is a seal worth collecting. The
        // verdict says which of the two happened without implying a failure.
        const verdict = document.getElementById('resultVerdict');
        verdict.classList.toggle('pass', mastered);
        verdict.classList.toggle('fail', false);
        if (isLast) {
          verdict.textContent = 'The chain is open. The road belongs to no one.';
        } else if (mastered) {
          verdict.textContent = `Walked and mastered. ${STORY[idx + 1].name} lies ahead.`;
        } else {
          verdict.textContent =
            `${(par - earned).toLocaleString()} short of the mastery seal — the road opens anyway.`;
        }

        this.setOverlayMode('result', {
          kanji: isLast ? '解' : (mastered ? '極' : '道'),
          title: isLast ? 'THE ROAD ENDS' : 'CHAPTER CLEARED',
          subtitle: 'Chapter ' + mapNo(idx) + ' — ' + ch.name
        });
        this.retryAction = () => this.startChapter(idx);
        this.setOverlayButtons({
          retry: true, next: !isLast, story: true, maps: isLast,
          retryLabel: 'Walk It Again', nextLabel: 'Next Chapter'
        });
      }

      renderMapSelect() {
        const unlocked = Save.get('stagesUnlocked') || 1;
