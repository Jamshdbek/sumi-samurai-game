      // the warm halo is what actually catches the eye at running speed.
      drawMonCoin(ctx, x, y) {
        const t = performance.now();
        const f = frameAt(t / 1000 + x * 0.013, 10, 6);
        const bob = Math.sin(t / 260 + x) * 3;
        const cy = y + bob;
        // The coin's outer ring is dark brown, and two of the six frames are
        // edge-on and nearly invisible, so the halo carries the read.
        glow(ctx, x, cy, 27, '255, 216, 120', 0.55 + Math.sin(t / 300 + x) * 0.13);
        if (!drawFrame(ctx, 'coin', f, 32, 32,
                       Math.round(x - 16), Math.round(cy - 16), 32, 32)) {
          ctx.fillStyle = CONFIG.GOLD;
          ctx.beginPath(); ctx.arc(x, cy, 8, 0, Math.PI * 2); ctx.fill();
        }
      }

      drawGoldenKoban(ctx, x, y) {
        const t = performance.now();
        const f = frameAt(t / 1000, 8, 6);
        const bob = Math.sin(t / 300) * 3;
        // The one rare pick-up on a map must not be walked past
        glow(ctx, x, y + bob, 46, '242, 193, 78', 0.5 + Math.sin(t / 400) * 0.12);
        drawFrame(ctx, 'chest', f, 64, 64,
                  Math.round(x - 26), Math.round(y + bob - 26), 52, 52);
      }

      drawPowerupItem(ctx, pw) {
        const key = pw.type === 'zanshin' ? 'crystalA'
                  : pw.type === 'edge' ? 'crystalB' : 'crystalC';
        // One colour per power, so which one is on the ground is legible from
        // across the screen and not only when standing on top of it.
        const rgb = pw.type === 'edge' ? '224, 69, 59'
                  : pw.type === 'zanshin' ? '111, 216, 232' : '242, 193, 78';
        const t = performance.now();
        const bob = Math.sin(t / 240 + pw.x) * 4;
        glow(ctx, pw.x, pw.y + bob, 38, rgb, 0.5 + Math.sin(t / 300 + pw.x) * 0.14);
        drawProp(ctx, key, pw.x, pw.y + bob + 22, 1.5);
      }

      // Checkpoint signpost. Lit ones carry a flame so the state is obvious.
      drawLantern(ctx, x, y, active) {
        drawProp(ctx, active ? 'signpost' : 'signpostAlt', x, y, 1.3);
        if (active) {
          const t = performance.now() / 130;
          const fy = y - 48 + Math.sin(t * 0.7) * 1.5;
          glow(ctx, x, fy, 34, '242, 193, 78', 0.55 + Math.sin(t) * 0.15);
          ctx.save();
          ctx.fillStyle = '#FFEDB0';
          ctx.beginPath();
          ctx.arc(x, fy, 4 + Math.sin(t) * 1, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // The way out of the map
      // The exit. cave_entrance.png is a plain rectangle meant to be set into
      // a wall, so a hillside is tiled behind it first — free-standing, its
      // straight edges read as a texture swatch rather than a cave.
      drawToriiGate(ctx, x, y, sealed = false) {
        const t = performance.now();
        const cols = 9, rows = 5;
        const bx = Math.round(x - (cols * TILE) / 2);
        const by = Math.round(y - rows * TILE);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const left = c === 0, right = c === cols - 1;
            let cell;
            if (r === 0) cell = left ? TSET.topL : right ? TSET.topR : TSET.topM;
            else cell = left ? TSET.midL : right ? TSET.midR : TSET.midM;
            drawTile(ctx, cell, bx + c * TILE, by + r * TILE);
          }
        }
        // Light behind the mouth, then the mouth over it: lit from within.
        // While a boss holds the map the light goes out and turns crimson —
        // the gate reads as shut without a line of text saying so.
        const lamp = sealed ? '224, 69, 59' : '242, 193, 78';
        const lit = sealed ? 0.20 : 0.42;
        glow(ctx, x, y - 52, 96, lamp, lit + Math.sin(t / 320) * 0.12);
        if (usable('cave')) {
          const w = 192, h = 128;
          ctx.drawImage(IMG.cave, Math.round(x - w / 2), Math.round(y - h), w, h);
        }
        glow(ctx, x, y - 44, 44, sealed ? '255, 150, 140' : '255, 236, 170',
             (sealed ? 0.18 : 0.32) + Math.sin(t / 320) * 0.1);
        if (sealed) {
          // A pair of crossed shimenawa ropes drawn straight over the mouth.
          ctx.save();
          ctx.globalAlpha = 0.72 + Math.sin(t / 260) * 0.12;
          ctx.strokeStyle = CONFIG.CRIMSON;
          ctx.lineWidth = 5; ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x - 46, y - 106); ctx.lineTo(x + 46, y - 14);
          ctx.moveTo(x + 46, y - 106); ctx.lineTo(x - 46, y - 14);
          ctx.stroke();
          ctx.restore();
        }
      }

      // ---- Enemies --------------------------------------------------------
      // The Forest Bosses sheets are all drawn facing LEFT, the opposite of the
      // samurai sheets. So facing +1 (walking right) is the one that needs the
      // horizontal flip here — without it every enemy moonwalks.
      drawEnemySprite(ctx, e, kind, clip, fps) {
        const art = ENEMY_ART[kind];
        const set = art[clip] || art.idle;
        const scale = art.scale;
        const dw = Math.round(CELL * scale), dh = dw;
        const f = frameAt(e.animT || 0, fps, set[1]);
        const smooth = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = false;
        ctx.save();
        // Feet on the bottom of the hitbox, same contract as the samurai
        ctx.translate(Math.round(e.curX), Math.round((e.curY || e.y) + 20));
        ctx.scale(e.facing < 0 ? 1 : -1, 1);
        if (!drawFrame(ctx, set[0], f, CELL, CELL, Math.round(-dw / 2), -dh, dw, dh)) {
          ctx.fillStyle = CONFIG.CRIMSON;
          ctx.fillRect(-16, -40, 32, 40);
        }
        ctx.restore();
        ctx.imageSmoothingEnabled = smooth;
      }

      drawOni(ctx, e) {
        // Two bruiser sheets, chosen off the spawn x so a map shows both and
        // the choice is stable across respawns.
        const kind = (Math.floor(e.x / 97) % 2 === 0) ? 'brute1' : 'brute2';
        const moving = Math.abs(e.vx) > 5;
        this.drawEnemySprite(ctx, e, kind, moving ? 'walk' : 'idle', moving ? 10 : 6);
      }

      drawArcher(ctx, e) {
        // Winding up to shoot is the only tell the player gets, so it is drawn
        const winding = e.shootTimer < 0.55;
        e.facing = (this.player.x < e.curX) ? -1 : 1;
        this.drawEnemySprite(ctx, e, 'caster', winding ? 'attack' : 'idle', winding ? 11 : 6);
      }

      // ---- Boss ------------------------------------------------------------
      // The state machine picks the clip; the clip is a list of expression
      // frames. Everything else here is the read: a ground shadow so a hovering
      // 150px sprite still has a position, an aura that flares on the tell, and
      // a white flash while it is invulnerable from the last hit.
      drawBoss(ctx, e) {
        const art = BOSS_ART[e.kind] || BOSS_ART.mech;
        const enraged = e.hp <= e.maxHp / 2;
        let clip, fps;
        if (e.state === 'hurt') { clip = BOSS_CLIPS.hurt; fps = 1; }
        else if (e.state === 'wind') { clip = BOSS_CLIPS.wind; fps = 9; }
        else if (e.state === 'strike') { clip = BOSS_CLIPS.strike; fps = 12; }
        else { clip = enraged ? BOSS_CLIPS.rage : BOSS_CLIPS.hunt; fps = 1.6; }
        // Death is the one clip that plays through instead of looping: cracked
        // open first, then broken, and it holds broken while it fades.
        const frame = e.state === 'dying'
          ? BOSS_CLIPS.dying[e.deathT < 0.4 ? 0 : 1]
          : clip[frameAt(e.animT || 0, fps, clip.length)];

        const dw = Math.round(CELL * art.scale), dh = dw;
        const x = Math.round(e.curX), y = Math.round(e.curY);
        const dying = e.state === 'dying';
        const fade = dying ? Math.max(0, 1 - e.deathT / 1.5) : 1;

        // Ground shadow, so the hover reads as height and not as a decal
        if (!dying) {
          ctx.save();
          ctx.globalAlpha = 0.28;
          ctx.fillStyle = CONFIG.INK_BLACK;
          ctx.beginPath();
          ctx.ellipse(x, (e.floorY || e.homeY + 96) - 4, 52, 12, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // The aura swells through the wind-up and snaps on the strike, which is
        // the same information as the sprite change, one glance earlier.
        const tell = e.state === 'wind' ? e.stateT / 0.55
                   : e.state === 'strike' ? 1.2 : 0;
        glow(ctx, x, y, 92 + tell * 46, art.glow,
             (0.20 + tell * 0.34) * fade);

        const smooth = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = false;
        ctx.save();
        if (fade < 1) ctx.globalAlpha = fade;
        ctx.translate(x, y);
        // The boss art faces LEFT like the enemy sheets, so +1 is the flip
        ctx.scale(e.facing < 0 ? 1 : -1, 1);
        if (!drawFrame(ctx, art.img, frame, CELL, CELL,
                       Math.round(-dw / 2), Math.round(-dh / 2), dw, dh)) {
          ctx.fillStyle = CONFIG.CRIMSON;
          ctx.fillRect(-44, -52, 88, 104);
        }
        ctx.restore();

        // Hit flash: the same sprite drawn again, blown out to white
        if (e.invulnT > 0 && !dying) {
          ctx.save();
          ctx.globalAlpha = Math.min(0.85, e.invulnT * 1.9);
          ctx.globalCompositeOperation = 'lighter';
          ctx.translate(x, y);
          ctx.scale(e.facing < 0 ? 1 : -1, 1);
          drawFrame(ctx, art.img, frame, CELL, CELL,
                    Math.round(-dw / 2), Math.round(-dh / 2), dw, dh);
          ctx.restore();
        }
        ctx.imageSmoothingEnabled = smooth;
      }

      // ---- Warden -----------------------------------------------------------
      // Unlike the hovering bosses, whose "animation" is a cycle of stills,
      // a warden has real clips — so the frame is driven off the move's own
      // clock rather than a loop. The swing on screen therefore lands on the
      // exact frame the hitbox goes live, which is the entire reason these
      // fights can be read at all.
      //
      // These sheets face RIGHT (the enemy sheets face left), so it is
      // facing -1 that gets the flip here.
      drawWarden(ctx, e) {
        const art = WARDEN_ART[e.kind] || WARDEN_ART.kani;
        const cell = art.cell;
        const dw = Math.round(cell * art.scale), dh = dw;
        const x = Math.round(e.curX), y = Math.round(e.curY);
        const dying = e.state === 'dying';
        const fade = dying ? Math.max(0, 1 - Math.max(0, e.deathT - 1.2) / 1.2) : 1;

        // Which clip, how far through it, and that clip's centring nudge
        let key, frames, frame, ox = 0;
        const pick = (name) => {
          const c = art.clips[name] || art.clips.idle;
          key = c[0]; frames = c[1]; ox = c[3] || 0;
          return c;
        };

        if (dying) {
          pick('dead');
          frame = Math.min(frames - 1, Math.floor(e.deathT / 0.13));
        } else if (e.state === 'hurt') {
          pick('hurt');
          // hurtT counts down from 0.26 (or 0.34 on an interrupted meal), so
          // the elapsed time is clamped at both ends before it picks a cell.
          frame = Math.max(0, Math.min(frames - 1,
                  Math.floor((0.26 - Math.max(0, e.hurtT)) / 0.09)));
        } else if (e.state === 'move' && e.move) {
          const m = e.move;
          // Mid-air on a leap: the jump sheet, held on its apex frames
          if (e.airborne && art.clips.jump && m.kind === 'leap' && m.clip !== 'jump') {
            pick('jump');
            frame = Math.min(frames - 1, 3 + (e.vy > 0 ? 2 : 0));
          } else {
            pick(m.clip);
            const wind = m.wind * (e.phase === 3 ? 0.78 : e.phase === 2 ? 0.9 : 1);
            const total = wind + m.active + m.rest;
            // The clip is stretched over the whole move, so the telegraph is
            // literally the wind-up frames and the recovery the follow-through.
            const p = Math.max(0, Math.min(0.9999, e.moveT / total));
            frame = Math.min(frames - 1, Math.floor(p * frames));
          }
        } else {
          const c = pick(e.gait === 'run' ? 'run' : e.gait === 'walk' ? 'walk' : 'idle');
          frame = frameAt(e.animT || 0, c[2] || 8, frames);
        }

        // Ground shadow. He stands on the floor, so it goes under his feet and
        // shrinks as he leaves it — the only cue for how high a leap is.
        const lift = Math.max(0, (e.floorY - e.curY));
        if (!dying) {
          ctx.save();
          ctx.globalAlpha = 0.3 * Math.max(0.25, 1 - lift / 260);
          ctx.fillStyle = CONFIG.INK_BLACK;
          ctx.beginPath();
          ctx.ellipse(x, e.floorY - 3, 40 * Math.max(0.4, 1 - lift / 400), 9, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // The telegraph. An ink ring that closes as the wind-up runs out, plus
        // the aura swelling under him — the same information twice, because a
        // player watching their own feet still has to catch it.
        const win = this.wardenWindow(e);
        if (!dying && win === 'wind') {
          const m = e.move;
          const wind = m.wind * (e.phase === 3 ? 0.78 : e.phase === 2 ? 0.9 : 1);
          const p = Math.max(0, Math.min(1, e.moveT / wind));
          glow(ctx, x, y - 46, 70 + p * 40, art.glow, 0.16 + p * 0.3);
          ctx.save();
          ctx.strokeStyle = `rgba(${art.glow}, ${0.35 + p * 0.5})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          // Sweeps clockwise from the top and completes exactly on the strike
          ctx.arc(x, y - 52, 62 - p * 18, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        } else if (!dying && win === 'active') {
          glow(ctx, x, y - 46, 116, art.glow, 0.34);
        } else if (!dying) {
          glow(ctx, x, y - 46, 64, art.glow, e.phase === 3 ? 0.22 : 0.13);
        }

        // Applied inside the facing flip, so it mirrors with the body
        const dx = Math.round(-dw / 2 + ox * art.scale);

        const smooth = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = false;
        ctx.save();
        if (fade < 1) ctx.globalAlpha = fade;
        ctx.translate(x, y);
        ctx.scale(e.facing < 0 ? -1 : 1, 1);
        // Bottom-aligned artwork: the bottom of the drawn cell is the floor
        if (!drawFrame(ctx, key, frame, cell, cell, dx, -dh, dw, dh)) {
          ctx.fillStyle = CONFIG.CRIMSON;
          ctx.fillRect(-art.boxW / 2, -art.boxH, art.boxW, art.boxH);
        }
        ctx.restore();

        // The raised guard, drawn as a hard plate of light in front of him.
        // It has to look like a wall or being pushed off it feels unfair.
        if (e.guarding) {
          const t = performance.now() / 220;
          ctx.save();
          ctx.translate(x + e.facing * 26, y - art.boxH / 2 - 6);
          ctx.globalAlpha = 0.5 + Math.sin(t) * 0.12;
          ctx.strokeStyle = '#BFD4FF';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(0, 0, 20, art.boxH * 0.52, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 0.16;
          ctx.fillStyle = '#BFD4FF';
          ctx.fill();
          ctx.restore();
        }

        // Hit flash: the same frame again, blown out white
        if (e.invulnT > 0 && !dying) {
          ctx.save();
          ctx.globalAlpha = Math.min(0.8, e.invulnT * 1.9);
          ctx.globalCompositeOperation = 'lighter';
          ctx.translate(x, y);
          ctx.scale(e.facing < 0 ? -1 : 1, 1);
          drawFrame(ctx, key, frame, cell, cell, dx, -dh, dw, dh);
          ctx.restore();
        }
        ctx.imageSmoothingEnabled = smooth;

        if (CONFIG.DEBUG_HITBOX) {
          const hb = wardenBox(e);
          ctx.save();
          ctx.strokeStyle = CONFIG.LEAF; ctx.lineWidth = 1;
          ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
          const hit = this.wardenHitBox(e);
          if (hit) {
            ctx.strokeStyle = CONFIG.CRIMSON;
            ctx.strokeRect(hit.x, hit.y, hit.w, hit.h);
          }
          ctx.restore();
        }
      }

      // The floating crystal: it drifts, so it never needs a ground contact
      drawLanternEnemy(ctx, e) {
        const f = frameAt(e.animT || 0, 9, 6);
        const smooth = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = false;
        if (!drawFrame(ctx, 'crystal', f, 160, 128,
                       Math.round(e.curX - 40), Math.round(e.curY - 32), 80, 64)) {
          ctx.fillStyle = CONFIG.CRIMSON;
          ctx.beginPath(); ctx.arc(e.curX, e.curY, 14, 0, Math.PI * 2); ctx.fill();
        }
        ctx.imageSmoothingEnabled = smooth;
      }

      // Scenery seeded off the map so it is stable between frames and runs
      drawScenery(ctx, viewL, viewR) {
        if (!this.sceneryProps) return;
        for (const s of this.sceneryProps) {
          if (s.x < viewL - 120 || s.x > viewR + 120) continue;
          drawProp(ctx, s.key, s.x, s.y, s.scale, s.alpha);
        }
      }
    }

    // =====================================================================
    // 9. BOOTSTRAP INITIALIZATION
    // =====================================================================
    // Tiles, sheets and parallax plates all have to be decoded before the
    // first frame can draw; the Play button stays disabled until they are.
    loadArt();

    // Instantiate game immediately so the overlay is up while art streams in
    const game = new Game();
    window.game = game;
    requestAnimationFrame((t) => game.loop(t));

    // Parallel SDK Boot Sequence (never blocks the Play button)
    const saveSettled = (async function bootCrazyGamesAndStorage() {
      let sdkInitSuccess = false;
      try {
        const initPromise = (async () => {
          if (window.CrazyGames && window.CrazyGames.SDK && typeof window.CrazyGames.SDK.init === 'function') {
            await window.CrazyGames.SDK.init();
            return true;
          }
          return false;
        })();

        const timeoutPromise = new Promise((resolve) => setTimeout(() => resolve(false), 3000));
        sdkInitSuccess = await Promise.race([initPromise, timeoutPromise]);
      } catch (e) {
        console.warn('[CrazyGames] SDK init error / timeout caught:', e);
        sdkInitSuccess = false;
      }

      // Resolve the single 3-tier Save wrapper
      await Save.init(sdkInitSuccess);
      saveReady = true;

      // Sync state to audio and HUD
      if (Save.get('muted')) {
        audio.muted = true;
        if (audio.masterGain && audio.ctx) {
          audio.masterGain.gain.setValueAtTime(0, audio.ctx.currentTime);
        }
        const muteBtn = document.getElementById('muteBtn');
        if (muteBtn) muteBtn.textContent = '🔇';
      }

      if (game) {
        game.highScore = Math.max(game.highScore, Save.get('highScore') || 0);
        game.updateHUD();
        // Until this point the save came from preLoad's synchronous
        // localStorage read, which is NOT the authority when the portal SDK
        // is up: Save.init has just re-read the real store and may have moved
        // the player several chapters on. The splash advertises which chapter
        // Play resumes and Play acts on it immediately, so both have to be
        // rebuilt off the settled save rather than the guess.
        if (game.overlayMode === 'title') game.showTitle();
        else if (game.overlayMode === 'story') game.renderStoryPanel();
      }

      // Signed-in CrazyGames players get their own name on the board without
      // having to type one. Anything here is best-effort: it must never throw.
      try {
        const u = window.CrazyGames && window.CrazyGames.SDK && window.CrazyGames.SDK.user;
        if (sdkInitSuccess && u && typeof u.getUser === 'function') {
          const profile = await u.getUser();
          if (profile && profile.username) cgUserName = String(profile.username).slice(0, 10).toUpperCase();
        }
      } catch (e) {}

      if (Save.get('seenControlHint')) {
        const hint = document.getElementById('controlsHint');
        if (hint) hint.classList.add('faded');
      }
    })();

  })();
  </script>
</body>
</html>
